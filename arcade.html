const K = {};

window.addEventListener("keyup",  e => { K[e.code] = false; });

// ─── UTILS ──────────────────────────────────────────────────
function rnd(a,b){ return a + Math.random()*(b-a); }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function lerp(a,b,t){ return a+(b-a)*t; }
function overlaps(a,b){ return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y; }

// ─── RETRO 8-BIT AUDIO (pure Web Audio API, no external files) ─
let actx=null;
function ensureAudio(){
  if(!actx){
    try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(err){ actx=null; }
  }
  if(actx && actx.state==="suspended") actx.resume();
  startBGM();
}
window.addEventListener("keydown", ensureAudio, {once:true});
window.addEventListener("pointerdown", ensureAudio, {once:true});

// ─── CHIPTUNE BGM (bassline + arpeggio, pure oscillators, loops forever) ──
let bgmStarted=false;
const BGM_BASS=[110.00,110.00,130.81,146.83, 110.00,110.00,164.81,146.83]; // A2 A2 C3 D3 | A2 A2 E3 D3
const BGM_ARP=[220.00,277.18,329.63,392.00]; // A3 C#4 E4 G4 arpeggio, cycles independently of the bass
let bgmStep=0;
function startBGM(){
  if(bgmStarted||!actx) return;
  bgmStarted=true;
  function tick(){
    if(!actx) return;
    // FEVER MODE speeds the whole loop up — read live each tick so tempo
    // snaps immediately when fever starts/ends rather than waiting a bar
    const stepSec=feverMode?0.105:0.155;
    const now=actx.currentTime;

    // bassline — punchy short square note, one per step (a bit louder and
    // brighter in fever for extra energy)
    const bf=BGM_BASS[bgmStep%BGM_BASS.length];
    const bo=actx.createOscillator(), bgn=actx.createGain();
    bo.type="square"; bo.frequency.setValueAtTime(feverMode?bf*2:bf,now);
    bgn.gain.setValueAtTime(0.0001,now);
    bgn.gain.linearRampToValueAtTime(feverMode?0.14:0.11,now+0.008);
    bgn.gain.exponentialRampToValueAtTime(0.0001,now+stepSec*0.9);
    bo.connect(bgn); bgn.connect(actx.destination);
    bo.start(now); bo.stop(now+stepSec);

    // arpeggio — plucky triangle note layered on top, two per bass step for
    // energy (three per step, faster, during fever)
    const subdivisions=feverMode?3:2;
    for(let sub=0;sub<subdivisions;sub++){
      const at=now+sub*stepSec/subdivisions;
      const af=BGM_ARP[(bgmStep*subdivisions+sub)%BGM_ARP.length];
      const ao=actx.createOscillator(), agn=actx.createGain();
      ao.type="triangle"; ao.frequency.setValueAtTime(feverMode?af*2:af,at);
      agn.gain.setValueAtTime(0.0001,at);
      agn.gain.linearRampToValueAtTime(feverMode?0.075:0.055,at+0.004);
      agn.gain.exponentialRampToValueAtTime(0.0001,at+(stepSec/subdivisions)*0.9);
      ao.connect(agn); agn.connect(actx.destination);
      ao.start(at); ao.stop(at+stepSec/subdivisions);
    }

    bgmStep++;
    setTimeout(tick,stepSec*1000);
  }
  tick();
}

// ─── CONTINUOUS LASER HUM (sustained oscillator while the beam fires) ──
let laserOsc=null, laserOscGain=null;
function startLaserSound(){
  if(!actx||laserOsc) return;
  laserOsc=actx.createOscillator(); laserOscGain=actx.createGain();
  laserOsc.type="sawtooth";
  laserOsc.frequency.setValueAtTime(520,actx.currentTime);
  laserOscGain.gain.setValueAtTime(0.0001,actx.currentTime);
  laserOscGain.gain.linearRampToValueAtTime(0.07,actx.currentTime+0.03);
  laserOsc.connect(laserOscGain); laserOscGain.connect(actx.destination);
  laserOsc.start();
}
function updateLaserSound(fever){
  if(!laserOsc) return;
  const now=actx.currentTime;
  const wob=520+Math.sin(now*40)*40+(fever?120:0);
  laserOsc.frequency.setValueAtTime(wob,now);
}
function stopLaserSound(){
  if(!laserOsc) return;
  const now=actx.currentTime;
  laserOscGain.gain.linearRampToValueAtTime(0.0001,now+0.05);
  laserOsc.stop(now+0.06);
  laserOsc=null; laserOscGain=null;
}

// retro "pew" — quick downward frequency-sweep square blip, fired on each shot
function playPew(){
  if(!actx) return;
  const now=actx.currentTime;
  const o=actx.createOscillator(), g=actx.createGain();
  o.type="square";
  o.frequency.setValueAtTime(900,now);
  o.frequency.exponentialRampToValueAtTime(180,now+0.09);
  g.gain.setValueAtTime(0.16,now);
  g.gain.exponentialRampToValueAtTime(0.001,now+0.1);
  o.connect(g); g.connect(actx.destination);
  o.start(now); o.stop(now+0.11);
}

// bright chime for coin pickups — pitch rises with the current chain count
function playChime(chainCount){
  if(!actx) return;
  const now=actx.currentTime;
  const freq=620+Math.min(chainCount,20)*35;
  const o=actx.createOscillator(), g=actx.createGain();
  o.type="triangle";
  o.frequency.setValueAtTime(freq,now);
  o.frequency.exponentialRampToValueAtTime(freq*1.5,now+0.08);
  g.gain.setValueAtTime(0.0001,now);
  g.gain.exponentialRampToValueAtTime(0.22,now+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,now+0.18);
  o.connect(g); g.connect(actx.destination);
  o.start(now); o.stop(now+0.2);
}

// noise-burst explosion for enemy kills — filtered white noise with a fast decay envelope
function playExplosion(){
  if(!actx) return;
  const now=actx.currentTime;
  const dur=0.28;
  const bufferSize=Math.floor(actx.sampleRate*dur);
  const buffer=actx.createBuffer(1,bufferSize,actx.sampleRate);
  const data=buffer.getChannelData(0);
  for(let i=0;i<bufferSize;i++) data[i]=(Math.random()*2-1)*(1-i/bufferSize);
  const noise=actx.createBufferSource(); noise.buffer=buffer;
  const filter=actx.createBiquadFilter();
  filter.type="lowpass";
  filter.frequency.setValueAtTime(1400,now);
  filter.frequency.exponentialRampToValueAtTime(90,now+dur);
  const g=actx.createGain();
  g.gain.setValueAtTime(0.35,now);
  g.gain.exponentialRampToValueAtTime(0.001,now+dur);
  noise.connect(filter); filter.connect(g); g.connect(actx.destination);
  noise.start(now); noise.stop(now+dur);
}

// rising energetic retro "power-up" sting — used both for the box breaking
// and for the power-up actually taking effect
function playPowerUp(){
  if(!actx) return;
  const now=actx.currentTime;
  const o=actx.createOscillator(), g=actx.createGain();
  o.type="square";
  o.frequency.setValueAtTime(220,now);
  o.frequency.exponentialRampToValueAtTime(900,now+0.22);
  g.gain.setValueAtTime(0.0001,now);
  g.gain.linearRampToValueAtTime(0.2,now+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,now+0.3);
  o.connect(g); g.connect(actx.destination);
  o.start(now); o.stop(now+0.31);
  // a fifth above, slightly delayed, for a fuller chiptune "power chord" rise
  const o2=actx.createOscillator(), g2=actx.createGain();
  o2.type="square";
  o2.frequency.setValueAtTime(330,now+0.03);
  o2.frequency.exponentialRampToValueAtTime(1320,now+0.25);
  g2.gain.setValueAtTime(0.0001,now+0.03);
  g2.gain.linearRampToValueAtTime(0.14,now+0.05);
  g2.gain.exponentialRampToValueAtTime(0.0001,now+0.32);
  o2.connect(g2); g2.connect(actx.destination);
  o2.start(now+0.03); o2.stop(now+0.33);
}

// alarm siren — alternating up/down warble for the boss's dramatic entrance
let sirenOsc=null, sirenGain=null, sirenInterval=null;
function startSiren(durationSec){
  if(!actx) return;
  const now=actx.currentTime;
  sirenOsc=actx.createOscillator(); sirenGain=actx.createGain();
  sirenOsc.type="sawtooth";
  sirenGain.gain.setValueAtTime(0.09,now);
  sirenOsc.connect(sirenGain); sirenGain.connect(actx.destination);
  sirenOsc.start(now);
  let up=true;
  sirenInterval=setInterval(()=>{
    if(!sirenOsc) return;
    const t0=actx.currentTime;
    sirenOsc.frequency.cancelScheduledValues(t0);
    sirenOsc.frequency.setValueAtTime(up?440:660,t0);
    sirenOsc.frequency.linearRampToValueAtTime(up?660:440,t0+0.35);
    up=!up;
  },350);
  setTimeout(stopSiren,durationSec*1000);
}
function stopSiren(){
  if(sirenInterval){ clearInterval(sirenInterval); sirenInterval=null; }
  if(sirenOsc){
    const now=actx?actx.currentTime:0;
    try{
      sirenGain.gain.linearRampToValueAtTime(0.0001,now+0.15);
      sirenOsc.stop(now+0.16);
    }catch(e){}
    sirenOsc=null; sirenGain=null;
  }
}

// ─── PARTICLES ──────────────────────────────────────────────
let particles = [];
function spawnParticles(x, y, n, colors, opts={}){
  for(let i=0;i<n;i++){
    const ang = rnd(0, Math.PI*2);
    const spd = rnd(opts.minSpd||40, opts.maxSpd||180);
    particles.push({
      x, y,
      vx: Math.cos(ang)*spd,
      vy: Math.sin(ang)*spd - (opts.upBias||0),
      life: 1, maxLife: rnd(opts.minLife||0.3, opts.maxLife||0.9),
      color: colors[Math.floor(Math.random()*colors.length)],
      size: rnd(opts.minSz||2, opts.maxSz||5),
      type: opts.type||"square",
      gravity: opts.gravity!==undefined ? opts.gravity : 220,
      // optional ground-bounce physics (used for enemy-kill debris) — settles
      // onto a platform instead of falling through it forever
      bounce: !!opts.bounce,
      restitution: opts.restitution!==undefined ? opts.restitution : 0.4,
      settled: false
    });
  }
}
function updateParticles(dt){
  particles = particles.filter(p=>{
    p.life -= dt/p.maxLife;
    p.vy += p.gravity*dt;
    p.x += p.vx*dt; p.y += p.vy*dt;

    if(p.bounce && !p.settled && p.vy>0){
      // platforms are stored in world space; particles live in screen space
      // (drawn without a further camX subtraction), so compare against each
      // platform's screen-space span here
      for(const pf of platforms){
        if(pf.lavaPit) continue;
        const psx=pf.x-camX;
        if(p.x>=psx && p.x<=psx+pf.w && p.y>=pf.y-4 && p.y<=pf.y+12){
          p.y=pf.y;
          p.vy*=-p.restitution;
          p.vx*=0.55; // friction bleeds horizontal speed off on every bounce
          if(Math.abs(p.vy)<45){ p.vy=0; p.settled=true; }
          break;
        }
      }
    } else if(p.settled){
      p.vx*=Math.pow(0.02,dt); // resting friction
    }
    return p.life > 0;
  });
  // hard safety cap — if something ever spawns particles faster than they can
  // expire, drop the oldest ones rather than letting the array grow unbounded
  if(particles.length>420) particles.splice(0,particles.length-420);
}
function drawParticles(){
  // additive "lighter" blending makes overlapping glows bloom into each other
  // (embers, sparks, jetpack flame) instead of just stacking flat alpha
  ctx.globalCompositeOperation="lighter";
  for(const p of particles){
    ctx.globalAlpha = Math.max(0,p.life);
    ctx.fillStyle = p.color;
    if(p.type==="circle"){
      ctx.beginPath(); ctx.arc(p.x,p.y,p.size*p.life,0,Math.PI*2); ctx.fill();
    } else {
      const s = p.size*p.life;
      ctx.fillRect(p.x-s/2, p.y-s/2, s, s);
    }
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation="source-over";
}

let coins = [];
// a straight row of n coins centered above a platform
function coinRow(px,py,pw,n,yOff){
  const arr=[];
  const totalW=(n-1)*28;
  const startX=px+pw/2-totalW/2;
  for(let i=0;i<n;i++) arr.push({x:startX+i*28, y:py+yOff});
  return arr;
}
// an arc of n coins tracing the jump path between two points (peaks upward by `height`)
function coinArc(x1,y1,x2,y2,n,height){
  const arr=[];
  for(let i=0;i<n;i++){
    const tt=i/(n-1);
    arr.push({x:lerp(x1,x2,tt), y:lerp(y1,y2,tt)-Math.sin(tt*Math.PI)*height});
  }
  return arr;
}
// a shallow arc of n coins hanging 30px above a platform, inset from its
// edges — the standard pickup line over any ledge
function coinArcOver(px,py,pw,n){
  const inset=Math.min(24,pw*0.18);
  return coinArc(px+inset, py-30, px+pw-inset, py-30, n, 22);
}
function initCoins(){
  coins = [];
  const positions = LEVELS[levelIndex].coins();
  for(const p of positions) coins.push({x:p.x,y:p.y,r:10,collected:false,popping:false,popT:0,bob:rnd(0,Math.PI*2),bobSpd:rnd(2,4)});
}

let playerBombs=[];
function firePlayerLavaBomb(){
  const mx=player.x+(player.facing>0?PLAYER_W+2:-4);
  const my=player.y+PLAYER_H*0.38;
  playerBombs.push({x:mx,y:my,vx:player.facing*280,vy:-360,life:0});
  player.vx-=player.facing*RECOIL_FORCE*1.5;
}
function explodePlayerBomb(bomb){
  const ex=bomb.x-camX, ey=bomb.y;
  spawnParticles(ex,ey,22,["#ff4400","#ff8800","#ffdd44","#ffffff"],
    {minSpd:100,maxSpd:300,minLife:0.3,maxLife:0.7,type:"circle",gravity:180});
  screenShake=Math.min(6,screenShake+5);
  hitStopTimer=Math.max(hitStopTimer,0.05);
  playExplosion();
  // heavy splash damage to every enemy (and the boss) within the blast radius
  const targets=[...enemies,...groundEnemies];
  if(boss&&!boss.dead&&boss.introState==="active") targets.push(boss);
  for(const e of targets){
    if(e.dead||e.dying) continue;
    const ecx=e.type==="ground"?e.x+e.w/2:e.x, ecy=e.y;
    if(Math.hypot(ecx-bomb.x,ecy-bomb.y)<70){
      e.hp-=e.type==="boss"?4:99;
      e.hitFlash=0.3;
      if(e.hp<=0 && !e.dying){ e.dying=true; e.deathTimer=0.07; }
    }
  }
}

const babySprite=new Image();

let babySpriteBBox=null;
babySprite.onload=()=>{
  babySpriteBBox=computeSpriteBBox(babySprite,false);
  babySpriteLoaded=true;
};
babySprite.src="baby.png";
// draws the captive at (cx,cy) scaled to `h` px tall, optionally mirrored
function drawBaby(cx,cy,h,faceDir){
  if(!babySpriteLoaded){
    ctx.fillStyle="#e8834a";
    ctx.beginPath(); ctx.ellipse(cx,cy,h*0.32,h*0.28,0,0,Math.PI*2); ctx.fill();
    return;
  }
  const bb=babySpriteBBox;
  const dh=h, dw=bb.w*(dh/bb.h);
  ctx.save();
  ctx.translate(cx,cy);
  ctx.scale(faceDir<0?-1:1,1);
  ctx.drawImage(babySprite,bb.x,bb.y,bb.w,bb.h,-dw/2,-dh/2,dw,dh);
  ctx.restore();
}

// ─── FLOATING TEXT (score pop-ups, combo/fever callouts) ──────
let floatingTexts=[];
function spawnFloatingText(x,y,text,color,size){
  floatingTexts.push({x,y,text,color,size:size||14,life:1,vy:-46});
}
function updateFloatingTexts(dt){
  floatingTexts=floatingTexts.filter(f=>{
    f.life-=dt/1.0;
    f.y+=f.vy*dt;
    f.vy*=Math.pow(0.06,dt);
    return f.life>0;
  });
}
function drawFloatingTexts(){
  ctx.textAlign="center";
  for(const f of floatingTexts){
    ctx.globalAlpha=Math.max(0,f.life);
    ctx.fillStyle=f.color;
    ctx.font=`bold ${f.size}px 'Courier New',monospace`;
    ctx.fillText(f.text,f.x,f.y);
  }
  ctx.globalAlpha=1;
  ctx.textAlign="left";
}

// ─── LOAD A STAGE ─────────────────────────────────────────────
// Rebuilds every piece of live level state from the LEVELS table. Called once
// at boot, on restart, and on each stage transition — nothing else needs to
// know which stage is running.
function loadLevel(i){
  levelIndex=clamp(i,0,LEVELS.length-1);
  const L=LEVELS[levelIndex];
  levelWidth=L.width;

  platforms=L.platforms.map(p=>({...p}));  // copies: drawPlatforms caches a
                                           // jagged edge profile on each one
  lavaPits=L.lavaPits.map(p=>({...p}));
  crystals=L.crystals.map(c=>({...c}));
  // small dark ceiling spikes, all within the top ~25px
  stalactites=[];
  const stalCount=Math.round(levelWidth/55);
  const shades=["#0e0b14","#15111c","#1b1622","#211b29"];
  for(let s=0;s<stalCount;s++){
    stalactites.push({
      x:rnd(0,levelWidth), len:rnd(9,25), w:rnd(6,14),
      shade:shades[Math.floor(Math.random()*shades.length)]
    });
  }

  levelHasArena=!!L.arena;
  ARENA_X_START=L.arena?L.arena.start:0;
  ARENA_X_END=L.arena?L.arena.end:0;
  cameraLock=false;
  arenaCleared=!levelHasArena;   // no arena ⇒ counts as already cleared
  arenaBannerTimer=0; arenaGoTimer=0;

  levelHasBoss=!!L.boss;
  BOSS_TRIGGER_X=L.boss?L.boss.triggerX:Infinity;

  initCoins(); initEnemies(); initGroundEnemies();
  initPowerUpBoxes(); initWeaponPickups(); initCages(); initBoss();

  // clear anything left over from the previous stage
  drops=[]; particles=[]; floatingTexts=[]; magmaBursts=[];
  playerBombs=[]; babyDinos=[]; laser=null;
  goalReached=false;
  camX=0;
  player.x=60; player.y=360; player.vx=0; player.vy=0;
  player.jetFuel=1;
}

// ─── SCORE / COMBO ────────────────────────────────────────────
let score = 0;
let chain = 0;
let chainTimer = 0;

let hitStopTimer = 0; // brief real-time freeze applied on impactful hits

// ─── GAME STATE ───────────────────────────────────────────────
let STATE = "playing"; // playing | dead | win

let lavaSurface = [];

genLavaSurface();
let t = 0;

// ─── PARALLAX BG ─────────────────────────────────────────────
// Stars
const stars=[];
for(let i=0;i<80;i++) stars.push({x:rnd(0,1200),y:rnd(0,200),r:rnd(.5,2),twinkle:rnd(0,Math.PI*2)});

// ─── DRAW HELPERS ────────────────────────────────────────────
function glow(color, blur){
  ctx.shadowColor = color; ctx.shadowBlur = blur;
}
function noGlow(){ ctx.shadowBlur=0; }

// ─── DRAW BACKGROUND ─────────────────────────────────────────
function drawBG(){
  // deep cave gradient
  const bg = ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,"#0a0618");
  bg.addColorStop(0.45,"#12083a");
  bg.addColorStop(1,"#1a0808");
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);

  // far: stars
  for(const s of stars){
    const sx = ((s.x - camX*0.04)%W+W)%W;
    const a = 0.4+0.4*Math.sin(t*1.5+s.twinkle);
    ctx.globalAlpha=a; ctx.fillStyle="#b8d4ff";
    ctx.beginPath(); ctx.arc(sx,s.y,s.r,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;

  // parallax: distant dark volcano silhouette (layer 1 — very far) with crater glow
  const vx = ((-camX*0.08+600)%W+W)%W - 200;
  // crater light: a strong upward-rising beam + radial bloom, drawn BEHIND the silhouette
  const craterX=vx+130, craterY=180;
  const flick=0.75+0.25*Math.sin(t*3);
  const beamG=ctx.createLinearGradient(craterX,craterY-120,craterX,craterY+10);
  beamG.addColorStop(0,"rgba(255,120,0,0)");
  beamG.addColorStop(1,`rgba(255,90,0,${0.35*flick})`);
  ctx.fillStyle=beamG;
  ctx.beginPath();
  ctx.moveTo(craterX-46,craterY+6);
  ctx.lineTo(craterX-10,craterY-120);
  ctx.lineTo(craterX+10,craterY-120);
  ctx.lineTo(craterX+46,craterY+6);
  ctx.closePath(); ctx.fill();
  const bloomG=ctx.createRadialGradient(craterX,craterY,2,craterX,craterY,50);
  bloomG.addColorStop(0,`rgba(255,180,60,${0.9*flick})`);
  bloomG.addColorStop(0.4,`rgba(255,90,0,${0.5*flick})`);
  bloomG.addColorStop(1,"rgba(255,60,0,0)");
  ctx.fillStyle=bloomG;
  ctx.beginPath(); ctx.arc(craterX,craterY,50,0,Math.PI*2); ctx.fill();

  // volcano cone silhouette — solid dark, drawn on top of the glow so the crater notch shows light
  ctx.fillStyle="#150822";
  ctx.beginPath();
  ctx.moveTo(vx,H); ctx.lineTo(vx+80,250); ctx.lineTo(vx+120,190);
  ctx.lineTo(vx+130,204); ctx.lineTo(vx+140,190);
  ctx.lineTo(vx+180,250); ctx.lineTo(vx+260,H); ctx.closePath(); ctx.fill();
  // bright molten crater core
  glow("#ff4400",18);
  ctx.fillStyle=`rgba(255,140,40,${0.85*flick})`;
  ctx.beginPath(); ctx.arc(craterX,craterY+2,7,0,Math.PI*2); ctx.fill();
  noGlow();

  // the volcano gently smokes — faint gray plumes drifting up from the crater
  if(Math.random()<0.12) spawnParticles(
    craterX+rnd(-6,6), craterY-6, 1,
    ["rgba(90,80,100,0.4)","rgba(70,65,85,0.35)"],
    {minSpd:6,maxSpd:16,upBias:26,minLife:1.5,maxLife:3,type:"circle",gravity:-6,minSz:4,maxSz:9}
  );

  // parallax: mountain silhouettes (layer 2)
  const mx = ((-camX*0.14)%W+W)%W;
  ctx.fillStyle="#150a28";
  for(let i=-1;i<3;i++){
    const bx=mx+i*420;
    ctx.beginPath();
    ctx.moveTo(bx,H); ctx.lineTo(bx+60,310); ctx.lineTo(bx+110,260);
    ctx.lineTo(bx+160,330); ctx.lineTo(bx+260,H); ctx.closePath(); ctx.fill();
  }

  // parallax: dark obsidian rock outcrops (nearest bg layer) — fast, but
  // deliberately a hair slower than the actual foreground platforms/player
  // (which scroll 1:1 with camX) so this layer still reads as background
  // depth instead of blending into the level geometry
  const fx = ((-camX*0.92)%W+W)%W;
  for(let i=-1;i<4;i++){
    const bx=fx+i*320+40;
    ctx.fillStyle="rgba(10,6,14,0.85)";
    ctx.beginPath();
    ctx.moveTo(bx-30,H);
    ctx.lineTo(bx-24,300);
    ctx.lineTo(bx+6,270);
    ctx.lineTo(bx+34,310);
    ctx.lineTo(bx+58,290);
    ctx.lineTo(bx+80,H);
    ctx.closePath(); ctx.fill();
    // lava-glow rim light along the ridge
    ctx.strokeStyle="rgba(255,90,20,0.35)"; ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(bx-24,300); ctx.lineTo(bx+6,270); ctx.lineTo(bx+34,310); ctx.lineTo(bx+58,290);
    ctx.stroke();
  }

  // cave ceiling rock edge
  ctx.fillStyle="#0d0820";
  ctx.beginPath();
  ctx.moveTo(0,0);
  const cPoints=[0,55,100,40,180,65,260,38,340,72,420,35,500,58,580,42,660,68,740,30,820,60,900,45];
  for(let i=0;i<cPoints.length;i+=2) ctx.lineTo(cPoints[i],cPoints[i+1]);
  ctx.lineTo(W,0); ctx.closePath(); ctx.fill();
}

// ─── CAVE DECOR: one fixed lava seam on the left edge ─────────
// lava_wall.png is used exactly ONCE, as a screen-fixed strip hugging the left
// edge — never tiled, never stamped across the ceiling or the running lane.
// (lava_ceiling.png is intentionally no longer drawn: the ceiling is plain
// dark rock now, see drawStalactites.)
const lavaWallSprite=new Image(); let lavaWallLoaded=false;
lavaWallSprite.onload=()=>{ lavaWallLoaded=true; };
lavaWallSprite.src="lava_wall.png";

const LEFT_SEAM_W=46;   // 40-50px strip down the left edge of the canvas

function drawCaveDecor(){
  if(!lavaWallLoaded) return;
  ctx.save();
  // source rect picks just the molten channel running down the middle of the
  // art, so squeezing it into a narrow strip doesn't smear the whole frame
  ctx.globalAlpha=0.55;
  ctx.drawImage(lavaWallSprite, 280,0,460,1024, 0,0,LEFT_SEAM_W,H);
  ctx.globalAlpha=1;
  // a little warm spill to the right of the seam
  ctx.globalCompositeOperation="lighter";
  const g=ctx.createLinearGradient(0,0,LEFT_SEAM_W*2.4,0);
  g.addColorStop(0,`rgba(255,110,20,${0.13+0.04*Math.sin(t*2)})`);
  g.addColorStop(1,"rgba(255,80,0,0)");
  ctx.fillStyle=g;
  ctx.fillRect(0,0,LEFT_SEAM_W*2.4,H);
  ctx.restore();
}

// ─── DRAW STALACTITES ────────────────────────────────────────
// Plain dark rock spikes along the very top edge (y 0..~25), drawn with paths
// rather than art. No lava, no glow — the ceiling stays simple and dark.
const HUD_CLEAR_X = W-286;   // nothing decorative is drawn right of this, so
                             // the neon CHAIN/SCORE panel sits on clean sky
function drawStalactites(){
  for(const s of stalactites){
    const sx = s.x - camX*0.96;
    if(sx<-40||sx>W+40) continue;
    if(sx>HUD_CLEAR_X) continue;   // keep the HUD panel's backdrop clear
    ctx.fillStyle=s.shade;
    ctx.beginPath();
    ctx.moveTo(sx-s.w/2,0);
    ctx.lineTo(sx+s.w/2,0);
    ctx.lineTo(sx,s.len);
    ctx.closePath();
    ctx.fill();
  }
}

// ─── DRAW PLATFORMS ──────────────────────────────────────────
function drawPlatforms(){
  for(const p of platforms){
    if(p.lavaPit) continue;
    const px = p.x - camX;
    if(px+p.w<0||px>W) continue;

    if(p.goal){
      // stone platform base
      ctx.fillStyle="#221e28"; ctx.fillRect(px,p.y,p.w,p.h);
      ctx.fillStyle="#4a4452"; ctx.fillRect(px,p.y,p.w,4);

      // the exit gate — a massive stone portal, dim and closed until the boss falls
      const gx=px+p.w/2, gateW=100, gateH=140, gy=p.y;
      const portalColor= gateOpen ? "#00ff88" : "#442244";
      glow(portalColor, gateOpen?26:8);
      ctx.fillStyle="#2a2030";
      ctx.beginPath();
      ctx.moveTo(gx-gateW/2,gy); ctx.lineTo(gx-gateW/2,gy-gateH+30);
      ctx.quadraticCurveTo(gx-gateW/2,gy-gateH,gx,gy-gateH);
      ctx.quadraticCurveTo(gx+gateW/2,gy-gateH,gx+gateW/2,gy-gateH+30);
      ctx.lineTo(gx+gateW/2,gy);
      ctx.closePath(); ctx.fill();
      // inner portal glow (bright open / dim closed)
      ctx.fillStyle= gateOpen ? "rgba(0,255,150,0.55)" : "rgba(60,20,60,0.5)";
      ctx.beginPath();
      ctx.moveTo(gx-gateW/2+14,gy-6); ctx.lineTo(gx-gateW/2+14,gy-gateH+38);
      ctx.quadraticCurveTo(gx-gateW/2+14,gy-gateH+14,gx,gy-gateH+14);
      ctx.quadraticCurveTo(gx+gateW/2-14,gy-gateH+14,gx+gateW/2-14,gy-gateH+38);
      ctx.lineTo(gx+gateW/2-14,gy-6);
      ctx.closePath(); ctx.fill();
      noGlow();
      if(!gateOpen){
        ctx.fillStyle="#aa88bb"; ctx.font="10px 'Courier New',monospace"; ctx.textAlign="center";
        ctx.fillText("SEALED",gx,gy-gateH/2);
        ctx.textAlign="left";
      }
    } else {
      // obsidian rock platform — jagged, grimy volcanic stone
      const isFloat = p.y < GROUND_Y;
      const g=ctx.createLinearGradient(0,p.y,0,p.y+p.h);
      g.addColorStop(0, isFloat?"#3a3540":"#2a2530");
      g.addColorStop(0.4, isFloat?"#221e28":"#1a1620");
      g.addColorStop(1, isFloat?"#100e14":"#0a080c");
      ctx.fillStyle=g;
      ctx.fillRect(px,p.y,p.w,p.h);

      // jagged rough top edge (pixel-noise silhouette)
      if(!p._edge || p._edgeW!==p.w){
        p._edgeW=p.w;
        p._edge=[];
        for(let ex=0; ex<=p.w; ex+=6) p._edge.push(rnd(0,4));
      }
      ctx.fillStyle= isFloat?"#4a4452":"#352f3c";
      ctx.beginPath();
      ctx.moveTo(px,p.y);
      for(let k=0;k<p._edge.length;k++) ctx.lineTo(px+k*6, p.y-p._edge[k]);
      ctx.lineTo(px+p.w,p.y);
      ctx.closePath(); ctx.fill();

      // thin light-toned pixel highlight along the rim
      ctx.fillStyle="rgba(220,205,190,0.35)";
      for(let k=0;k<p._edge.length;k++){
        ctx.fillRect(px+k*6, p.y-p._edge[k], 4, 2);
      }

      // scattered obsidian cracks
      ctx.strokeStyle="rgba(0,0,0,0.5)"; ctx.lineWidth=1;
      ctx.beginPath();
      ctx.moveTo(px+p.w*0.2,p.y+6); ctx.lineTo(px+p.w*0.28,p.y+16); ctx.lineTo(px+p.w*0.22,p.y+26);
      ctx.moveTo(px+p.w*0.65,p.y+8); ctx.lineTo(px+p.w*0.7,p.y+20);
      ctx.stroke();

      // faint hot ember glow seeping through lower cracks
      ctx.fillStyle=`rgba(255,90,20,${0.08+0.05*Math.sin(t*2+px)})`;
      ctx.fillRect(px,p.y+p.h*0.6,p.w,p.h*0.4);
    }
  }
}

// ─── DRAW LAVA ───────────────────────────────────────────────
function drawLava(){
  // strong upward-cast light bathing the walls/ceiling above the lava floor —
  // additive blending so it actually brightens the rock behind it (bloom)
  // rather than just laying flat translucent orange over it
  ctx.globalCompositeOperation="lighter";
  ctx.shadowColor="#ff4400"; ctx.shadowBlur=20;
  const upG=ctx.createLinearGradient(0,LAVA_Y-140,0,LAVA_Y);
  upG.addColorStop(0,"rgba(255,68,0,0)");
  upG.addColorStop(1,`rgba(255,90,0,${0.22+0.06*Math.sin(t*2)})`);
  ctx.fillStyle=upG;
  ctx.fillRect(0,LAVA_Y-140,W,140);
  ctx.shadowBlur=0;
  ctx.globalCompositeOperation="source-over";

  // lava floor fill
  const lavaGrad = ctx.createLinearGradient(0,LAVA_Y,0,H);
  lavaGrad.addColorStop(0,"#ff4400");
  lavaGrad.addColorStop(0.3,"#cc2200");
  lavaGrad.addColorStop(1,"#660000");
  ctx.fillStyle=lavaGrad;
  ctx.fillRect(0,LAVA_Y,W,H-LAVA_Y);

  // animated lava surface ripple
  glow("#ff6600",20);
  ctx.strokeStyle="#ff8800"; ctx.lineWidth=2;
  ctx.beginPath();
  for(let i=0;i<=W;i+=12){
    const worldX = (camX+i)/20;
    const h2 = 5*Math.sin(t*2+worldX)+3*Math.sin(t*3.1+worldX*1.7);
    i===0 ? ctx.moveTo(i,LAVA_Y+h2) : ctx.lineTo(i,LAVA_Y+h2);
  }
  ctx.stroke(); noGlow();

  // rising ember/spark particles continuously drifting up off the whole lava
  // surface — denser during fever for extra atmosphere
  if(Math.random()<(feverMode?0.9:0.6)) spawnParticles(
    rnd(0,W), LAVA_Y+rnd(-2,4), 1,
    ["#ffcc33","#ff8800","#ff4400"],
    {minSpd:8,maxSpd:30,upBias:70,minLife:0.6,maxLife:1.6,type:"circle",gravity:20,minSz:1,maxSz:3}
  );

  // lava pits (gaps between platforms)
  for(const lp of lavaPits){
    const lpx = lp.x - camX;
    if(lpx+lp.w<0||lpx>W) continue;
    // lava column rising in gap
    ctx.shadowColor="#ff4400"; ctx.shadowBlur=20;
    const g2=ctx.createLinearGradient(0,GROUND_Y-30,0,GROUND_Y+10);
    g2.addColorStop(0,"rgba(255,100,0,0.9)");
    g2.addColorStop(1,"rgba(200,40,0,0.2)");
    ctx.fillStyle=g2;
    ctx.fillRect(lpx,GROUND_Y-30,lp.w,40);
    // sparks
    if(Math.random()<0.3) spawnParticles(
      lpx+rnd(0,lp.w), GROUND_Y-20, 1,
      ["#ff8800","#ffcc00","#ff4400"],
      {minSpd:20,maxSpd:80,upBias:60,minLife:0.2,maxLife:0.6,type:"square",gravity:-50}
    );
    noGlow();
  }

  // lava waterfall cascading down the LEFT wall — the showpiece flow, with
  // animated streaks and drip particles instead of a static glowing bar
  {
    const lfx=0-camX;
    if(lfx>-40&&lfx<W+40){
      glow("#ff4400",18);
      const gWide=ctx.createLinearGradient(lfx,0,lfx+30,0);
      gWide.addColorStop(0,"#ff7700"); gWide.addColorStop(0.6,"#ff4400"); gWide.addColorStop(1,"rgba(255,80,0,0)");
      ctx.fillStyle=gWide;
      ctx.fillRect(lfx,60,30,220);
      // flowing vertical streaks sliding downward over time
      ctx.fillStyle="rgba(255,210,150,0.55)";
      for(let i=0;i<5;i++){
        const streakY=((t*160+i*55)%240)+60;
        ctx.fillRect(lfx+4+i*4,streakY,3,26);
      }
      noGlow();
      // occasional lava drip particles splashing off the base of the falls
      if(Math.random()<0.4) spawnParticles(
        lfx+rnd(4,26), 280, 1,
        ["#ff8800","#ffcc00","#ff4400"],
        {minSpd:20,maxSpd:60,upBias:-30,minLife:0.2,maxLife:0.5,type:"circle",gravity:200,minSz:1,maxSz:3}
      );
    }
  }
  // a smaller secondary lava fall on the right wall
  {
    const lfx=1100-camX;
    if(lfx>-40&&lfx<W+40){
      glow("#ff4400",15);
      const g3=ctx.createLinearGradient(lfx,0,lfx+20,0);
      g3.addColorStop(0,"#ff6600"); g3.addColorStop(1,"rgba(255,80,0,0)");
      ctx.fillStyle=g3;
      ctx.fillRect(lfx,80,20,200);
      noGlow();
    }
  }
}

// ─── DRAW CRYSTALS ───────────────────────────────────────────
function drawCrystals(){
  const colors=[["#a050ff","#d4aaff"],["#4488ff","#aaccff"],["#44ffaa","#aaffdd"]];
  crystals.forEach((cr,i)=>{
    const cx=cr.x-camX, cy=cr.y;
    const c=colors[i%colors.length];
    glow(c[0],16);
    ctx.fillStyle=c[0];
    ctx.beginPath();
    ctx.moveTo(cx,cy-28);ctx.lineTo(cx+10,cy);ctx.lineTo(cx+7,cy+16);
    ctx.lineTo(cx-7,cy+16);ctx.lineTo(cx-10,cy);ctx.closePath();ctx.fill();
    ctx.fillStyle=c[1];
    ctx.beginPath();
    ctx.moveTo(cx,cy-28);ctx.lineTo(cx+4,cy-10);ctx.lineTo(cx-4,cy-10);ctx.closePath();ctx.fill();
    noGlow();
  });
}

// ─── DRAW COINS ──────────────────────────────────────────────
function drawCoins(){
  for(const coin of coins){
    if(coin.collected) continue;
    const cx=coin.x-camX, cy=coin.popping?coin.y:coin.y+Math.sin(coin.bob)*4;
    if(coin.popping) ctx.globalAlpha=Math.max(0,1-coin.popT/0.35);
    glow("#ffdd00",14);
    // outer ring
    ctx.strokeStyle="#ffaa00"; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(cx,cy,coin.r,0,Math.PI*2); ctx.stroke();
    // inner fill
    ctx.fillStyle="#ffdd00";
    ctx.beginPath(); ctx.arc(cx,cy,coin.r-2,0,Math.PI*2); ctx.fill();
    // shine
    ctx.fillStyle="rgba(255,255,200,0.7)";
    ctx.beginPath(); ctx.arc(cx-3,cy-3,3,0,Math.PI*2); ctx.fill();
    noGlow();
    ctx.globalAlpha=1;
  }
}

// ─── ENEMY SPRITES ─────────────────────────────────────────────
const enemy1Sprite = new Image();
let enemy1Loaded = false;
enemy1Sprite.onload = () => { enemy1Loaded = true; };
enemy1Sprite.src = "enemy_fly.png";

const enemyGroundSprite = new Image();
let enemyGroundLoaded = false;
enemyGroundSprite.onload = () => { enemyGroundLoaded = true; };
enemyGroundSprite.src = "enemy_ground.png";

// shared: one full-bright white/yellow flash frame before a kill actually resolves
function drawDeathFlash(w,h){
  ctx.shadowColor="#fff9c4"; ctx.shadowBlur=16;
  ctx.fillStyle="#fffde7";
  ctx.fillRect(-w/2,-h/2,w,h);
}

// ─── DRAW FLYING ENEMY (enemy1.png, 56×38) ────────────────────
function drawPtero(e){
  const ex=e.x-camX, ey=e.y;
  ctx.save(); ctx.translate(ex,ey); ctx.scale(e.vx<0?1:-1,1);

  if(e.dying){
    drawDeathFlash(e.w,e.h);
    ctx.restore();
    return;
  }

  if(e.hitFlash>0){
    ctx.globalAlpha=0.5+0.5*Math.sin(e.hitFlash*30);
  }

  // wing-flap squish: no new art needed — just squash/stretch the sprite's
  // vertical scale in a fast sine cycle so it reads as flapping wings
  const flapSquish=1+0.3*Math.sin(Date.now()/80+e.id);
  ctx.save();
  ctx.scale(1,flapSquish);
  if(enemy1Loaded){
    ctx.drawImage(enemy1Sprite,-e.w/2,-e.h/2,e.w,e.h);
  } else {
    ctx.fillStyle="#ff0000";
    ctx.fillRect(-e.w/2,-e.h/2,e.w,e.h);
  }
  ctx.restore();

  // pulsing neon eye glow overlaid near the sprite's face (front-facing side)
  const eyePulse=0.5+0.5*Math.sin(e.glowPhase*3);
  ctx.shadowColor="#eab308"; ctx.shadowBlur=6+8*eyePulse;
  ctx.fillStyle=`rgba(253,224,71,${0.55+0.45*eyePulse})`;
  ctx.beginPath(); ctx.arc(e.w*0.22,-e.h*0.12,2.5,0,Math.PI*2); ctx.fill();
  noGlow();

  // HP bar
  if(e.hp < e.maxHp){
    const hbW=e.w*0.7;
    ctx.fillStyle="rgba(0,0,0,0.6)"; ctx.fillRect(-hbW/2,-e.h/2-14,hbW,6);
    ctx.fillStyle="#ff3322"; ctx.fillRect(-hbW/2,-e.h/2-14,(e.hp/e.maxHp)*hbW,6);
  }

  ctx.restore();
}

// ─── DRAW GROUND ENEMY (enemyground.png, 40×40) ───────────────
function drawGroundEnemy(e){
  const ex=e.x-camX+e.w/2, ey=e.y+e.h/2;
  ctx.save(); ctx.translate(ex,ey); ctx.scale(e.vx<0?-1:1,1);

  if(e.dying){
    drawDeathFlash(e.w,e.h);
    ctx.restore();
    return;
  }

  if(e.hitFlash>0){
    ctx.globalAlpha=0.5+0.5*Math.sin(e.hitFlash*30);
  }

  if(enemyGroundLoaded){
    ctx.drawImage(enemyGroundSprite,-e.w/2,-e.h/2,e.w,e.h);
  } else {
    ctx.fillStyle="#ff0000";
    ctx.fillRect(-e.w/2,-e.h/2,e.w,e.h);
  }

  if(e.hp < e.maxHp){
    const hbW=e.w*0.8;
    ctx.fillStyle="rgba(0,0,0,0.6)"; ctx.fillRect(-hbW/2,-e.h/2-12,hbW,5);
    ctx.fillStyle="#ff3322"; ctx.fillRect(-hbW/2,-e.h/2-12,(e.hp/e.maxHp)*hbW,5);
  }

  ctx.restore();
}

// ─── SPRITE AUTO-CROP ──────────────────────────────────────────
// PNG art from generators often ships with a lot of transparent margin (and
// sometimes a baked-in ground shadow/smoke puff) around the actual character.
// Scaling the WHOLE image — margin included — into a fixed on-screen box
// shrinks the visible art inside that box and throws off exactly where the
// feet land, which reads as the sprite "floating" instead of standing on the
// scene. Computing the tight opaque bounding box once (on load) and using it
// as the drawImage SOURCE rect fixes that without touching the PNG file.
function computeSpriteBBox(img, excludeGroundSmoke){
  const oc=document.createElement("canvas");
  oc.width=img.naturalWidth; oc.height=img.naturalHeight;
  const octx=oc.getContext("2d");
  octx.drawImage(img,0,0);
  let data;
  try{ data=octx.getImageData(0,0,oc.width,oc.height).data; }
  catch(e){ return {x:0,y:0,w:img.naturalWidth,h:img.naturalHeight}; } // e.g. file:// canvas taint
  let minX=oc.width,minY=oc.height,maxX=0,maxY=0,found=false;
  for(let y=0;y<oc.height;y++){
    for(let x=0;x<oc.width;x++){
      const i=(y*oc.width+x)*4;
      const a=data[i+3];
      if(a<24) continue;
      if(excludeGroundSmoke){
        const r=data[i],g=data[i+1],b=data[i+2];
        // the baked-in dust/smoke puff is near-white and low-contrast — treat
        // it as background so it doesn't drag the bounding box (and the feet
        // anchor point) downward
        if(r>222&&g>218&&b>206&&Math.abs(r-g)<14&&Math.abs(g-b)<22) continue;
      }
      found=true;
      if(x<minX)minX=x; if(x>maxX)maxX=x;
      if(y<minY)minY=y; if(y>maxY)maxY=y;
    }
  }
  if(!found) return {x:0,y:0,w:img.naturalWidth,h:img.naturalHeight};
  return {x:minX,y:minY,w:maxX-minX+1,h:maxY-minY+1};
}

// ─── PLAYER SPRITE ───────────────────────────────────────────
const playerSprite = new Image();
let playerSpriteLoaded = false;
let playerSpriteBBox = null;
playerSprite.onload = () => {
  playerSpriteBBox = computeSpriteBBox(playerSprite, true);
  playerSpriteLoaded = true;
};
playerSprite.src = "bagodino.png";

// ─── PLAYER SPRITE METRICS ───────────────────────────────────
// Single source of truth for how large the dino is actually drawn and where
// the jetpack nozzle sits on it, so rendering and thrust-particle spawning
// can never drift apart. Everything here derives from the sprite's DRAWN rect
// (which is bigger than the physics hitbox and anchored at the feet), not
// from PLAYER_W/PLAYER_H — anchoring the flame to the hitbox instead put it
// out of the dino's hip rather than out of the backpack nozzles.
const SPRITE_SCALE = 1.6;     // drawn height ÷ hitbox height
const JET_NOZZLE_FX = 0.25;   // nozzle X as a fraction of sprite width, measured from its BACK edge
const JET_NOZZLE_FY = 0.60;   // nozzle Y as a fraction of sprite height, measured from its TOP
function playerSpriteMetrics(){
  const dh=PLAYER_H*SPRITE_SCALE;
  const bb=playerSpriteBBox;
  const dw=bb ? bb.w*(dh/bb.h) : PLAYER_W*SPRITE_SCALE;
  const centerX=player.x+PLAYER_W/2;  // world space
  const feetY=player.y+PLAYER_H;      // world space
  return {
    dw, dh, centerX, feetY,
    // mirrors correctly with facing: the nozzle always stays on the back
    nozzleX: centerX+player.facing*dw*(JET_NOZZLE_FX-0.5),
    nozzleY: feetY-dh*(1-JET_NOZZLE_FY)
  };
}

// ─── DRAW PLAYER (sprite-based) ───────────────────────────────
function drawPlayer(){
  const p=player;
  const px=p.x+PLAYER_W/2-camX, py=p.y+PLAYER_H;
  const facing=p.facing;
  const cxWorld=p.x+PLAYER_W/2;

  // contact shadow: find the nearest solid platform top directly beneath the
  // dino and pin a soft dark ellipse to it, so the sprite reads as standing
  // ON the scene instead of floating pasted over it
  let groundY=null;
  for(const pf of platforms){
    if(pf.lavaPit) continue;
    if(cxWorld>=pf.x && cxWorld<=pf.x+pf.w && pf.y>=p.y+PLAYER_H-2){
      if(groundY===null||pf.y<groundY) groundY=pf.y;
    }
  }
  if(groundY!==null){
    const distToGround=groundY-(p.y+PLAYER_H);
    // a proper dark, semi-transparent contact shadow (rgba(0,0,0,0.4) at its
    // strongest, right underfoot) that pins the dino to the platform surface
    const shadowAlpha=clamp(0.4-distToGround*0.003,0.08,0.4);
    const shadowScale=clamp(1-distToGround*0.003,0.35,1);
    ctx.fillStyle=`rgba(0,0,0,${shadowAlpha})`;
    ctx.beginPath();
    ctx.ellipse(px,groundY+3,PLAYER_W*0.44*shadowScale,8*shadowScale,0,0,Math.PI*2);
    ctx.fill();
  }

  // is the dino currently over a lava pit? (used for the belly light-up below)
  let overLava=false;
  for(const lp of lavaPits){
    if(cxWorld>=lp.x-10 && cxWorld<=lp.x+lp.w+10){ overLava=true; break; }
  }

  ctx.save();
  ctx.translate(px,py);
  ctx.scale(facing,1);

  if(p.invuln>0 && Math.floor(p.invuln*12)%2===0){ ctx.globalAlpha=0.4; }

  let headTopY;
  if(playerSpriteLoaded){
    // draw from the tight, smoke-excluded bounding box (see computeSpriteBBox)
    // so the dino's actual feet — not empty margin or the baked-in dust puff —
    // land exactly on the ground/shadow anchor point below
    const bb=playerSpriteBBox;
    const m=playerSpriteMetrics();
    const dh=m.dh, dw=m.dw;
    ctx.drawImage(playerSprite,bb.x,bb.y,bb.w,bb.h,-dw/2,-dh,dw,dh);
    headTopY=-dh;
  } else {
    ctx.fillStyle="#ff0000";
    ctx.fillRect(-PLAYER_W/2,-PLAYER_H,PLAYER_W,PLAYER_H);
    headTopY=-PLAYER_H;
  }

  // ambient lava glow: a faint constant warm undertint on the lower half from
  // the cave's general lava-lit atmosphere, boosted into a stronger spotlight
  // when actually hovering over an open lava pit
  ctx.globalCompositeOperation="lighter";
  const ambientG=ctx.createRadialGradient(0,-PLAYER_H*0.1,2,0,-PLAYER_H*0.1,PLAYER_W*0.9);
  ambientG.addColorStop(0,`rgba(255,110,20,${overLava?0.5:0.16})`);
  ambientG.addColorStop(1,"rgba(255,80,0,0)");
  ctx.fillStyle=ambientG;
  ctx.beginPath(); ctx.ellipse(0,-PLAYER_H*0.1,PLAYER_W*(overLava?1.1:0.9),PLAYER_H*0.4,0,0,Math.PI*2); ctx.fill();
  ctx.globalCompositeOperation="source-over";

  // jetpack back-light glow, sat on the backpack tanks themselves. Inside this
  // transform local -x is always "behind" the dino (the sprite draws mirrored),
  // and sizing off the drawn sprite keeps it on the art at any scale.
  const met=playerSpriteMetrics();
  const backGlowAlpha=p.jetpack?0.9:0.3;
  ctx.shadowColor="#00e5ff"; ctx.shadowBlur=15;
  ctx.fillStyle=`rgba(0,229,255,${backGlowAlpha})`;
  ctx.beginPath(); ctx.arc(met.dw*(0.32-0.5),-met.dh*0.67,4,0,Math.PI*2); ctx.fill();
  ctx.shadowBlur=0;

  // small jetpack fuel bar hovering just above the dino's head
  ctx.globalAlpha=1;
  const fbW=34, fbH=5, fbY=headTopY-12;
  ctx.fillStyle="rgba(0,0,0,0.55)";
  ctx.fillRect(-fbW/2,fbY,fbW,fbH);
  const fuelColor=player.jetFuel>0.3?"#44aaff":"#ff4422";
  ctx.shadowColor=fuelColor; ctx.shadowBlur=6;
  ctx.fillStyle=fuelColor;
  ctx.fillRect(-fbW/2,fbY,fbW*player.jetFuel,fbH);
  ctx.shadowBlur=0;

  // active power-up aura — a rotating neon ring tinted by whichever power is
  // active, fading out smoothly as its timer runs down
  if(p.activePower){
    const ap=p.activePower;
    const fade=clamp(ap.timer/1.0,0,1); // last second fades the glow out instead of a hard cutoff
    ctx.save();
    ctx.globalCompositeOperation="lighter";
    ctx.rotate(t*(ap.kind==="shield"?3:1.5));
    ctx.shadowColor=ap.color; ctx.shadowBlur=16*fade;
    ctx.strokeStyle=ap.color; ctx.globalAlpha=0.7*fade; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(0,-PLAYER_H*0.55,PLAYER_W*0.85,0,Math.PI*1.5); ctx.stroke();
    ctx.globalAlpha=1;
    ctx.restore();
    ctx.shadowBlur=0;
  }

  ctx.restore();
}

// ─── BEAM SPRITES ─────────────────────────────────────────────
// beam.png and beam_hyper.png both point RIGHT and are vertically centred on
// their bright core. These fractions are the measured height of that bright
// core within the full frame — sizing the art by them makes the drawn core
// line up with the hitscan `thickness` instead of being eyeballed. Both are
// drawn with 'lighter', which is also what makes beam_hyper.png's opaque
// black background disappear (adding zero) and leaves only the energy.
const beamSprite=new Image(); let beamLoaded=false;
beamSprite.onload=()=>{ beamLoaded=true; };
beamSprite.src="beam.png";
const beamHyperSprite=new Image(); let beamHyperLoaded=false;
beamHyperSprite.onload=()=>{ beamHyperLoaded=true; };
beamHyperSprite.src="beam_hyper.png";
const BEAM_CORE_FRAC=0.130, BEAM_HYPER_CORE_FRAC=0.250;

// ─── DRAW CONTINUOUS PLASMA LASER ─────────────────────────────
function drawLaser(){
  if(!laser) return;
  const mx=laser.mouthX-camX;
  const tipX=mx+laser.dir*laser.len;
  const y=laser.mouthY;
  const half=laser.thickness/2;
  const x0=Math.min(mx,tipX), x1=Math.max(mx,tipX);

  // fever mode and the HYPER BEAM pickup both swap in the thick lightning
  // sprite (laser.fever is set from feverMode || hyperActive), and the
  // hitscan thickness they carry is likewise doubled
  const hyper=!!laser.fever;
  const sprite=hyper?beamHyperSprite:beamSprite;
  const spriteReady=hyper?beamHyperLoaded:beamLoaded;

  // additive blending gives the beam a real bloom where it overlaps sparks,
  // embers and itself, instead of just a flat translucent bar
  ctx.save();
  ctx.globalCompositeOperation="lighter";

  // ── the code-drawn core beam ALWAYS draws ──
  // beam.png is shaped like an impact flare — thin and very faint at its tail,
  // bright only at the head — so stretched across a long shot its first half
  // essentially vanishes. Drawing a solid molten core underneath guarantees a
  // readable beam whether or not the PNG has loaded (or is even present).
  ctx.lineCap="round";
  const coreW=laser.thickness*1.75;   // 8px hitscan -> 14px core, doubled in fever/hyper

  // wide outer glow
  ctx.strokeStyle=hyper?"rgba(255,60,140,0.30)":"rgba(255,120,0,0.30)";
  ctx.lineWidth=coreW*2.6;
  ctx.beginPath(); ctx.moveTo(mx,y); ctx.lineTo(tipX,y); ctx.stroke();

  // molten core
  ctx.shadowColor=hyper?"#ff2266":"#ff6600"; ctx.shadowBlur=18;
  ctx.strokeStyle=hyper?"#ff4488":"#ffaa00";
  ctx.lineWidth=coreW;
  ctx.beginPath(); ctx.moveTo(mx,y); ctx.lineTo(tipX,y); ctx.stroke();

  // white-hot centre line
  ctx.shadowColor="#ffffff"; ctx.shadowBlur=10;
  ctx.strokeStyle="rgba(255,250,220,0.95)";
  ctx.lineWidth=Math.max(2,coreW*0.34);
  ctx.beginPath(); ctx.moveTo(mx,y); ctx.lineTo(tipX,y); ctx.stroke();
  noGlow();

  // ── the sprite, blended on top of that core when it's available ──
  if(spriteReady){
    // draw height comes from the measured bright-core fraction, so the art's
    // core lines up with the hitscan thickness and the rest reads as flare
    const drawH=laser.thickness/(hyper?BEAM_HYPER_CORE_FRAC:BEAM_CORE_FRAC);
    ctx.save();
    ctx.translate(mx,y);
    if(laser.dir<0) ctx.scale(-1,1);  // art points right; mirror when firing left
    ctx.drawImage(sprite,0,-drawH/2,Math.max(1,laser.len),drawH);
    ctx.restore();
  }
  ctx.restore();

  // impact sparks + forking yellow lightning where it strikes an enemy
  if(laser.hitEnemy){
    ctx.strokeStyle="rgba(255,238,80,0.9)"; ctx.lineWidth=laser.fever?3:2;
    ctx.beginPath();
    ctx.moveTo(tipX,y);
    ctx.lineTo(tipX+laser.dir*14,y+rnd(-11,11));
    ctx.lineTo(tipX+laser.dir*26,y+rnd(-15,15));
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(tipX,y);
    ctx.lineTo(tipX+laser.dir*10,y+rnd(-16,16));
    ctx.stroke();
    glow("#ffee44",14);
    ctx.fillStyle="#fffde7";
    ctx.beginPath(); ctx.arc(tipX,y,4,0,Math.PI*2); ctx.fill();
    noGlow();
  }
}

// ─── DRAW ENEMY DROPS (piñata gems + coins) ───────────────────
function drawDrops(){
  for(const d of drops){
    const dx=d.x-camX, dy=d.y;
    if(d.kind==="coin"){
      glow("#ffdd00",14);
      ctx.fillStyle="#ffdd00";
      ctx.beginPath(); ctx.arc(dx,dy,9,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle="#ffaa00"; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(dx,dy,9,0,Math.PI*2); ctx.stroke();
      ctx.fillStyle="rgba(255,255,220,0.7)";
      ctx.beginPath(); ctx.arc(dx-2,dy-2,2.5,0,Math.PI*2); ctx.fill();
    } else if(d.kind==="fuel"){
      glow("#44aaff",14);
      ctx.fillStyle="#2a3060"; ctx.fillRect(dx-5,dy-8,10,16);
      ctx.fillStyle="#44aaff"; ctx.fillRect(dx-5,dy-8,10,5);
      ctx.fillStyle="rgba(200,240,255,0.8)"; ctx.fillRect(dx-2,dy-1,4,6);
    } else {
      const cols=dropColors(d.kind);
      glow(cols[0],12);
      ctx.save();
      ctx.translate(dx,dy);
      ctx.rotate(d.rot+t*1.5);
      ctx.fillStyle=cols[0];
      ctx.fillRect(-6,-6,12,12);
      ctx.fillStyle=cols[1];
      ctx.fillRect(-3,-3,6,6);
      ctx.restore();
    }
    noGlow();
  }
}

// ─── DRAW POWER-UP BOXES ───────────────────────────────────────
function drawPowerUpBoxes(){
  for(const box of powerUpBoxes){
    if(!box.alive) continue;
    const bx=box.x-camX, by=box.y+Math.sin(t*1.6+box.bob)*6;
    glow("#ffdd44",18+6*Math.sin(t*4+box.bob));
    // golden crystal/egg shell
    const g=ctx.createLinearGradient(bx,by-14,bx,by+14);
    g.addColorStop(0,"#fff3b0"); g.addColorStop(0.5,"#ffcc33"); g.addColorStop(1,"#cc8800");
    ctx.fillStyle=g;
    ctx.beginPath();
    ctx.moveTo(bx,by-14);
    ctx.quadraticCurveTo(bx+12,by-6,bx+10,by+8);
    ctx.quadraticCurveTo(bx+6,by+16,bx,by+16);
    ctx.quadraticCurveTo(bx-6,by+16,bx-10,by+8);
    ctx.quadraticCurveTo(bx-12,by-6,bx,by-14);
    ctx.closePath(); ctx.fill();
    // inner facets
    ctx.strokeStyle="rgba(255,255,255,0.5)"; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(bx,by-14); ctx.lineTo(bx,by+16); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(bx-8,by); ctx.lineTo(bx+8,by); ctx.stroke();
    noGlow();
  }
}

// ─── DRAW WEAPON PICKUPS (Sulfur Essence / Magma Crystal) ──────
function drawWeaponPickups(){
  for(const wp of weaponPickups){
    if(!wp.alive) continue;

    const col2 = wp.kind==="sulfur" ? "#cdf3ff" : "#ffcc66";
    glow(col,16+6*Math.sin(t*4+wp.bob));
    ctx.save();
    ctx.translate(wx,wy);
    ctx.rotate(t*1.2+wp.bob);
    ctx.fillStyle=col;
    ctx.beginPath();
    ctx.moveTo(0,-12); ctx.lineTo(9,0); ctx.lineTo(0,12); ctx.lineTo(-9,0);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle=col2;
    ctx.beginPath();
    ctx.moveTo(0,-6); ctx.lineTo(4,0); ctx.lineTo(0,6); ctx.lineTo(-4,0);
    ctx.closePath(); ctx.fill();
    ctx.restore();
    noGlow();
  }
}

function drawPlayerBombs(){

// ─── DRAW CAPTIVE CAGES ─────────────────────────────────────────
function drawCages(){
  for(const cage of cages){
    if(!cage.alive) continue;
    const cx=cage.x-camX, cy=cage.y;
    // dark cell behind the captive so it reads as being inside something
    ctx.fillStyle="rgba(8,4,14,0.55)";
    ctx.fillRect(cx-15,cy-21,30,42);
    // the captive baby dino, looking out toward the player
    drawBaby(cx,cy+2,34,player.x>cage.x?1:-1);
    // cage bars, drawn OVER the captive
    ctx.strokeStyle="#8a8a95"; ctx.lineWidth=3;
    for(let i=-12;i<=12;i+=8){
      ctx.beginPath(); ctx.moveTo(cx+i,cy-20); ctx.lineTo(cx+i,cy+20); ctx.stroke();
    }
    ctx.beginPath(); ctx.moveTo(cx-14,cy-20); ctx.lineTo(cx+14,cy-20); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx-14,cy+20); ctx.lineTo(cx+14,cy+20); ctx.stroke();
    // a hint that it needs to be shot, not walked into
    if(Math.sin(t*3)>0.3){
      ctx.fillStyle="rgba(255,255,255,0.7)"; ctx.font="9px 'Courier New',monospace";
      ctx.textAlign="center"; ctx.fillText("SHOOT ME",cx,cy-26); ctx.textAlign="left";

}

// ─── BOSS SPRITE (enemyboss.png) ────────────────────────────────
const bossSprite=new Image();
let bossSpriteLoaded=false;
bossSprite.onload=()=>{ bossSpriteLoaded=true; };
bossSprite.src="enemyboss.png";

// ─── DRAW BOSS ───────────────────────────────────────────────
function drawBoss(){
  if(!boss||boss.dead) return;
  const bx=boss.x-camX, by=boss.y;
  ctx.save(); ctx.translate(bx,by);

  if(boss.dying){
    drawDeathFlash(boss.w,boss.h);
    ctx.restore();
    return;
  }

  if(boss.hitFlash>0){
    ctx.globalAlpha=0.5+0.5*Math.sin(boss.hitFlash*30);
  }

  if(bossSpriteLoaded){
    ctx.drawImage(bossSprite,-boss.w/2,-boss.h/2,boss.w,boss.h);
  } else {
    ctx.fillStyle="#ff0000";
    ctx.fillRect(-boss.w/2,-boss.h/2,boss.w,boss.h);
  }
  ctx.globalAlpha=1;

  // boss HP bar (8 segments)
  const hbW=boss.w*0.9, hbY=-boss.h/2-20;
  ctx.fillStyle="rgba(0,0,0,0.6)"; ctx.fillRect(-hbW/2,hbY,hbW,10);
  const segW=hbW/boss.maxHp;
  for(let i=0;i<boss.maxHp;i++){
    ctx.fillStyle= i<boss.hp ? "#ff3322" : "rgba(255,255,255,0.15)";
    ctx.fillRect(-hbW/2+i*segW+1,hbY+1,segW-2,8);
  }
  ctx.fillStyle="#fff"; ctx.font="10px 'Courier New',monospace"; ctx.textAlign="center";
  ctx.fillText("ALPHA PTERODACTYL",0,hbY-6);
  ctx.textAlign="left";

  ctx.restore();
}

// ─── DRAW HUD ────────────────────────────────────────────────
function drawHUD(){
  // hearts (top-left)
  for(let i=0;i<player.maxHp;i++){
    ctx.font="22px serif";
    ctx.fillText(i<player.hp?"❤️":"🖤",14+i*28,30);
  }

  // chain/fever box (top-right) — neon purple/pink framed panel
  const pad=12;
  const bw=260,bh=feverMode?126:102,bx=W-bw-8,by=8;
  ctx.fillStyle="rgba(12,0,24,0.84)";
  ctx.fillRect(bx,by,bw,bh);
  // neon purple → pink border, pulsing brighter during fever
  const borderG=ctx.createLinearGradient(bx,by,bx+bw,by);
  borderG.addColorStop(0,"#a21caf"); borderG.addColorStop(0.5,"#e879f9");
  borderG.addColorStop(1,"#ff2fb0");
  ctx.shadowColor="#e879f9"; ctx.shadowBlur=feverMode?16:8;
  ctx.strokeStyle=borderG; ctx.lineWidth=3;
  ctx.strokeRect(bx,by,bw,bh);
  noGlow();

  // line baselines, all measured down from box top with consistent padding
  let lineY=by+pad+14; // first line baseline

  // CHAIN
  ctx.textAlign="left";
  glow(feverMode?"#ff44aa":"#ffaa00",feverMode?14:6);
  const chainFontPx=feverMode?18:16;
  ctx.font=`bold ${chainFontPx}px 'Courier New',monospace`;
  ctx.fillStyle=feverMode?"#ff88cc":"#ffdd44";

  const chainTxt=`CHAIN: ${chain}X`;
  // rainbow each character if fever
  if(feverMode){
    const feverColors=["#ff2266","#ff8800","#ffee00","#00ff88","#44aaff","#aa44ff"];
    let cx2=bx+pad;
    for(let i=0;i<chainTxt.length;i++){
      ctx.fillStyle=feverColors[i%feverColors.length];
      ctx.fillText(chainTxt[i],cx2,lineY);
      cx2+=chainFontPx*0.62;
    }
  } else {
    ctx.fillText(chainTxt,bx+pad,lineY);
  }
  lineY+=chainFontPx+6;

  // FEVER MODE ACTIVE line — pulses hard in neon pink/purple/yellow
  if(feverMode){
    ctx.font="bold 12px 'Courier New',monospace";
    const pulse=0.6+0.4*Math.sin(t*14);
    const fc=["#ff2fb0","#e879f9","#ffee00","#ff2fb0","#e879f9"];
    const ft="FEVER MODE ACTIVE!";
    ctx.shadowBlur=6+10*pulse;
    let fx2=bx+pad;
    for(let i=0;i<ft.length;i++){
      ctx.shadowColor=fc[i%fc.length];
      ctx.fillStyle=fc[i%fc.length];
      ctx.fillText(ft[i],fx2,lineY); fx2+=9.8;
    }
    noGlow();
    lineY+=18;
  }

  noGlow();
  ctx.font="bold 15px 'Courier New',monospace";
  ctx.fillStyle="#ffffff";
  ctx.fillText(`SCORE: ${score.toLocaleString()}`,bx+pad,lineY);
  lineY+=18;
  ctx.font="bold 12px 'Courier New',monospace";
  ctx.fillStyle="#ffdd44";
  ctx.fillText(`HI-SCORE: ${Math.max(hiScore,score).toLocaleString()}`,bx+pad,lineY);
  lineY+=18;
  ctx.font="bold 11px 'Courier New',monospace";
  ctx.fillStyle="#aaaacc";
  ctx.fillText(`STAGE ${levelIndex+1}/${LEVELS.length} — ${LEVELS[levelIndex].name}`,bx+pad,lineY);

  // combo timer bar under score box
  if(chain>0){
    const barW=(chainTimer/CHAIN_WINDOW)*bw;
    ctx.fillStyle="rgba(255,100,0,0.3)"; ctx.fillRect(bx,by+bh,bw,4);
    ctx.fillStyle=feverMode?"#ff44aa":"#ff8800";
    glow(feverMode?"#ff44aa":"#ff8800",8);
    ctx.fillRect(bx,by+bh,barW,4);
    noGlow();
  }

  ctx.textAlign="left";

  drawPowerUpUI();
}

// ─── ACTIVE POWER-UP TIMER (top-center) ────────────────────────
function drawPowerUpUI(){
  const ap=player.activePower;
  if(!ap) return;
  const w=190,h=38,x=W/2-w/2,y=8;
  ctx.fillStyle="rgba(0,0,10,0.75)";
  ctx.fillRect(x,y,w,h);
  ctx.shadowColor=ap.color; ctx.shadowBlur=10;
  ctx.strokeStyle=ap.color; ctx.lineWidth=2;
  ctx.strokeRect(x,y,w,h);
  noGlow();

  ctx.textAlign="center";
  ctx.font="bold 13px 'Courier New',monospace";
  ctx.fillStyle=ap.color;
  ctx.fillText(ap.label,W/2,y+15);

  const barW=w-16;
  ctx.fillStyle="rgba(255,255,255,0.15)"; ctx.fillRect(x+8,y+20,barW,7);
  ctx.fillStyle=ap.color;
  ctx.shadowColor=ap.color; ctx.shadowBlur=6;
  ctx.fillRect(x+8,y+20,barW*clamp(ap.timer/ap.maxTimer,0,1),7);
  noGlow();

  const secs=Math.max(0,Math.ceil(ap.timer));
  ctx.font="10px 'Courier New',monospace"; ctx.fillStyle="#fff";
  ctx.fillText(`0:${String(secs).padStart(2,"0")}`,W/2,y+35);

}

// ─── FEVER SCREEN FLASH ──────────────────────────────────────
function drawFeverOverlay(){
  if(feverFlash>0){
    ctx.fillStyle=`rgba(255,40,120,${feverFlash*0.35})`;
    ctx.fillRect(0,0,W,H);
    feverFlash=Math.max(0,feverFlash-0.04);
  }
  if(feverMode){
    // pulsing edge vignette
    const v=0.06+0.04*Math.sin(t*8);
    const vg=ctx.createRadialGradient(W/2,H/2,H*0.3,W/2,H/2,H*0.8);
    vg.addColorStop(0,"rgba(0,0,0,0)");
    vg.addColorStop(1,`rgba(180,0,100,${v})`);
    ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);

    // neon pulse hugging the screen edges — cycles pink/purple/cyan and
    // throbs in thickness, the classic arcade "fever" screen-border effect
    const pulse=0.5+0.5*Math.sin(t*9);
    const hue=(t*120)%360;
    const edgeColor=`hsl(${hue},100%,60%)`;
    ctx.save();
    ctx.globalCompositeOperation="lighter";
    ctx.shadowColor=edgeColor; ctx.shadowBlur=24+16*pulse;
    ctx.strokeStyle=edgeColor;
    ctx.lineWidth=6+6*pulse;
    ctx.strokeRect(ctx.lineWidth/2,ctx.lineWidth/2,W-ctx.lineWidth,H-ctx.lineWidth);
    ctx.restore();
  }
}

// ─── ARENA / BOSS BANNERS (DANGER!, GO! →, WARNING!) ──────────
