<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>NEON DINO-AGE — RESCUE PROTOCOL</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overscroll-behavior:none}
body{background:#000;display:flex;align-items:center;justify-content:center;height:100vh;overflow:hidden;
     font-family:'Courier New',monospace;
     /* a game, not a document: no text selection, no double-tap zoom, no
        rubber-band scrolling when a thumb slides off a button */
     -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
     touch-action:none}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
// ============================================================
//  NEON DINO-AGE  —  RESCUE PROTOCOL
//  Single-file HTML5 Canvas game  —  all art drawn procedurally
//
//  Story layer sitting on top of the arcade platformer:
//   1. RADIO — a pixel comms window that wipes open mid-play (it never
//      freezes the sim) to narrate the eruption, the heat and the Alpha.
//   2. RESCUE TRAIN — hatchlings freed from cages fall in behind the dino,
//      each one replaying the player's own recorded path a beat later.
//   3. EVACUATION PORTAL — the stage exit is an obsidian time capsule; the
//      screen blacks out into a mission debrief when you reach it.
// ============================================================

const C = document.getElementById("c");
const W = 900, H = 506;
C.width = W; C.height = H;
// scale to fit window
function resize(){
  const s = Math.min(window.innerWidth/W, window.innerHeight/H);
  C.style.width = W*s+"px"; C.style.height = H*s+"px";
}
resize(); window.addEventListener("resize", resize);
const ctx = C.getContext("2d");

// ─── ASSETS ─────────────────────────────────────────────────
// Every image the game loads is asked for by name through here. Left alone
// it returns the name, so the game runs from a folder exactly as before. A
// build can define window.__ASSETS = {"baby.png":"data:image/png;base64,…"}
// ahead of this script and the whole game becomes one sendable file with no
// sibling files to lose.
//
// Inlined art has a second benefit: a data: URI does not taint the canvas the
// way a file:// image does, so computeSpriteBBox can actually measure a
// sprite instead of falling back to its full frame.
function assetURL(name){
  const m = (typeof window!=="undefined") && window.__ASSETS;
  return (m && m[name]) || name;
}

// ─── INPUT ──────────────────────────────────────────────────
const K = {};
window.addEventListener("keydown", e => { K[e.code] = true; e.preventDefault&&["Space","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.code)&&e.preventDefault(); });
window.addEventListener("keyup",  e => { K[e.code] = false; });

// ─── TOUCH CONTROLS ─────────────────────────────────────────
// A tablet has no keyboard, so the pad drives the SAME K[] table the keys
// do. Nothing downstream of input has to know a finger is involved.
//
// The buttons live in canvas space and are hit-tested there, so they line up
// no matter how the canvas has been scaled to fit the screen.
let touchMode=false;
try{
  touchMode = ("ontouchstart" in window) ||
              (navigator && navigator.maxTouchPoints>0) ||
              /[?&]touch=1/.test((location&&location.search)||"");
}catch(e){ touchMode=false; }
const TOUCH_KEYS={LEFT:"ArrowLeft", RIGHT:"ArrowRight", JUMP:"Space",
                  FIRE:"KeyF", DASH:"ShiftLeft"};
function touchButtons(){
  const pad=16, r=40;
  return [
    {id:"LEFT",  x:pad+r,        y:H-pad-r,       r, label:"◀"},
    {id:"RIGHT", x:pad+r*3+10,   y:H-pad-r,       r, label:"▶"},
    {id:"FIRE",  x:W-pad-r*3-10, y:H-pad-r,       r, label:"ATEŞ"},
    {id:"JUMP",  x:W-pad-r,      y:H-pad-r,       r, label:"ZIPLA"},
    {id:"DASH",  x:W-pad-r*2+6,  y:H-pad-r*3-4,   r:32, label:"DASH"},
  ];
}
function touchButtonAt(x,y){
  for(const b of touchButtons()){
    // a generous hit box — thumbs are not precise, and a near miss that does
    // nothing is the single most frustrating thing about on-screen controls
    if(Math.hypot(x-b.x,y-b.y)<=b.r+10) return b;
  }
  return null;
}
const touchHeld=new Map();   // pointerId -> button id
function touchSet(id,down){
  const code=TOUCH_KEYS[id];
  if(code) K[code]=down;
}
function touchRelease(pid){
  const was=touchHeld.get(pid);
  if(was===undefined) return;
  touchHeld.delete(pid);
  // only let go of the key if no other finger is still on that button
  for(const v of touchHeld.values()) if(v===was) return;
  touchSet(was,false);
}
function touchPressAt(pid,p){
  const b=touchButtonAt(p.x,p.y);
  const was=touchHeld.get(pid);
  if(b && was===b.id) return;
  if(was!==undefined) touchRelease(pid);
  if(b){ touchHeld.set(pid,b.id); touchSet(b.id,true); }
}
function drawTouchPad(){
  if(!touchMode) return;
  if(STATE!=="playing"&&STATE!=="warp") return;
  ctx.save();
  for(const b of touchButtons()){
    const held=[...touchHeld.values()].includes(b.id);
    ctx.globalAlpha=held?0.55:0.26;
    ctx.fillStyle=held?"#e879f9":"#0b0a18";
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=held?0.95:0.5;
    ctx.strokeStyle=held?"#ffffff":"#8fa0c8"; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.stroke();
    ctx.globalAlpha=held?1:0.8;
    ctx.fillStyle="#e8ecff";
    ctx.font="bold "+(b.label.length>2?11:20)+"px 'Courier New',monospace";
    ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillText(b.label,b.x,b.y);
  }
  ctx.textAlign="left"; ctx.textBaseline="alphabetic";
  ctx.restore();
}

// ─── UTILS ──────────────────────────────────────────────────
function rnd(a,b){ return a + Math.random()*(b-a); }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function lerp(a,b,t){ return a+(b-a)*t; }
function overlaps(a,b){ return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y; }

// ─── RETRO 8-BIT AUDIO (pure Web Audio API, no external files) ─
let actx=null;
function ensureAudio(){
  if(!actx){
    try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(err){ actx=null; }
  }
  if(actx && actx.state==="suspended") actx.resume();
  startBGM();
}
window.addEventListener("keydown", ensureAudio, {once:true});
// Picking a destination with the mouse — handy while testing, and the
// obvious thing to try on a map screen. The canvas is CSS-scaled to fit the
// window, so a click has to be divided back into canvas space.
function canvasPoint(ev){
  const r=C.getBoundingClientRect();
  if(!r||!r.width||!r.height) return null;
  return {x:(ev.clientX-r.left)*(W/r.width), y:(ev.clientY-r.top)*(H/r.height)};
}
window.addEventListener("pointerdown", ev=>{
  const p=canvasPoint(ev);
  if(!p) return;
  if(ev.preventDefault) ev.preventDefault();

  // in a stage, the pad owns the screen
  if(STATE==="playing"||STATE==="warp"){
    if(touchMode) touchPressAt(ev.pointerId===undefined?0:ev.pointerId,p);
    return;
  }
  // the map: tap a destination
  if(STATE==="map"){
    if(mapStampTimer>0) return;
    for(let i=0;i<WORLDS.length;i++){
      const nx=WORLDS[i].mx*W, ny=WORLDS[i].my*H;
      if(Math.hypot(p.x-nx,p.y-ny)>38) continue;
      if(!worldState(i).playable){ playPew(); return; }
      mapSel=i;
      startWorld(i);
      return;
    }
    return;
  }
  // every other screen is waiting for a confirm, and a tablet has no ENTER.
  // A tap anywhere is that confirm.
  if(STATE==="report"||STATE==="continue"){ K["Enter"]=true; touchConfirm=0.25; }
  else if(STATE==="dead"||STATE==="win"){ K["KeyR"]=true; touchConfirm=0.25; }
});
window.addEventListener("pointerup",   ev=>touchRelease(ev.pointerId===undefined?0:ev.pointerId));
window.addEventListener("pointercancel",ev=>touchRelease(ev.pointerId===undefined?0:ev.pointerId));
window.addEventListener("pointermove", ev=>{
  if(!touchMode) return;
  if(STATE!=="playing"&&STATE!=="warp") return;
  const pid=ev.pointerId===undefined?0:ev.pointerId;
  if(!touchHeld.has(pid) && !(ev.buttons&1) && ev.pressure===undefined) return;
  const p=canvasPoint(ev);
  if(p) touchPressAt(pid,p);
});
// a synthesised confirm is a tap, not a held key — let it go again
let touchConfirm=0;
function updateTouchConfirm(dt){
  if(touchConfirm<=0) return;
  touchConfirm-=dt;
  if(touchConfirm<=0){ K["Enter"]=false; K["KeyR"]=false; }
}
window.addEventListener("pointerdown", ensureAudio, {once:true});

// ─── CHIPTUNE BGM (bassline + arpeggio, pure oscillators, loops forever) ──
let bgmStarted=false;
const BGM_BASS=[110.00,110.00,130.81,146.83, 110.00,110.00,164.81,146.83]; // A2 A2 C3 D3 | A2 A2 E3 D3
const BGM_ARP=[220.00,277.18,329.63,392.00]; // A3 C#4 E4 G4 arpeggio, cycles independently of the bass
let bgmStep=0;
function startBGM(){
  if(bgmStarted||!actx) return;
  bgmStarted=true;
  function tick(){
    if(!actx) return;
    // FEVER MODE speeds the whole loop up — read live each tick so tempo
    // snaps immediately when fever starts/ends rather than waiting a bar
    const stepSec=feverMode?0.105:0.155;
    const now=actx.currentTime;

    // bassline — punchy short square note, one per step (a bit louder and
    // brighter in fever for extra energy)
    const bf=BGM_BASS[bgmStep%BGM_BASS.length];
    const bo=actx.createOscillator(), bgn=actx.createGain();
    bo.type="square"; bo.frequency.setValueAtTime(feverMode?bf*2:bf,now);
    bgn.gain.setValueAtTime(0.0001,now);
    bgn.gain.linearRampToValueAtTime(feverMode?0.14:0.11,now+0.008);
    bgn.gain.exponentialRampToValueAtTime(0.0001,now+stepSec*0.9);
    bo.connect(bgn); bgn.connect(actx.destination);
    bo.start(now); bo.stop(now+stepSec);

    // arpeggio — plucky triangle note layered on top, two per bass step for
    // energy (three per step, faster, during fever)
    const subdivisions=feverMode?3:2;
    for(let sub=0;sub<subdivisions;sub++){
      const at=now+sub*stepSec/subdivisions;
      const af=BGM_ARP[(bgmStep*subdivisions+sub)%BGM_ARP.length];
      const ao=actx.createOscillator(), agn=actx.createGain();
      ao.type="triangle"; ao.frequency.setValueAtTime(feverMode?af*2:af,at);
      agn.gain.setValueAtTime(0.0001,at);
      agn.gain.linearRampToValueAtTime(feverMode?0.075:0.055,at+0.004);
      agn.gain.exponentialRampToValueAtTime(0.0001,at+(stepSec/subdivisions)*0.9);
      ao.connect(agn); agn.connect(actx.destination);
      ao.start(at); ao.stop(at+stepSec/subdivisions);
    }

    bgmStep++;
    setTimeout(tick,stepSec*1000);
  }
  tick();
}

// ─── CONTINUOUS LASER HUM (sustained oscillator while the beam fires) ──
let laserOsc=null, laserOscGain=null;
function startLaserSound(){
  if(!actx||laserOsc) return;
  laserOsc=actx.createOscillator(); laserOscGain=actx.createGain();
  laserOsc.type="sawtooth";
  laserOsc.frequency.setValueAtTime(520,actx.currentTime);
  laserOscGain.gain.setValueAtTime(0.0001,actx.currentTime);
  laserOscGain.gain.linearRampToValueAtTime(0.07,actx.currentTime+0.03);
  laserOsc.connect(laserOscGain); laserOscGain.connect(actx.destination);
  laserOsc.start();
}
function updateLaserSound(fever){
  if(!laserOsc) return;
  const now=actx.currentTime;
  const wob=520+Math.sin(now*40)*40+(fever?120:0);
  laserOsc.frequency.setValueAtTime(wob,now);
}
function stopLaserSound(){
  if(!laserOsc) return;
  const now=actx.currentTime;
  laserOscGain.gain.linearRampToValueAtTime(0.0001,now+0.05);
  laserOsc.stop(now+0.06);
  laserOsc=null; laserOscGain=null;
}

// retro "pew" — quick downward frequency-sweep square blip, fired on each shot
function playPew(){
  if(!actx) return;
  const now=actx.currentTime;
  const o=actx.createOscillator(), g=actx.createGain();
  o.type="square";
  o.frequency.setValueAtTime(900,now);
  o.frequency.exponentialRampToValueAtTime(180,now+0.09);
  g.gain.setValueAtTime(0.16,now);
  g.gain.exponentialRampToValueAtTime(0.001,now+0.1);
  o.connect(g); g.connect(actx.destination);
  o.start(now); o.stop(now+0.11);
}

// bright chime for coin pickups — pitch rises with the current chain count
function playChime(chainCount){
  if(!actx) return;
  const now=actx.currentTime;
  const freq=620+Math.min(chainCount,20)*35;
  const o=actx.createOscillator(), g=actx.createGain();
  o.type="triangle";
  o.frequency.setValueAtTime(freq,now);
  o.frequency.exponentialRampToValueAtTime(freq*1.5,now+0.08);
  g.gain.setValueAtTime(0.0001,now);
  g.gain.exponentialRampToValueAtTime(0.22,now+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,now+0.18);
  o.connect(g); g.connect(actx.destination);
  o.start(now); o.stop(now+0.2);
}

// noise-burst explosion for enemy kills — filtered white noise with a fast decay envelope
function playExplosion(){
  if(!actx) return;
  const now=actx.currentTime;
  const dur=0.28;
  const bufferSize=Math.floor(actx.sampleRate*dur);
  const buffer=actx.createBuffer(1,bufferSize,actx.sampleRate);
  const data=buffer.getChannelData(0);
  for(let i=0;i<bufferSize;i++) data[i]=(Math.random()*2-1)*(1-i/bufferSize);
  const noise=actx.createBufferSource(); noise.buffer=buffer;
  const filter=actx.createBiquadFilter();
  filter.type="lowpass";
  filter.frequency.setValueAtTime(1400,now);
  filter.frequency.exponentialRampToValueAtTime(90,now+dur);
  const g=actx.createGain();
  g.gain.setValueAtTime(0.35,now);
  g.gain.exponentialRampToValueAtTime(0.001,now+dur);
  noise.connect(filter); filter.connect(g); g.connect(actx.destination);
  noise.start(now); noise.stop(now+dur);
}

// rising energetic retro "power-up" sting — used both for the box breaking
// and for the power-up actually taking effect
function playPowerUp(){
  if(!actx) return;
  const now=actx.currentTime;
  const o=actx.createOscillator(), g=actx.createGain();
  o.type="square";
  o.frequency.setValueAtTime(220,now);
  o.frequency.exponentialRampToValueAtTime(900,now+0.22);
  g.gain.setValueAtTime(0.0001,now);
  g.gain.linearRampToValueAtTime(0.2,now+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,now+0.3);
  o.connect(g); g.connect(actx.destination);
  o.start(now); o.stop(now+0.31);
  // a fifth above, slightly delayed, for a fuller chiptune "power chord" rise
  const o2=actx.createOscillator(), g2=actx.createGain();
  o2.type="square";
  o2.frequency.setValueAtTime(330,now+0.03);
  o2.frequency.exponentialRampToValueAtTime(1320,now+0.25);
  g2.gain.setValueAtTime(0.0001,now+0.03);
  g2.gain.linearRampToValueAtTime(0.14,now+0.05);
  g2.gain.exponentialRampToValueAtTime(0.0001,now+0.32);
  o2.connect(g2); g2.connect(actx.destination);
  o2.start(now+0.03); o2.stop(now+0.33);
}

// alarm siren — alternating up/down warble for the boss's dramatic entrance
let sirenOsc=null, sirenGain=null, sirenInterval=null;
function startSiren(durationSec){
  if(!actx) return;
  const now=actx.currentTime;
  sirenOsc=actx.createOscillator(); sirenGain=actx.createGain();
  sirenOsc.type="sawtooth";
  sirenGain.gain.setValueAtTime(0.09,now);
  sirenOsc.connect(sirenGain); sirenGain.connect(actx.destination);
  sirenOsc.start(now);
  let up=true;
  sirenInterval=setInterval(()=>{
    if(!sirenOsc) return;
    const t0=actx.currentTime;
    sirenOsc.frequency.cancelScheduledValues(t0);
    sirenOsc.frequency.setValueAtTime(up?440:660,t0);
    sirenOsc.frequency.linearRampToValueAtTime(up?660:440,t0+0.35);
    up=!up;
  },350);
  setTimeout(stopSiren,durationSec*1000);
}
function stopSiren(){
  if(sirenInterval){ clearInterval(sirenInterval); sirenInterval=null; }
  if(sirenOsc){
    const now=actx?actx.currentTime:0;
    try{
      sirenGain.gain.linearRampToValueAtTime(0.0001,now+0.15);
      sirenOsc.stop(now+0.16);
    }catch(e){}
    sirenOsc=null; sirenGain=null;
  }
}

// ─── ARMOUR RICOCHET ──────────────────────────────────────────
// a short metallic tink, quieter than the parry so the two never confuse
function playRicochet(){
  if(!actx) return;
  const now=actx.currentTime;
  const o=actx.createOscillator(), g=actx.createGain();
  o.type="square";
  o.frequency.setValueAtTime(2300,now);
  o.frequency.exponentialRampToValueAtTime(1500,now+0.05);
  g.gain.setValueAtTime(0.0001,now);
  g.gain.linearRampToValueAtTime(0.09,now+0.005);
  g.gain.exponentialRampToValueAtTime(0.0001,now+0.11);
  o.connect(g); g.connect(actx.destination);
  o.start(now); o.stop(now+0.12);
}

// ─── PARRY ────────────────────────────────────────────────────
// a bright metallic ring — it has to cut through the middle of a boss fight
function playParry(){
  if(!actx) return;
  const now=actx.currentTime;
  [1320,1980,2640].forEach((f,i)=>{
    const o=actx.createOscillator(), g=actx.createGain();
    o.type=i===0?"square":"triangle";
    o.frequency.setValueAtTime(f,now);
    o.frequency.exponentialRampToValueAtTime(f*1.35,now+0.07);
    g.gain.setValueAtTime(0.0001,now);
    g.gain.linearRampToValueAtTime(0.18/(i+1),now+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001,now+0.32);
    o.connect(g); g.connect(actx.destination);
    o.start(now); o.stop(now+0.33);
  });
}

// ─── CONTINUE COUNTDOWN TICK ──────────────────────────────────
// one dry blip per second while the credit clock runs down
function playContinueTick(urgent){
  if(!actx) return;
  const now=actx.currentTime;
  const o=actx.createOscillator(), g=actx.createGain();
  o.type="square";
  o.frequency.setValueAtTime(urgent?880:520,now);
  g.gain.setValueAtTime(0.0001,now);
  g.gain.linearRampToValueAtTime(urgent?0.20:0.13,now+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,now+0.14);
  o.connect(g); g.connect(actx.destination);
  o.start(now); o.stop(now+0.15);
}

// ─── HATCHLING SFX ────────────────────────────────────────────
// a frightened upward chirp when one is knocked off the train
function playBabyPanic(){
  if(!actx) return;
  const now=actx.currentTime;
  const o=actx.createOscillator(), g=actx.createGain();
  o.type="square";
  o.frequency.setValueAtTime(700,now);
  o.frequency.exponentialRampToValueAtTime(1500,now+0.09);
  o.frequency.exponentialRampToValueAtTime(900,now+0.2);
  g.gain.setValueAtTime(0.0001,now);
  g.gain.linearRampToValueAtTime(0.16,now+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,now+0.26);
  o.connect(g); g.connect(actx.destination);
  o.start(now); o.stop(now+0.27);
}
// and a flat, falling two-tone when one is gone for good
function playBabyLost(){
  if(!actx) return;
  const now=actx.currentTime;
  [[440,0],[294,0.16]].forEach(([f,off])=>{
    const o=actx.createOscillator(), g=actx.createGain();
    o.type="triangle";
    o.frequency.setValueAtTime(f,now+off);
    g.gain.setValueAtTime(0.0001,now+off);
    g.gain.linearRampToValueAtTime(0.18,now+off+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,now+off+0.3);
    o.connect(g); g.connect(actx.destination);
    o.start(now+off); o.stop(now+off+0.31);
  });
}

// ─── RADIO TRANSMISSION SFX (squelch blips + carrier hiss) ────
// Deliberately short and quiet: the comms window opens over live gameplay,
// so this can never step on the BGM or the sustained laser tone.
function playRadioBeep(urgent){
  if(!actx) return;
  const now=actx.currentTime;
  const base=urgent?1180:820;
  for(let i=0;i<2;i++){
    const off=i*0.09;
    const o=actx.createOscillator(), g=actx.createGain();
    o.type="square";
    o.frequency.setValueAtTime(base+i*160,now+off);
    g.gain.setValueAtTime(0.0001,now+off);
    g.gain.linearRampToValueAtTime(urgent?0.13:0.09,now+off+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,now+off+0.07);
    o.connect(g); g.connect(actx.destination);
    o.start(now+off); o.stop(now+off+0.08);
  }
  // band-passed noise under the blips — the carrier opening up
  const dur=0.18;
  const buf=actx.createBuffer(1,Math.floor(actx.sampleRate*dur),actx.sampleRate);
  const data=buf.getChannelData(0);
  for(let i=0;i<data.length;i++) data[i]=(Math.random()*2-1)*(1-i/data.length);
  const noise=actx.createBufferSource(); noise.buffer=buf;
  const filt=actx.createBiquadFilter();
  filt.type="bandpass"; filt.frequency.setValueAtTime(1800,now); filt.Q.value=1.2;
  const ng=actx.createGain();
  ng.gain.setValueAtTime(0.05,now);
  ng.gain.exponentialRampToValueAtTime(0.001,now+dur);
  noise.connect(filt); filt.connect(ng); ng.connect(actx.destination);
  noise.start(now); noise.stop(now+dur);
}
// one dry click per typed character while the message prints
function playRadioType(){
  if(!actx) return;
  const now=actx.currentTime;
  const o=actx.createOscillator(), g=actx.createGain();
  o.type="square";
  o.frequency.setValueAtTime(rnd(1500,2100),now);
  g.gain.setValueAtTime(0.03,now);
  g.gain.exponentialRampToValueAtTime(0.0005,now+0.02);
  o.connect(g); g.connect(actx.destination);
  o.start(now); o.stop(now+0.025);
}

// ─── PARTICLES ──────────────────────────────────────────────
let particles = [];
function spawnParticles(x, y, n, colors, opts={}){
  for(let i=0;i<n;i++){
    const ang = rnd(0, Math.PI*2);
    const spd = rnd(opts.minSpd||40, opts.maxSpd||180);
    particles.push({
      x, y,
      vx: Math.cos(ang)*spd,
      vy: Math.sin(ang)*spd - (opts.upBias||0),
      life: 1, maxLife: rnd(opts.minLife||0.3, opts.maxLife||0.9),
      color: colors[Math.floor(Math.random()*colors.length)],
      size: rnd(opts.minSz||2, opts.maxSz||5),
      type: opts.type||"square",
      gravity: opts.gravity!==undefined ? opts.gravity : 220,
      // optional ground-bounce physics (used for enemy-kill debris) — settles
      // onto a platform instead of falling through it forever
      bounce: !!opts.bounce,
      restitution: opts.restitution!==undefined ? opts.restitution : 0.4,
      settled: false
    });
  }
}
function updateParticles(dt){
  particles = particles.filter(p=>{
    p.life -= dt/p.maxLife;
    p.vy += p.gravity*dt;
    p.x += p.vx*dt; p.y += p.vy*dt;

    if(p.bounce && !p.settled && p.vy>0){
      // platforms are stored in world space; particles live in screen space
      // (drawn without a further camX subtraction), so compare against each
      // platform's screen-space span here
      for(const pf of platforms){
        if(pf.lavaPit) continue;
        const psx=pf.x-camX;
        if(p.x>=psx && p.x<=psx+pf.w && p.y>=pf.y-4 && p.y<=pf.y+12){
          p.y=pf.y;
          p.vy*=-p.restitution;
          p.vx*=0.55; // friction bleeds horizontal speed off on every bounce
          if(Math.abs(p.vy)<45){ p.vy=0; p.settled=true; }
          break;
        }
      }
    } else if(p.settled){
      p.vx*=Math.pow(0.02,dt); // resting friction
    }
    return p.life > 0;
  });
  // hard safety cap — if something ever spawns particles faster than they can
  // expire, drop the oldest ones rather than letting the array grow unbounded
  if(particles.length>420) particles.splice(0,particles.length-420);
}
function drawParticles(){
  // additive "lighter" blending makes overlapping glows bloom into each other
  // (embers, sparks, jetpack flame) instead of just stacking flat alpha
  ctx.globalCompositeOperation="lighter";
  for(const p of particles){
    ctx.globalAlpha = Math.max(0,p.life);
    ctx.fillStyle = p.color;
    if(p.type==="circle"){
      ctx.beginPath(); ctx.arc(p.x,p.y,p.size*p.life,0,Math.PI*2); ctx.fill();
    } else {
      const s = p.size*p.life;
      ctx.fillRect(p.x-s/2, p.y-s/2, s, s);
    }
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation="source-over";
}

function levelTheme(){ return (LEVELS[levelIndex]&&LEVELS[levelIndex].theme)||"volcano"; }
function themeOf(){ return THEMES[levelTheme()]||THEMES.volcano; }
function isForest(){ return levelTheme()==="forest"; }
function isIce(){ return levelTheme()==="ice"; }
// a biome with a `cap` entry paints its platforms from a single block sheet
function capSpec(){ return themeOf().cap||null; }

// 40 points for the brood, 25 for the combo, 20 for taking no hits, 15 for
// beating par. Rescue is weighted hardest because that is the mission.
function computeGrade(){
  const L=LEVELS[levelIndex];
  const total=L.cages.length;
  const par=L.parTime||80;
  let pts=0;
  pts+=40*(total?rescuedThisLevel/total:1);
  pts+=25*Math.min(1,bestChainThisLevel/12);
  pts+=Math.max(0,20-hitsThisLevel*7);
  pts+=15*clamp(1-(levelTime-par)/par,0,1);
  const letter = pts>=90?"S" : pts>=75?"A" : pts>=60?"B" : pts>=40?"C" : "D";
  return {letter, pts:Math.round(pts)};
}
function recordGrade(letter){
  const prev=bestGrades[levelIndex];
  if(!prev || GRADE_ORDER.indexOf(letter)>GRADE_ORDER.indexOf(prev)){
    bestGrades[levelIndex]=letter;
    try{ localStorage.setItem("neonDinoGrades",JSON.stringify(bestGrades)); }catch(e){}
    return true;
  }
  return false;
}

// ─── SWINGING VINES ───────────────────────────────────────────
// A vine is a pendulum with a player on the end. Touching one in mid-air
// grabs it; left/right pumps the swing the way a real one does (push at the
// bottom of the arc), and jump lets go with whatever tangential speed you
// had built up. Momentum is the whole point — a released swing should carry
// you further than a jump ever could.
const VINE_GRAB_R=30;
const VINE_RELEASE_BOOST=-180;   // a little lift on top of the tangent
let vines=[];
let vineGrab=null;               // the vine currently held, or null
let vineCooldown=0;              // stops an instant re-grab after releasing
function initVines(){
  vines=(LEVELS[levelIndex].vines||[]).map(v=>({
    x:v.x, y:v.y, len:v.len||130,
    ang:v.ang!==undefined?v.ang:rnd(-0.45,0.45),
    angVel:0
  }));
  vineGrab=null; vineCooldown=0;
}
// where the grabbable tip of a vine currently hangs, in world space
function vineTip(v){
  return {x:v.x+Math.sin(v.ang)*v.len, y:v.y+Math.cos(v.ang)*v.len};
}
function updateVines(dt,left,right,jump){
  if(vineCooldown>0) vineCooldown-=dt;
  for(const v of vines){
    if(v===vineGrab) continue;
    // free vines settle back toward hanging
    v.angVel+=(-(2200/v.len)*Math.sin(v.ang))*dt;
    v.angVel*=Math.pow(0.35,dt);
    v.ang+=v.angVel*dt;
  }
  if(vineGrab){
    const v=vineGrab;
    // gravity on the pendulum, plus pumping from the player's input
    v.angVel+=(-(2600/v.len)*Math.sin(v.ang))*dt;
    if(left)  v.angVel-=2.6*dt;
    if(right) v.angVel+=2.6*dt;
    v.angVel=clamp(v.angVel,-4.5,4.5);
    v.angVel*=Math.pow(0.86,dt);
    v.ang+=v.angVel*dt;
    const tip=vineTip(v);
    player.x=tip.x-PLAYER_W/2;
    player.y=tip.y-PLAYER_H*0.35;
    player.vx=0; player.vy=0;
    player.onGround=false;
    player.facing=v.angVel>=0?1:-1;
    if(jump && !player.vineJumpHeld){
      // release: convert the swing into real velocity
      const tan=v.angVel*v.len;
      player.vx=Math.cos(v.ang)*tan;
      player.vy=-Math.sin(v.ang)*tan+VINE_RELEASE_BOOST;
      vineGrab=null; vineCooldown=0.35;
      playPowerUp();
      spawnParticles(tip.x-camX,tip.y,10,["#a7f3d0","#34d399","#ffffff"],
        {minSpd:60,maxSpd:200,minLife:0.2,maxLife:0.5,type:"circle",gravity:120});
    }
  } else if(vineCooldown<=0 && !player.onGround){
    // grab whatever tip you brush against on the way past
    const pcx=player.x+PLAYER_W/2, pcy=player.y+PLAYER_H*0.35;
    for(const v of vines){
      const tip=vineTip(v);
      if(Math.hypot(pcx-tip.x,pcy-tip.y)<VINE_GRAB_R){
        vineGrab=v;
        // carry the approach speed into the swing instead of killing it dead
        v.angVel=clamp(v.angVel+player.vx/v.len,-4.5,4.5);
        playChime(chain);
        break;
      }
    }
  }
  player.vineJumpHeld=jump;
}
function drawVines(){
  for(const v of vines){
    const ax=v.x-camX, ay=v.y;
    if(ax<-80||ax>W+80) continue;
    const tip=vineTip(v);
    const tx=tip.x-camX, ty=tip.y;
    // the vine itself, drawn as a slightly slack curve
    ctx.strokeStyle="#2f6b3d"; ctx.lineWidth=6; ctx.lineCap="round";
    ctx.beginPath();
    ctx.moveTo(ax,ay);
    ctx.quadraticCurveTo(ax+(tx-ax)*0.45,ay+(ty-ay)*0.55+10,tx,ty);
    ctx.stroke();
    ctx.strokeStyle="#4b9e5b"; ctx.lineWidth=3;
    ctx.beginPath();
    ctx.moveTo(ax,ay);
    ctx.quadraticCurveTo(ax+(tx-ax)*0.45,ay+(ty-ay)*0.55+10,tx,ty);
    ctx.stroke();
    // leaves along it
    ctx.fillStyle="#3f8a4c";
    for(let i=1;i<=3;i++){
      const f=i/4;
      const lx=lerp(ax,tx,f), ly=lerp(ay,ty,f)+8*Math.sin(f*Math.PI);
      ctx.beginPath(); ctx.ellipse(lx+6,ly,7,3,0.5,0,Math.PI*2); ctx.fill();
    }
    // the grab knot, brighter when it is free to take
    const ready=!vineGrab&&vineCooldown<=0;
    glow(ready?"#7dffcf":"#2f6b3d",ready?12:4);
    ctx.fillStyle=v===vineGrab?"#ffdd66":(ready?"#7dffcf":"#4b9e5b");
    ctx.beginPath(); ctx.arc(tx,ty,7,0,Math.PI*2); ctx.fill();
    noGlow();
  }
}

let coins = [];
// a straight row of n coins centered above a platform
function coinRow(px,py,pw,n,yOff){
  const arr=[];
  const totalW=(n-1)*28;
  const startX=px+pw/2-totalW/2;
  for(let i=0;i<n;i++) arr.push({x:startX+i*28, y:py+yOff});
  return arr;
}
// an arc of n coins tracing the jump path between two points (peaks upward by `height`)
function coinArc(x1,y1,x2,y2,n,height){
  const arr=[];
  for(let i=0;i<n;i++){
    const tt=i/(n-1);
    arr.push({x:lerp(x1,x2,tt), y:lerp(y1,y2,tt)-Math.sin(tt*Math.PI)*height});
  }
  return arr;
}
// a shallow arc of n coins hanging 30px above a platform, inset from its
// edges — the standard pickup line over any ledge
function coinArcOver(px,py,pw,n){
  const inset=Math.min(24,pw*0.18);
  return coinArc(px+inset, py-30, px+pw-inset, py-30, n, 22);
}
function initCoins(){
  coins = [];
  const positions = LEVELS[levelIndex].coins();

const POWERUP_INFO = {
  magnet: {label:"MAGNET",   color:"#44aaff", duration:7},
  shield: {label:"SHIELD",   color:"#33ff88", duration:10},
  hyper:  {label:"HYPER BEAM", color:"#ff4444", duration:5},
};
let powerUpBoxes = [];
function initPowerUpBoxes(){
  // slow-floating crystal/egg boxes hovering over or above a few platforms
  powerUpBoxes = LEVELS[levelIndex].powerBoxes.map(b=>(
    {x:b.x,y:b.y,bob:rnd(0,Math.PI*2),alive:true}
  ));
}
function applyPowerUp(kind){
  const info=POWERUP_INFO[kind];
  player.activePower={kind, timer:info.duration, maxTimer:info.duration, color:info.color, label:info.label};
  if(kind==="shield") player.shieldCharge=true;
  playPowerUp();
  spawnFloatingText(player.x+PLAYER_W/2-camX, player.y-14, info.label+"!", info.color, 15);
}
function breakPowerUpBox(box){
  box.alive=false;
  playPowerUp();
  spawnParticles(box.x-camX,box.y,16,["#ffe94f","#fff6b3","#ffffff","#ffcc33"],
    {minSpd:60,maxSpd:220,minLife:0.3,maxLife:0.6,type:"square",gravity:160,minSz:3,maxSz:6});
  // the golden crystal box only ever rolls the three classic buffs — the
  // weapon-swap pickups below are deliberately separate, fixed items
  const kinds=["magnet","shield","hyper"];
  applyPowerUp(kinds[Math.floor(Math.random()*kinds.length)]);
}

// ─── THE ARSENAL (Contra letter pickups) ──────────────────────
// The base plasma beam never runs out. Everything else is a letter you pick
// up, fire until the ammo clock empties, and then lose — which is what makes
// finding one matter and losing one sting.
//
// Ammo is measured in SECONDS OF FIRE for every weapon, including the rocket
// pod (which auto-fires while held). One unit for all four keeps the HUD bar
// honest and stops "12 rockets vs 6 seconds" from needing two mental models.
const WEAPONS={
  beam:   {letter:"B", label:"PLASMA BEAM", color:"#ff8800", ammo:Infinity},
  spread: {letter:"S", label:"SPREAD BEAM", color:"#3ec6ff", ammo:6.5},
  rocket: {letter:"R", label:"ROCKET POD",  color:"#ff4477", ammo:5.0},
  flame:  {letter:"F", label:"FLAME SHRED", color:"#ffaa22", ammo:5.0},
  seed:   {letter:"T", label:"SİSMİK TOHUM",color:"#22c55e", ammo:5.5},
  // Not a damage weapon at all: it turns a living enemy into scenery. A
  // frozen one is inert, is a platform you can stand on, and shatters into
  // shards that cut down whatever is standing near it.
  freeze: {letter:"D", label:"DONDURUCU",   color:"#7dd3fc", ammo:6.0},
};
const FREEZE_TO_SOLID=0.8;   // seconds of beam to lock one up
const FROZEN_SECONDS=6;      // how long it stays a block
let weapon="beam";
let weaponAmmo=Infinity;
let rocketCd=0;

function equipWeapon(kind){
  const w=WEAPONS[kind];
  if(!w) return;
  weapon=kind; weaponAmmo=w.ammo; rocketCd=0;
  playPowerUp();
  spawnFloatingText(player.x+PLAYER_W/2-camX,player.y-28,w.letter+" — "+w.label,w.color,16);
  queueRadio(null,"SİLAH SİSTEMİ",[w.label+" hazır!","Cephane sınırlı — iyi kullan."],
    {color:w.color,hold:2.2});
}
function dropToBaseWeapon(){
  weapon="beam"; weaponAmmo=Infinity; rocketCd=0;
  spawnFloatingText(player.x+PLAYER_W/2-camX,player.y-28,"CEPHANE BİTTİ","#ff6677",14);
  queueRadio(null,"SİLAH SİSTEMİ",["Cephane bitti.","Temel plazmaya dönüldü."],
    {color:"#ff6677",hold:2.0});
}
// a straight-flying rocket, reusing the lava bomb's projectile and splash
function firePlayerRocket(){
  const mx=player.x+(player.facing>0?PLAYER_W+2:-4);
  const my=player.y+PLAYER_H*0.38;
  playerBombs.push({x:mx,y:my,vx:player.facing*560,vy:0,life:0,straight:true});
  player.vx-=player.facing*RECOIL_FORCE*0.5;
  playPew();
}
// The canopy's own weapon: a seed lobbed on an arc that erupts into a vine
// burst where it lands. Slower than the rocket pod, wider blast, and it
// reaches over a ledge instead of through it.
function firePlayerSeed(){
  const mx=player.x+(player.facing>0?PLAYER_W+2:-4);
  const my=player.y+PLAYER_H*0.30;
  playerBombs.push({x:mx,y:my,vx:player.facing*330,vy:-320,life:0,seed:true});
  player.vx-=player.facing*RECOIL_FORCE*0.4;
  playPew();
}

// ─── PLAYER LAVA BOMB (Magma Crystal instant attack) ──────────
let playerBombs=[];
function firePlayerLavaBomb(){
  const mx=player.x+(player.facing>0?PLAYER_W+2:-4);
  const my=player.y+PLAYER_H*0.38;
  playerBombs.push({x:mx,y:my,vx:player.facing*280,vy:-360,life:0});
  player.vx-=player.facing*RECOIL_FORCE*1.5;
}
function explodePlayerBomb(bomb){
  const ex=bomb.x-camX, ey=bomb.y;
  const seed=!!bomb.seed;
  // the seed erupts wider than a bomb and throws its debris upward
  const radius=seed?110:70;
  spawnParticles(ex,ey,seed?30:22,
    seed?["#22c55e","#4ade80","#a7f3d0","#ffffff"]:["#ff4400","#ff8800","#ffdd44","#ffffff"],
    {minSpd:100,maxSpd:seed?340:300,upBias:seed?120:0,
     minLife:0.3,maxLife:seed?0.9:0.7,type:seed?"square":"circle",gravity:seed?120:180});
  if(seed){
    // a ring of vines whipping up out of the ground
    for(let i=0;i<10;i++){
      const a=(i/10)*Math.PI-Math.PI;
      particles.push({
        x:ex+Math.cos(a)*30, y:ey,
        vx:Math.cos(a)*90, vy:-rnd(180,320),
        life:1, maxLife:rnd(0.4,0.8),
        color:"#2f6b3d", size:rnd(3,7), type:"square", gravity:420
      });
    }
  }
  screenShake=Math.min(6,screenShake+(seed?6:5));
  hitStopTimer=Math.max(hitStopTimer,seed?0.07:0.05);
  playExplosion();
  // heavy splash damage to every enemy (and the boss) within the blast radius
  const targets=[...enemies,...groundEnemies];
  if(boss&&!boss.dead&&boss.introState==="active") targets.push(boss);
  for(const e of targets){
    if(e.dead||e.dying) continue;
    const ecx=e.type==="ground"?e.x+e.w/2:e.x, ecy=e.y;
    if(Math.hypot(ecx-bomb.x,ecy-bomb.y)<radius){
      e.hp-=e.type==="boss"?4:99;
      e.hitFlash=0.3;
      if(e.hp<=0 && !e.dying){ e.dying=true; e.deathTimer=0.07; }
    }
  }
}

// ─── CAPTIVE CAGES: shoot to free a baby dino (drops coins + fuel) ────
// the captive is baby.png — the little dino you're here to rescue. Its art is
// already cleanly cut out, so the bbox is a plain alpha trim (no near-white
// exclusion, which would eat its eye highlight and teeth).
const babySprite=new Image();
let babySpriteLoaded=false;
let babySpriteBBox=null;
babySprite.onload=()=>{
  babySpriteBBox=computeSpriteBBox(babySprite,false);
  babySpriteLoaded=true;
};
babySprite.src=assetURL("baby.png");
// draws the captive at (cx,cy) scaled to `h` px tall, optionally mirrored
function drawBaby(cx,cy,h,faceDir,species){
  // a rescued hatchling can be a different species — the canopy's hostage is
  // a triceratops, and it runs in the same train as the volcano's babies
  if(species&&species!=="baby"){
    if(drawSpeciesArt(species,cx,cy,h*1.5,h,faceDir||1)) return;
  }
  if(!babySpriteLoaded){
    ctx.fillStyle="#e8834a";
    ctx.beginPath(); ctx.ellipse(cx,cy,h*0.32,h*0.28,0,0,Math.PI*2); ctx.fill();
    return;
  }
  const bb=babySpriteBBox;
  const dh=h, dw=bb.w*(dh/bb.h);
  ctx.save();
  ctx.translate(cx,cy);
  ctx.scale(faceDir<0?-1:1,1);
  ctx.drawImage(babySprite,bb.x,bb.y,bb.w,bb.h,-dw/2,-dh/2,dw,dh);
  ctx.restore();
}

let cages=[];
function initCages(){
  cages=LEVELS[levelIndex].cages.map(c=>({x:c.x,y:c.y,hp:1,alive:true,species:c.species||"baby"}));
}
let babyDinos=[]; // hatchlings that have peeled off the train and run for it

// ─── RESCUE TRAIN ─────────────────────────────────────────────
// A freed hatchling no longer vanishes: it falls in behind the dino. Each
// link replays the player's OWN recorded path a fixed delay behind the link
// in front of it, so the line scampers and hovers exactly where you went
// (including up through a jetpack climb) instead of homing in a straight line.
//
// Everything here is world space — playerTrail stores world coordinates and
// camX is subtracted only inside drawFollowers().
const MAX_FOLLOWERS=3;      // at most three hatchlings in the chain
const FOLLOW_GAP=0.30;      // seconds of lag between consecutive links
const TRAIL_SECONDS=2.4;    // how much player history the trail keeps
const PANIC_SECONDS=5.0;    // window to grab a scared hatchling back
const REJOIN_GRACE=1.2;     // i-frames after joining, so one hit is not two
const CATCH_LOCK=0.4;       // it has to actually break away before you can grab it
let followers=[];
let playerTrail=[];         // {x,y,t,facing}, world space, oldest first
let scaredBabies=[];        // knocked off the train, running loose, losable
let babyShots=[];           // fireballs spat by a full escort
let rescuedThisLevel=0;
let rescuedTotal=0;

// What the escort pays out. This is the whole point of the POW model: the
// hatchlings are not a score counter you fill in, they are equipment you can
// lose. Carrying more makes you stronger, so losing one is felt immediately.
//   1 → the beam ticks damage faster
//   2 → the jetpack refuels faster
//   3 → they start spitting fireballs at whatever is closest
function followerPower(){
  const n=followers.length;
  return {
    beamMult: n>=3 ? 0.62 : (n>=1 ? 0.78 : 1),  // multiplies the damage interval
    fuelMult: n>=2 ? 1.9 : 1,
    shooting: n>=3,
    tier: n
  };
}

function recordPlayerTrail(){
  playerTrail.push({x:player.x+PLAYER_W/2, y:player.y+PLAYER_H*0.55, t:t, facing:player.facing});
  while(playerTrail.length>2 && t-playerTrail[0].t>TRAIL_SECONDS) playerTrail.shift();
}
// the sample the player occupied `delay` seconds ago (newest-first scan)
function trailSampleAt(delay){
  const want=t-delay;
  for(let i=playerTrail.length-1;i>=0;i--){
    if(playerTrail[i].t<=want) return playerTrail[i];
  }
  return playerTrail[0]||null;
}
// called after a teleporting respawn — otherwise the chain would whip across
// the whole level chasing a trail that no longer connects to the player
function snapFollowersToPlayer(){
  playerTrail=[];
  recordPlayerTrail();
  for(const f of followers){
    f.x=player.x+PLAYER_W/2;
    f.y=player.y+PLAYER_H*0.55;
  }
}
// Anything that would hurt the player hurts the escort too. Enemy boxes are
// tested the same way the player's own collision tests them ({x,y,w,h} as
// drawn), so a hit that looks like a hit is one.
function followerHazardAt(f){
  const box={x:f.x-12,y:f.y-12,w:24,h:24};
  for(const e of enemies){
    if(e.dead||e.dying) continue;
    if(overlaps(box,{x:e.x,y:e.y,w:e.w,h:e.h})) return true;
  }
  for(const e of groundEnemies){
    if(e.dead||e.dying) continue;
    if(overlaps(box,{x:e.x,y:e.y,w:e.w,h:e.h})) return true;
  }
  if(boss&&!boss.dead&&boss.introState==="active" &&
     overlaps(box,{x:boss.x-boss.w/2,y:boss.y-boss.h/2,w:boss.w,h:boss.h})) return true;
  for(const lb of lavaBalls) if(Math.hypot(lb.x-f.x,lb.y-f.y)<22) return true;
  for(const m of magmaBursts) if(Math.hypot(m.x-f.x,m.y-f.y)<20) return true;
  for(const fb of bossFlameBursts){
    if(fb.life>0.4 && Math.abs(fb.x-f.x)<26 && f.y>fb.y) return true;
  }
  return false;
}
// knocked off the train: it bolts, and PANIC_SECONDS later it is gone
function panicFollower(idx){
  const f=followers[idx];
  followers.splice(idx,1);
  scaredBabies.push({
    species:f.species||"baby",
    x:f.x, y:f.y,
    vx:-player.facing*rnd(40,110)+rnd(-40,40), vy:-240,
    timer:PANIC_SECONDS, catchLock:CATCH_LOCK, bob:rnd(0,Math.PI*2), facing:f.facing
  });
  playBabyPanic();
  screenShake=Math.min(6,screenShake+3);
  hitStopTimer=Math.max(hitStopTimer,0.04);
  spawnFloatingText(f.x-camX,f.y-22,"YAVRU PANİKTE!","#ff5577",13);
  spawnParticles(f.x-camX,f.y,10,["#ffdd88","#ff5577","#ffffff"],
    {minSpd:60,maxSpd:180,minLife:0.2,maxLife:0.5,type:"circle",gravity:120});
  // null key = never deduped; this one has to be allowed to fire every time
  queueRadio(null,"YAVRU DİNO",["Korktum, kaçıyorum!","Yakala beni!"],
    {color:"#ff5577",urgent:true,hold:2.2});
}
function recaptureBaby(b){
  if(followers.length>=MAX_FOLLOWERS){
    const oldest=followers.shift();
    babyDinos.push({x:oldest.x,y:oldest.y,vx:player.facing*110,life:1.6});
  }
  followers.push({x:b.x,y:b.y,bob:rnd(0,Math.PI*2),facing:player.facing,grace:REJOIN_GRACE,species:b.species||"baby"});
  playChime(chain);
  spawnFloatingText(b.x-camX,b.y-20,"YAKALANDI!","#8effc9",14);
  spawnParticles(b.x-camX,b.y,12,["#8effc9","#ffdd88","#ffffff"],
    {minSpd:50,maxSpd:170,minLife:0.2,maxLife:0.5,type:"circle",gravity:60});
}
// gone: the stage tally and the run tally both go down, which is what makes
// the debrief's "X / 3" an actual result instead of a receipt
function loseBaby(b,silent){
  rescuedThisLevel=Math.max(0,rescuedThisLevel-1);
  rescuedTotal=Math.max(0,rescuedTotal-1);
  spawnParticles(b.x-camX,b.y,14,["#ff3355","#772233","#ffffff"],
    {minSpd:60,maxSpd:200,minLife:0.3,maxLife:0.7,type:"square",gravity:140});
  if(silent) return;
  playBabyLost();
  spawnFloatingText(b.x-camX,b.y-20,"YAVRU KAYBEDİLDİ","#ff3355",15);
  queueRadio(null,"KOMUTA MERKEZİ",["Bir yavru kayboldu.","Diğerlerini kaybetme!"],
    {color:"#ff3355",urgent:true,hold:2.6});
}
function updateScaredBabies(dt){
  for(let i=scaredBabies.length-1;i>=0;i--){
    const b=scaredBabies[i];
    b.timer-=dt;
    b.bob+=dt*14;
    b.vy+=900*dt;
    b.x+=b.vx*dt; b.y+=b.vy*dt;
    b.vx*=Math.pow(0.45,dt);
    b.facing=b.vx>=0?1:-1;
    // frightened hopping: it bounces along whatever it lands on instead of
    // standing still waiting to be collected
    for(const p of platforms){
      if(p.lavaPit) continue;
      if(b.x>p.x-6&&b.x<p.x+p.w+6&&b.y>=p.y-14&&b.y<=p.y+18&&b.vy>0){
        b.y=p.y-12; b.vy=-rnd(130,230); b.vx+=rnd(-50,50);
        break;
      }
    }
    // The train rides right on top of a standing player, so without this
    // lock the hatchling would be re-grabbed on the very frame it panics and
    // the whole mechanic would never fire. It has to break away first.
    if(b.catchLock>0) b.catchLock-=dt;
    else if(Math.hypot((player.x+PLAYER_W/2)-b.x,(player.y+PLAYER_H*0.55)-b.y)<38){
      recaptureBaby(b); scaredBabies.splice(i,1); continue;
    }
    if(b.y>LAVA_Y||b.timer<=0){ loseBaby(b,false); scaredBabies.splice(i,1); continue; }
  }
}
// the escort fights back once all three are aboard
function updateBabyShots(dt){
  for(let i=babyShots.length-1;i>=0;i--){
    const s=babyShots[i];
    s.x+=s.vx*dt; s.y+=s.vy*dt; s.life+=dt;
    if(s.life>1.8){ babyShots.splice(i,1); continue; }
    let hit=false;
    for(const e of [...enemies,...groundEnemies]){
      if(e.dead||e.dying) continue;
      if(overlaps({x:s.x-5,y:s.y-5,w:10,h:10},{x:e.x,y:e.y,w:e.w,h:e.h})){
        e.hp-=1; e.hitFlash=0.2;
        if(e.hp<=0&&!e.dying){ e.dying=true; e.deathTimer=0.07; }
        hit=true; break;
      }
    }
    if(hit){
      spawnParticles(s.x-camX,s.y,6,["#ffaa33","#ffdd88","#ffffff"],
        {minSpd:40,maxSpd:140,minLife:0.15,maxLife:0.35,type:"circle",gravity:80,minSz:1,maxSz:3});
      babyShots.splice(i,1);
    }
  }
}
function drawBabyShots(){
  for(const s of babyShots){
    const sx=s.x-camX;
    glow("#ff8800",12);
    ctx.fillStyle="#ffaa33";
    ctx.beginPath(); ctx.arc(sx,s.y,5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle="#fff3c4";
    ctx.beginPath(); ctx.arc(sx-1,s.y-1,2,0,Math.PI*2); ctx.fill();
    noGlow();
  }
}
function drawScaredBabies(){
  for(const b of scaredBabies){
    const bx=b.x-camX;
    if(bx<-40||bx>W+40) continue;
    // blinks faster and faster as the window runs out
    const urgency=1-clamp(b.timer/PANIC_SECONDS,0,1);
    if(Math.sin(t*(10+urgency*26))<-0.35) continue;
    glow("#ff5577",12);
    drawBaby(bx,b.y,26,b.facing,b.species);
    noGlow();
    // alarm bubble + a ring that drains with the timer
    ctx.textAlign="center";
    ctx.font="bold 14px 'Courier New',monospace";
    ctx.fillStyle="#ff5577";
    ctx.fillText("!",bx,b.y-22);
    ctx.textAlign="left";
    ctx.strokeStyle="rgba(255,85,119,0.85)"; ctx.lineWidth=2;
    ctx.beginPath();
    ctx.arc(bx,b.y,17,-Math.PI/2,-Math.PI/2+Math.PI*2*clamp(b.timer/PANIC_SECONDS,0,1));
    ctx.stroke();
  }
}

function updateFollowers(dt){
  recordPlayerTrail();
  // hazards first, and collected before the walk loop so splicing the array
  // mid-iteration can't skip a link
  const hit=[];
  for(let i=0;i<followers.length;i++){
    const f=followers[i];
    if(f.grace>0){ f.grace-=dt; continue; }
    if(followerHazardAt(f)) hit.push(i);
  }
  for(let k=hit.length-1;k>=0;k--) panicFollower(hit[k]);

  const pw=followerPower();
  for(let i=0;i<followers.length;i++){
    const f=followers[i];
    const s=trailSampleAt(FOLLOW_GAP*(i+1)+0.12);
    if(!s) continue;
    // ease toward the recorded point instead of snapping onto it, so the line
    // stays springy through turns and dashes
    const k=Math.min(1,dt*11);
    f.x+=(s.x-f.x)*k;
    f.y+=(s.y-f.y)*k;
    f.facing=s.facing;
    f.bob+=dt*(9+i*1.4);
    if(f.joy>0) f.joy=Math.max(0,f.joy-dt*0.6);

    // a full escort spits fireballs at whatever is closest
    if(pw.shooting){
      f.shootCd=(f.shootCd===undefined?rnd(0.5,1.5):f.shootCd)-dt;
      if(f.shootCd<=0){
        f.shootCd=rnd(1.1,1.9);
        let best=null,bestD=340;
        for(const e of [...enemies,...groundEnemies]){
          if(e.dead||e.dying) continue;
          const d=Math.hypot((e.x+e.w/2)-f.x,(e.y+e.h/2)-f.y);
          if(d<bestD){ bestD=d; best=e; }
        }
        if(best){
          const dx=(best.x+best.w/2)-f.x, dy=(best.y+best.h/2)-f.y;
          const dd=Math.hypot(dx,dy)||1;
          babyShots.push({x:f.x,y:f.y,vx:(dx/dd)*420,vy:(dy/dd)*420,life:0});
          playPew();
        }
      }
    }

    // faint rising sparks so three of them read as a chain, not a blob.
    // spawnParticles takes SCREEN space, hence the camX here.
    if(Math.random()<dt*6) spawnParticles(f.x-camX,f.y+8,1,["#ffdd88","#fff3c4"],
      {minSpd:8,maxSpd:30,minLife:0.2,maxLife:0.45,type:"circle",gravity:-20,minSz:1,maxSz:2});
  }
}
function drawFollowers(){
  for(let i=0;i<followers.length;i++){
    const f=followers[i];
    const fx=f.x-camX;
    if(fx<-40||fx>W+40) continue;
    // a freshly freed hostage bounces for a moment before settling in line
    const joy=f.joy>0?Math.abs(Math.sin(f.bob*1.6))*10*f.joy:0;
    const bob=Math.sin(f.bob)*4+joy;
    glow(f.species==="trike"?"#7dffcf":"#ffcc55",10);
    ctx.globalAlpha=0.32;
    ctx.fillStyle="#ffcc55";
    ctx.beginPath(); ctx.ellipse(fx,f.y+15,10,3,0,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=1; noGlow();
    drawBaby(fx,f.y-bob,28,f.facing,f.species);
  }
}

function breakCage(cage){
  cage.alive=false;
  playPowerUp();
  spawnParticles(cage.x-camX,cage.y,16,["#aaaaaa","#dddddd","#888888"],
    {minSpd:60,maxSpd:200,minLife:0.3,maxLife:0.6,type:"square",gravity:220});
  spawnFloatingText(cage.x-camX,cage.y-20,"KURTARILDI!","#ffdd44",14);
  rescuedThisLevel++; rescuedTotal++;
  // the hatchling joins the tail of the train; if the train is already full
  // the one at the front breaks away and runs for the portal on its own
  if(followers.length>=MAX_FOLLOWERS){
    const oldest=followers.shift();
    babyDinos.push({x:oldest.x,y:oldest.y,vx:player.facing*110,life:1.6});
  }
  // a thawed hostage runs as an ordinary hatchling — the frozen sheet is the
  // block it was trapped in, not a shape it keeps
  const carried=(cage.species==="frozen")?"baby":(cage.species||"baby");
  followers.push({x:cage.x,y:cage.y,bob:rnd(0,Math.PI*2),facing:player.facing,
                  grace:REJOIN_GRACE,species:carried,joy:0.9});
  const total=LEVELS[levelIndex].cages.length;
  if(rescuedThisLevel>=total){
    queueRadio("allsafe","KOMUTA MERKEZİ",
      ["Tüm soy kurtarıldı!","Tahliye portalına ilerle!"],{color:"#44ffcc",hold:3.2});
  } else {
    queueRadio("rescue"+rescuedThisLevel,"YAVRU DİNO",
      ["Kurtardın! Peşinden geliyorum!","Kalan kafes: "+(total-rescuedThisLevel)],
      {color:"#ffcc44",hold:2.2});
  }
  // leaves behind a scattering of gold + a couple of fuel canisters
  for(let i=0;i<5;i++) spawnDrop(cage.x+rnd(-20,20),cage.y-10,"coin");
  spawnDrop(cage.x-14,cage.y-16,"fuel");
  spawnDrop(cage.x+14,cage.y-16,"fuel");
}

// ─── RADIO TRANSMISSION SYSTEM ────────────────────────────────
// A small pixel comms window in the top-left that wipes open, types its line
// out and wipes shut again. It is purely presentational — nothing in here
// touches the simulation, so a transmission plays over a live firefight
// without stealing a single frame of control from the player.
//
// Screen-space only: RADIO_X/RADIO_Y are canvas coordinates, never world
// coordinates, so camX must NOT be applied anywhere in this block.
const RADIO_X=12, RADIO_Y=44, RADIO_W=336, RADIO_H=84;
let radio=null;      // the transmission currently on the air
let radioQueue=[];   // transmissions waiting their turn
let radioFired={};   // per-stage dedupe keys — cleared by loadLevel()
let radioTypeTick=0;

// key   — dedupe id; the same key never fires twice in one stage
// lines — pre-wrapped, at most 3 lines of ~40 chars (no runtime measuring)
function queueRadio(key,title,lines,opts){
  opts=opts||{};
  if(key && radioFired[key]) return;
  if(key) radioFired[key]=true;
  const msg={
    title:title, lines:lines,
    color:opts.color||"#44ffcc",
    urgent:!!opts.urgent,
    hold:opts.hold||3.4,
    phase:"open", timer:0, chars:0
  };
  if(msg.urgent && radio){
    // an urgent call (heat alarm, boss) cuts straight over whatever is on the
    // air instead of politely queueing up behind it
    radioQueue.unshift(radio);
    radio=null;
  }
  if(radio) radioQueue.push(msg);
  else { radio=msg; playRadioBeep(msg.urgent); }
}
function updateRadio(dt){
  if(!radio){
    if(radioQueue.length){ radio=radioQueue.shift(); playRadioBeep(radio.urgent); }
    return;
  }
  radio.timer+=dt;
  if(radio.phase==="open"){
    if(radio.timer>=0.22){ radio.phase="type"; radio.timer=0; }
  } else if(radio.phase==="type"){
    const total=radio.lines.join("").length;
    const prev=radio.chars;
    radio.chars=Math.min(total,Math.floor(radio.timer*46));
    if(radio.chars>prev){
      radioTypeTick-=dt;
      if(radioTypeTick<=0){ playRadioType(); radioTypeTick=0.045; }
    }
    if(radio.chars>=total){ radio.phase="hold"; radio.timer=0; }
  } else if(radio.phase==="hold"){
    if(radio.timer>=radio.hold){ radio.phase="close"; radio.timer=0; }
  } else {
    if(radio.timer>=0.2) radio=null;
  }
}
// the little radio set drawn in the window's title bar
function drawRadioIcon(ix,iy,color,urgent){
  ctx.fillStyle="#12202a"; ctx.fillRect(ix,iy+2,16,12);
  ctx.strokeStyle=color; ctx.lineWidth=1;
  ctx.strokeRect(ix+0.5,iy+2.5,15,11);
  ctx.beginPath(); ctx.moveTo(ix+13,iy+3); ctx.lineTo(ix+17,iy-2); ctx.stroke();
  // VU bars bounce only while a line is actually printing
  const live=radio&&radio.phase==="type";
  for(let b=0;b<3;b++){
    const hgt=live?2+Math.abs(Math.sin(t*14+b))*7:2;
    ctx.fillStyle=urgent?"#ff5555":color;
    ctx.fillRect(ix+3+b*4,iy+12-hgt,3,hgt);
  }
}
function drawRadio(){
  if(!radio) return;
  // open/close wipe: the window grows out of a single scanline
  let openness=1;
  if(radio.phase==="open") openness=clamp(radio.timer/0.22,0,1);
  else if(radio.phase==="close") openness=1-clamp(radio.timer/0.2,0,1);
  const h=Math.max(2,RADIO_H*openness);
  const y=RADIO_Y+(RADIO_H-h)/2;

  ctx.save();
  ctx.fillStyle="rgba(4,10,14,0.88)";
  ctx.fillRect(RADIO_X,y,RADIO_W,h);
  ctx.shadowColor=radio.color; ctx.shadowBlur=10;
  ctx.strokeStyle=radio.color; ctx.lineWidth=2;
  ctx.strokeRect(RADIO_X,y,RADIO_W,h);
  ctx.shadowBlur=0;
  if(openness<0.995){ ctx.restore(); return; } // mid-wipe: draw the frame only

  ctx.globalAlpha=0.18; ctx.fillStyle=radio.color;
  ctx.fillRect(RADIO_X+2,y+2,RADIO_W-4,16);
  ctx.globalAlpha=1;
  drawRadioIcon(RADIO_X+8,y+4,radio.color,radio.urgent);
  ctx.textAlign="left";
  ctx.font="bold 10px 'Courier New',monospace";
  ctx.fillStyle=radio.color;
  ctx.fillText(radio.title,RADIO_X+32,y+14);
  if(Math.sin(t*10)>0){
    ctx.fillStyle=radio.urgent?"#ff3344":"#ffdd44";
    ctx.fillRect(RADIO_X+RADIO_W-16,y+6,8,8);
  }

  // message body, revealed character by character across the lines
  ctx.font="12px 'Courier New',monospace";
  ctx.fillStyle="#dff7ff";
  let budget=(radio.phase==="type")?radio.chars:1e9;
  let ty=y+36;
  for(const line of radio.lines){
    if(budget<=0) break;
    ctx.fillText(line.slice(0,Math.max(0,budget)),RADIO_X+10,ty);
    budget-=line.length;
    ty+=16;
  }
  // CRT scanlines over the whole window
  ctx.globalAlpha=0.12; ctx.fillStyle="#000";
  for(let sy=y+2;sy<y+h-2;sy+=3) ctx.fillRect(RADIO_X+2,sy,RADIO_W-4,1);
  ctx.globalAlpha=1;
  ctx.restore();
}

// ─── FLOATING TEXT (score pop-ups, combo/fever callouts) ──────
let floatingTexts=[];
function spawnFloatingText(x,y,text,color,size){
  floatingTexts.push({x,y,text,color,size:size||14,life:1,vy:-46});
}
function updateFloatingTexts(dt){
  floatingTexts=floatingTexts.filter(f=>{
    f.life-=dt/1.0;
    f.y+=f.vy*dt;
    f.vy*=Math.pow(0.06,dt);
    return f.life>0;
  });
}
function drawFloatingTexts(){
  ctx.textAlign="center";
  for(const f of floatingTexts){
    ctx.globalAlpha=Math.max(0,f.life);
    ctx.fillStyle=f.color;
    ctx.font=`bold ${f.size}px 'Courier New',monospace`;
    ctx.fillText(f.text,f.x,f.y);
  }
  ctx.globalAlpha=1;
  ctx.textAlign="left";
}

// ─── EVACUATION PORTAL SPRITE (portal.png) ────────────────────
// The rift art. Like every other sprite here it needs a fallback, because it
// loads asynchronously and may not exist at all: until (or unless) it
// arrives, drawPlatforms() keeps rendering the procedural obsidian arch on
// its own, and the arch stays underneath the sprite once it does load.
//
// The shipped portal.jpg is really a WebP with an opaque white background;
// portal.png is that file with the white keyed out, which is why the sprite
// path prefers the .png and only falls back to the original.
const PORTAL_H=170;            // drawn height in px, before the pulse
const portalSprite=new Image();
let portalLoaded=false;
let portalBBox=null;
let portalTriedFallback=false;
portalSprite.onload=()=>{
  portalBBox=computeSpriteBBox(portalSprite,false);
  portalLoaded=true;
};
portalSprite.onerror=()=>{
  // no portal.png — try the original drop, then give up and stay procedural
  if(!portalTriedFallback){ portalTriedFallback=true; portalSprite.src=assetURL("portal.jpg"); }
};
portalSprite.src=assetURL("portal.png");

let portalReveal=0;            // 0→1 materialise animation, driven by gateOpen

// where the rift sits in WORLD space: centred on the goal platform, standing
// on it. camX is applied by the caller, never here.
function goalPortalPos(){
  for(const p of platforms){
    if(p.goal) return {x:p.x+p.w/2, y:p.y+6-PORTAL_H/2};
  }
  return {x:0,y:0};
}

// ─── WARP-IN: the squad gets drunk by the rift ────────────────
const WARP_DUR=1.15;
let warpTimer=0, warpX=0, warpY=0;
function startPortalWarp(pp){
  goalReached=true;
  STATE="warp"; stateTimer=0;
  warpTimer=0; warpX=pp.x; warpY=pp.y;
  stopLaserSound(); player.wasFiring=false; laser=null;
  radio=null; radioQueue=[];
  screenShake=Math.min(6,screenShake+4);
  playPowerUp();
}
// Wraps a draw call so everything it renders is sucked toward the rift:
// scaling about the portal's centre pulls the dino AND every hatchling in
// proportionally, which is exactly the shape of the effect we want.
function drawWarped(fn){
  if(STATE!=="warp"){ fn(); return; }
  const p=clamp(warpTimer/WARP_DUR,0,1);
  const ease=p*p;                       // accelerates as it goes in
  const s=Math.max(0.02,1-0.96*ease);
  const cx=warpX-camX, cy=warpY;
  ctx.save();
  ctx.globalAlpha=Math.max(0,1-0.85*ease*ease);
  ctx.translate(cx,cy);
  ctx.rotate(ease*2.6);                 // spun around as it is drawn in
  ctx.scale(s,s);
  ctx.translate(-cx,-cy);
  fn();
  ctx.restore();
}

// ─── BOSS: Alpha Pterodactyl guarding the exit gate ───────────
const BOSS_W=140, BOSS_H=100;
const BOSS_BREATH_REACH=430;   // how far the Glacier Titan's breath carries
const BREATH_ARC=0.52;         // radians either side of level, phase 2 only
const BREATH_HALF_W=34;        // how thick the beam is, measured off its axis

// Distance from a point to a segment. The breath is tested with this rather
// than as an x-range plus a y-band, because in phase 2 the beam is no longer
// horizontal — and at angle 0 this is the same band it always was.
function segDist(px,py,ax,ay,bx,by){
  const dx=bx-ax, dy=by-ay;
  const len2=dx*dx+dy*dy;
  const u=len2>0 ? clamp(((px-ax)*dx+(py-ay)*dy)/len2,0,1) : 0;
  return Math.hypot(px-(ax+u*dx), py-(ay+u*dy));
}
// Where the breath starts and ends, in world space. One source of truth, so
// the hit test and the drawing can never disagree about where the beam is.
function breathRay(){
  const dir=boss.breathDir||-1;
  const ang=boss.breathAngle||0;
  const ax=boss.x+dir*boss.w*0.45, ay=boss.y-boss.h*0.18;
  return {ax, ay,
          bx:ax+dir*BOSS_BREATH_REACH*Math.cos(ang),
          by:ay+BOSS_BREATH_REACH*Math.sin(ang)};
}
// The Titan's phase 2 glazes the whole floor. It reads as "the arena froze
// over" because the fight is camera-locked into the arena band anyway.
function titanSlick(){
  return !!(boss && !boss.dead && !boss.dying &&
            boss.kind==="titan" && boss.phase>=2 && boss.introState==="active");
}
let boss=null;
let gateOpen=false;
let bossShakeTimer=0; // sustained heavier shake on boss death, separate from normal hit-shake decay
let lavaBalls=[];
let bossFlameBursts=[]; // vertical flame-burst hazards from the boss's second attack
let shockwaves=[];      // ground waves thrown out by the walker's stomp
function initBoss(){
  const spec=LEVELS[levelIndex].boss;
  // stages without a boss get no boss entity at all, and their exit portal
  // starts already open — there's nothing guarding it
  boss = spec ? {
    type:"boss",
    x:spec.x, y:-160, baseY:170, w:spec.w||BOSS_W, h:spec.h||BOSS_H,
    hp:spec.hp||12, maxHp:spec.hp||12,
    name:spec.name||"ALFA PTERODACTYL", title:spec.title||"",
    kind:spec.kind||"flyer",
    art:spec.sprite||"enemyboss.png", rageArt:spec.rageSprite||null,
    summons:spec.summons||null,
    phase:1,               // flips to 2 at half health — see enterBossPhase2
    diveState:"none", diveTimer:0, diveCooldown:rnd(3,5), diveDir:-1,
    stompCooldown:2.2, walkDir:-1,
    breathState:"none", breathTimer:0, breathCooldown:rnd(2.5,4), breathDir:-1,
    breathAngle:0, breathDur:1,   // the sweep — stays 0 for the whole of phase 1
    poundCooldown:rnd(5,7),
    wavePhase:rnd(0,Math.PI*2),
    fireCooldown:2.5,      // slow homing lava-ball attack
    flameCooldown:4,       // vertical flame-burst attack
    hitFlash:0, dying:false, deathTimer:0, dead:false, beamTick:0,
    introState:"pending", introTimer:0 // pending → warning → descending → active
  } : null;
  bossCardTimer=0; bossRageTimer=0;
  gateOpen = !spec;
  // stages with no boss have the rift standing there from the start; on the
  // boss stage it has to be earned, so it materialises in killBoss()
  portalReveal = spec?0:1;
  lavaBalls=[];
  bossFlameBursts=[];
  shockwaves=[];
  { const TH=themeOf();
    if(TH.portalArt) artFor(TH.portalArt);
    if(TH.bg) artFor(TH.bg);
    if(TH.cap) artFor(TH.cap.art); }   // start the biome plates downloading
  if(boss) artFor(boss.art);            // start the download early
  if(boss&&boss.rageArt) artFor(boss.rageArt);
  bossIntroTriggered=false;
  warningBannerTimer=0;
  stageClearDelay=0;
}

// ─── ENTERING A WORLD ─────────────────────────────────────────
// A world is a run of stages. Starting one is a fresh mission: score, credits
// and the arsenal all reset, which is what makes a per-world grade and a
// per-world rescue tally mean anything.
function worldOfLevel(i){
  for(let w=0;w<WORLDS.length;w++) if(WORLDS[w].levels.indexOf(i)>=0) return w;
  return 0;
}
function stageInWorld(){
  const lv=WORLDS[worldIndex]?WORLDS[worldIndex].levels:[];
  const p=lv.indexOf(levelIndex);
  return {pos:p<0?0:p, count:lv.length||1};
}
function startWorld(i){
  const w=WORLDS[i];
  if(!w||!w.levels.length) return false;
  worldIndex=i;
  score=0; chain=0; chainTimer=0; feverMode=false; feverFlash=0;
  newRecord=false;
  player.hp=player.maxHp; player.invuln=0;
  player.activePower=null; player.shieldCharge=false;
  player.dashTimer=0; player.dashCooldown=0; player.dashKeyWasDown=false;
  continuesLeft=MAX_CONTINUES; continueTimer=0;
  weapon="beam"; weaponAmmo=Infinity; rocketCd=0;
  rescuedTotal=0; lastRescueBonus=0; lastComboBonus=0; babyDinos=[];
  screenShake=0; bossShakeTimer=0; hitStopTimer=0;
  stopLaserSound(); stopSiren(); player.wasFiring=false;
  loadLevel(w.levels[0]);
  STATE="playing"; stateTimer=0;
  return true;
}
// Called when the last stage of a world is signed off. Stamps the map,
// unlocks the next world, and drops the player back onto it.
function finishWorld(){
  markWorldCleared(worldIndex);
  mapStampWorld=worldIndex; mapStampTimer=2.4; mapSel=worldIndex;
  const anyLeft=WORLDS.some((w,i)=>w.levels.length&&!worldState(i).cleared);
  if(!anyLeft){ STATE="win"; stateTimer=0; return; }
  STATE="map"; stateTimer=0;
  playPowerUp();
}

// A mirror sheen over every walking surface while the Titan's floor is
// frozen, so "you have no grip any more" is something you can see before it
// is something you discover.
function drawGlaze(){
  if(!titanSlick()) return;
  const pulse=0.5+0.5*Math.sin(t*3);
  ctx.save();
  ctx.globalCompositeOperation="lighter";
  for(const p of platforms){
    if(p.lavaPit||p.gone) continue;
    const sx=p.x-camX;
    if(sx>W||sx+p.w<0) continue;
    const g=ctx.createLinearGradient(0,p.y,0,p.y+16);
    g.addColorStop(0,"rgba(223,246,255,"+(0.20+0.10*pulse).toFixed(3)+")");
    g.addColorStop(1,"rgba(125,211,252,0)");
    ctx.fillStyle=g;
    ctx.fillRect(sx,p.y,p.w,16);
  }
  ctx.restore();
}

// ─── THE BLIZZARD ─────────────────────────────────────────────
// A stage can declare `wind`: gusts that blow across it on a cycle — calm,
// a telegraphed warning, then a couple of seconds of real sideways pressure.
// It is the horizontal answer to the canopy's rising fog, and it only means
// anything on ice, where you cannot plant your feet and stop.
//
// The gust is modelled as drag toward a wind speed, not as a raw force: an
// unopposed dino is carried up to `speed` and no further, so the shove can
// never fling anyone across the level. And it only ever ACCELERATES you
// downwind — running with the wind faster than the wind is not braked, which
// would read as a bug rather than as weather.
let windState="off", windTimer=0, windDir=-1;
function initWind(){
  const w=LEVELS[levelIndex].wind;
  windState = w ? "calm" : "off";
  windTimer = w ? rnd(1.5,3) : 0;
  windDir   = -1;
}
function applyWind(dt){
  const w=LEVELS[levelIndex].wind;
  if(!w||windState!=="blow") return;
  const target=windDir*(w.speed||170);
  if((target-player.vx)*windDir>0)
    player.vx += (target-player.vx)*Math.min(1,dt*(w.rate||1.9));
}
function updateWind(dt){
  const w=LEVELS[levelIndex].wind;
  if(!w){ windState="off"; return; }
  windTimer-=dt;
  if(windState==="calm"&&windTimer<=0){
    // the direction is chosen at the warning, never at the gust, so the
    // arrow you are shown is always the way you are about to be pushed
    windDir=Math.random()<0.5?-1:1;
    windState="warn"; windTimer=w.warn||1;
    playRadioBeep(true);
    // the first gust of the stage explains itself; after that the arrow and
    // the whiteout are the whole language
    queueRadio("storm","TİPİ ALARMI",
      ["Şiddetli rüzgâr yaklaşıyor.","Ok yönünde savrulacaksın —",
       "sağlam zemine geç!"],
      {color:"#7dd3fc",urgent:true,hold:3.4});
  } else if(windState==="warn"&&windTimer<=0){
    windState="blow"; windTimer=w.blow||2;
    screenShake=Math.min(6,screenShake+3);
  } else if(windState==="blow"&&windTimer<=0){
    windState="calm"; windTimer=rnd(w.calmMin||3.2,w.calmMax||5);
  }
  if(windState==="blow"&&Math.random()<dt*70){
    // snow torn across the screen, so the gust is visible in the air and not
    // only in how the dino moves. Particles live in screen space.
    particles.push({
      x: windDir>0?-10:W+10, y: rnd(0,H-60),
      vx: windDir*rnd(430,780), vy: rnd(-30,60),
      life:1, maxLife:rnd(0.5,1.1),
      color: Math.random()<0.5?"#ffffff":"#bfe6ff",
      size: rnd(1,3), type:"square", gravity:0
    });
  }
}
function drawWind(){
  if(windState==="off"||windState==="calm") return;
  const blowing=windState==="blow";
  const pulse=0.5+0.5*Math.sin(t*(blowing?14:9));
  ctx.save();
  // a white-out crawling in from the side it blows from
  const g = windDir>0 ? ctx.createLinearGradient(0,0,W*0.45,0)
                      : ctx.createLinearGradient(W,0,W*0.55,0);
  const a=(blowing?0.16:0.07)+0.06*pulse;
  g.addColorStop(0,"rgba(223,246,255,"+a.toFixed(3)+")");
  g.addColorStop(1,"rgba(223,246,255,0)");
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  // the arrow, so which way it blows is never a guess
  ctx.textAlign="center";
  ctx.font="bold 24px 'Courier New',monospace";
  ctx.globalAlpha=blowing?1:0.45+0.55*pulse;
  ctx.fillStyle="#dff6ff";
  glow("#7dd3fc",blowing?16:8);
  ctx.fillText(windDir>0?"\u00bb\u00bb\u00bb":"\u00ab\u00ab\u00ab",
               W/2+(blowing?Math.sin(t*20)*6:0),52);
  ctx.font="bold 11px 'Courier New',monospace";
  ctx.fillText(blowing?"FIRTINA":"FIRTINA GELIYOR",W/2,70);
  noGlow();
  ctx.globalAlpha=1;
  ctx.textAlign="left";
  ctx.restore();
}

// ─── THE RISING TIDE ──────────────────────────────────────────
// A stage can declare `fog`: a sheet of spore-thick air that climbs from
// below and burns anything still under it. It is the only pressure in the
// game that is not an enemy — you cannot kill it, you can only out-climb it.
let fogY=Infinity, fogHurt=0;
function initFog(){
  const f=LEVELS[levelIndex].fog;
  fogY=f?f.startY:Infinity;
  fogHurt=0;
}
function updateFog(dt){
  const f=LEVELS[levelIndex].fog;
  if(!f) return;
  fogY=Math.max(f.topY,fogY-f.rise*dt);
  if(fogHurt>0) fogHurt-=dt;
  // standing in it burns, on a cooldown rather than every frame
  if(player.y+PLAYER_H>fogY && player.invuln<=0 && fogHurt<=0){
    fogHurt=1.1;
    takeDamage("enemy");
    spawnFloatingText(player.x+PLAYER_W/2-camX,player.y-18,"ZEHİR!","#6ee7b7",14);
  }
  // spores boiling off the surface
  if(Math.random()<dt*40){
    particles.push({
      x:rnd(0,W), y:fogY+rnd(-6,18),
      vx:rnd(-14,14), vy:-rnd(12,44),
      life:1, maxLife:rnd(0.8,1.8),
      color:Math.random()<0.5?"rgba(110,231,183,0.6)":"rgba(34,197,94,0.5)",
      size:rnd(2,5), type:"circle", gravity:-8
    });
  }
}
function drawFog(){
  if(!isFinite(fogY)) return;
  const top=fogY;
  if(top>H+camY) return;
  ctx.save();
  const g=ctx.createLinearGradient(0,top-30,0,top+120);
  g.addColorStop(0,"rgba(34,197,94,0)");
  g.addColorStop(0.25,"rgba(22,163,74,0.45)");
  g.addColorStop(1,"rgba(6,78,59,0.85)");
  ctx.fillStyle=g;
  ctx.fillRect(-200,top-30,W+400,H*2);
  // a wobbling surface line, same trick as the lava
  glow("#6ee7b7",16);
  ctx.strokeStyle="rgba(167,243,208,0.9)"; ctx.lineWidth=2;
  ctx.beginPath();
  for(let i=-40;i<=W+40;i+=12){
    const wx=(camX+i)/22;
    const hh=4*Math.sin(t*1.8+wx)+2*Math.sin(t*2.7+wx*1.5);
    i===-40?ctx.moveTo(i,top+hh):ctx.lineTo(i,top+hh);
  }
  ctx.stroke(); noGlow();
  ctx.restore();
}

// ─── FALLING ICICLES ──────────────────────────────────────────
// Hanging from the ceiling until you walk under one: it shakes for
// ICICLE_WARN, then drops like a stone and shatters. The warning is the
// whole mechanic — it is a hazard you are told about, not one that cheats.
const ICICLE_WARN=0.3, ICICLE_RESPAWN=6;
let icicles=[];
function initIcicles(){
  icicles=(LEVELS[levelIndex].icicles||[]).map(ic=>({
    x:ic.x, y:ic.y!==undefined?ic.y:40, baseY:ic.y!==undefined?ic.y:40,
    state:"hang", timer:0, vy:0
  }));
}
// the Titan's ground pound brings the whole ceiling down at once
function dropAllIcicles(){
  let n=0;
  for(const ic of icicles){
    if(ic.state!=="hang") continue;
    ic.state="shake"; ic.timer=ICICLE_WARN*0.6; n++;
  }
  return n;
}
function updateIcicles(dt){
  const pcx=player.x+PLAYER_W/2;
  for(const ic of icicles){
    if(ic.state==="hang"){
      // Shoot one down on purpose. No warning shake — it is your shot, you
      // already know it is coming, and dropping one on the armoured top of a
      // crusher is the point.
      if(laser && icicleInBeam(ic)){
        ic.state="fall"; ic.vy=160;
        spawnParticles(ic.x-camX,ic.y,8,["#dff6ff","#7dd3fc"],
          {minSpd:40,maxSpd:150,minLife:0.15,maxLife:0.4,type:"square",gravity:200,minSz:1,maxSz:3});
      }
      // armed by the player walking underneath it
      else if(Math.abs(pcx-ic.x)<26 && player.y>ic.y){ ic.state="shake"; ic.timer=ICICLE_WARN; }
    } else if(ic.state==="shake"){
      ic.timer-=dt;
      if(ic.timer<=0){ ic.state="fall"; ic.vy=120; }
    } else if(ic.state==="fall"){
      ic.vy+=1500*dt;
      ic.y+=ic.vy*dt;
      if(player.invuln<=0 &&
         Math.abs(pcx-ic.x)<20 && Math.abs((player.y+PLAYER_H/2)-ic.y)<38){
        takeDamage("enemy");
        shatterIcicle(ic);
        continue;
      }
      // a falling spike lands on enemies too, and it lands on TOP — which is
      // the side a crusher's armour does not cover
      let struck=null;
      for(const e of [...enemies,...groundEnemies]){
        if(e.dead||e.dying) continue;
        if(Math.abs((e.x+e.w/2)-ic.x)<e.w/2+14 && Math.abs((e.y+e.h/2)-ic.y)<e.h/2+20){
          struck=e; break;
        }
      }
      if(struck){
        if(struck.frozen>0) shatterFrozen(struck);
        else {
          struck.hp-=3; struck.hitFlash=0.3;
          spawnFloatingText(struck.x+struck.w/2-camX,struck.y-12,"BUZ!","#bae6fd",14);
          if(struck.hp<=0&&!struck.dying){ struck.dying=true; struck.deathTimer=0.07; }
        }
        shatterIcicle(ic);
        continue;
      }
      // shatters on the first solid thing under it
      let hit=ic.y>LAVA_Y;
      if(!hit) for(const p of platforms){
        if(p.lavaPit||p.gone) continue;
        if(ic.x>p.x && ic.x<p.x+p.w && ic.y>=p.y && ic.y<=p.y+p.h+20){ hit=true; break; }
      }
      if(hit) shatterIcicle(ic);
    } else {
      ic.timer-=dt;
      if(ic.timer<=0){ ic.state="hang"; ic.y=ic.baseY; ic.vy=0; }
    }
  }
}
// the beam test for a hanging icicle, in the same terms inLaserSweep uses
function icicleInBeam(ic){
  if(!laser) return false;
  const reach=laser.mouthX+laser.dir*laser.len;
  const withinX = laser.dir>0 ? (ic.x>=laser.mouthX&&ic.x<=reach)
                              : (ic.x<=laser.mouthX&&ic.x>=reach);
  if(!withinX) return false;
  const ys=laser.ys||[laser.mouthY];
  return ys.some(ly=>Math.abs(ly-ic.y)<40);
}
function shatterIcicle(ic){
  ic.state="gone"; ic.timer=ICICLE_RESPAWN;
  playExplosion();
  screenShake=Math.min(6,screenShake+3);
  spawnParticles(ic.x-camX,ic.y,16,["#dff6ff","#7dd3fc","#bae6fd","#ffffff"],
    {minSpd:70,maxSpd:240,minLife:0.25,maxLife:0.6,type:"square",gravity:420,minSz:2,maxSz:5});
}
function drawIcicles(){
  const a=artFor("ice_icicle.png");
  const ready=a&&a.loaded;
  for(const ic of icicles){
    if(ic.state==="gone") continue;
    let x=ic.x-camX;
    if(x<-40||x>W+40) continue;
    if(ic.state==="shake") x+=Math.sin(t*50)*3;   // the tell
    const h=74, w=22;
    if(ready){
      // one clean spike out of the middle of the cluster sheet
      ctx.drawImage(a.img,400,120,240,880, x-w/2,ic.y-h*0.5,w,h);
    } else {
      ctx.fillStyle="#9fd8f5";
      ctx.beginPath();
      ctx.moveTo(x-9,ic.y-h*0.5); ctx.lineTo(x+9,ic.y-h*0.5); ctx.lineTo(x,ic.y+h*0.5);
      ctx.closePath(); ctx.fill();
    }
    if(ic.state==="shake"){
      glow("#bae6fd",12);
      ctx.strokeStyle="rgba(190,230,255,0.9)"; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(x,ic.y+h*0.5); ctx.lineTo(x,LAVA_Y); ctx.stroke();
      noGlow();
    }
  }
}

// ─── CRUMBLING SHELVES ────────────────────────────────────────
// A mushroom shelf holds your weight for CRUMBLE_DELAY, shakes while it
// decides, drops away, and grows back. Platforms are per-stage COPIES, so
// this runtime state can live on them directly.
const CRUMBLE_DELAY=0.55, CRUMBLE_RESPAWN=2.8;
const BOUNCE_VY=-760;
const BOUNCE_FUEL=0.45;   // a fixed top-up per bounce, not a per-frame trickle
function updateCrumbles(dt){
  for(const p of platforms){
    if(!p.crumble) continue;
    if(p.gone){
      p.respawnT-=dt;
      if(p.respawnT<=0){ p.gone=false; p.crumbleT=undefined; }
    } else if(p.crumbleT!==undefined){
      p.crumbleT-=dt;
      if(p.crumbleT<=0){
        p.gone=true; p.respawnT=CRUMBLE_RESPAWN; p.crumbleT=undefined;
        // anything standing on it goes down with it — the canopy's own way
        // of turning terrain into a weapon
        for(const e of groundEnemies){
          if(e.dead||e.dying||e.turret) continue;
          if(e.x+e.w>p.x && e.x<p.x+p.w && Math.abs((e.y+e.h)-p.y)<10){
            e.dying=true; e.deathTimer=0.07;
            spawnFloatingText(e.x+e.w/2-camX,e.y-10,"DÜŞTÜ!","#6ee7b7",14);
          }
        }
        playExplosion();
        spawnParticles(p.x+p.w/2-camX,p.y+6,16,["#6ee7b7","#2f6b3d","#4b9e5b"],
          {minSpd:50,maxSpd:190,minLife:0.4,maxLife:0.9,type:"square",gravity:420,minSz:2,maxSz:6});
      }
    }
  }
}

// ─── LOAD A STAGE ─────────────────────────────────────────────
// Rebuilds every piece of live level state from the LEVELS table. Called once
// at boot, on restart, and on each stage transition — nothing else needs to
// know which stage is running.
function loadLevel(i){
  levelIndex=clamp(i,0,LEVELS.length-1);
  const L=LEVELS[levelIndex];
  levelWidth=L.width;

  platforms=L.platforms.map(p=>({...p}));  // copies: drawPlatforms caches a
                                           // jagged edge profile on each one
  lavaPits=L.lavaPits.map(p=>({...p}));
  crystals=L.crystals.map(c=>({...c}));
  // small dark ceiling spikes, all within the top ~25px
  stalactites=[];
  const stalCount=Math.round(levelWidth/55);
  const shades=["#0e0b14","#15111c","#1b1622","#211b29"];
  for(let s=0;s<stalCount;s++){
    stalactites.push({
      x:rnd(0,levelWidth), len:rnd(9,25), w:rnd(6,14),
      shade:shades[Math.floor(Math.random()*shades.length)]
    });
  }

  levelHasArena=!!L.arena;
  ARENA_X_START=L.arena?L.arena.start:0;
  ARENA_X_END=L.arena?L.arena.end:0;
  cameraLock=false;
  arenaCleared=!levelHasArena;   // no arena ⇒ counts as already cleared
  arenaBannerTimer=0; arenaGoTimer=0;

  levelHasBoss=!!L.boss;
  BOSS_TRIGGER_X=L.boss?L.boss.triggerX:Infinity;

  initCoins(); initEnemies(); initGroundEnemies(); initVines(); initFog(); initIcicles(); initWind();
  initPowerUpBoxes(); initWeaponPickups(); initCages(); initBoss();

  // clear anything left over from the previous stage
  drops=[]; particles=[]; floatingTexts=[]; magmaBursts=[];
  playerBombs=[]; babyDinos=[]; laser=null; shockwaves=[];
  goalReached=false;
  camX=0; camY=0;
  player.x=60; player.y=360; player.vx=0; player.vy=0;
  player.jetFuel=1;

  // story state — each stage re-arms its own transmissions and starts with an
  // empty rescue train (the previous stage's hatchlings boarded the capsule)
  radio=null; radioQueue=[]; radioFired={};
  followers=[]; playerTrail=[]; rescuedThisLevel=0;
  scaredBabies=[]; babyShots=[];
  bestChainThisLevel=0;
  hitsThisLevel=0; levelTime=0; parriesThisLevel=0;
  checkpointX=L.checkpoint!==undefined?L.checkpoint:Infinity;
  checkpointUsed=false;
  warpTimer=0;   // portalReveal is set by initBoss(), which ran just above
  recordPlayerTrail();
  queueRadio("start","KOMUTA MERKEZİ",
    ["DİKKAT: Volkan patlıyor!","Kafesleri kır ve rehineleri topla!"],
    {color:"#ff8844",urgent:true,hold:4.2});
}
