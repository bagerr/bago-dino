// ─── FOREST BACKDROP ─────────────────────────────────────────
function drawBiomeBG(){
  const TH=themeOf();
  const tint=TH.bgTint||["rgba(2,12,8,0.45)","4,24,14","6,40,24","2,20,12"];
  ctx.fillStyle=isIce()?"#061224":"#04140c"; ctx.fillRect(0,0,W,H);
  const bgArt=artFor(TH.bg);
  const forestBgLoaded=!!(bgArt&&bgArt.loaded);
  const forestBgSprite=bgArt?bgArt.img:null;
  if(forestBgLoaded){
    const iw=forestBgSprite.naturalWidth, ih=forestBgSprite.naturalHeight;
    const dw=Math.max(1,iw*(H/ih));           // cover the canvas height
    // slow scroll — the backdrop drifts at a fifth of the level's speed
    const off=((-camX*0.2)%dw+dw)%dw;
    for(let i=-1;i*dw-off<W;i++){
      const dx=i*dw-off;
      ctx.save();
      // mirror every other copy so the corridor meets itself cleanly
      if(((i%2)+2)%2===1){ ctx.translate(dx+dw,0); ctx.scale(-1,1); }
      else ctx.translate(dx,0);
      ctx.drawImage(forestBgSprite,0,0,iw,ih,0,0,dw,H);
      ctx.restore();
    }
  }
  // depth: darken the whole plate, then a haze that thickens downward
  ctx.fillStyle=tint[0];
  ctx.fillRect(0,0,W,H);
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,`rgba(${tint[1]},0.55)`);
  g.addColorStop(0.45,`rgba(${tint[2]},0.18)`);
  g.addColorStop(1,`rgba(${tint[3]},0.65)`);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  if(TH.snow){
    // snowfall: slow, heavy flakes that drift sideways as they settle
    if(Math.random()<0.55) particles.push({
      x:rnd(-20,W+20), y:-8,
      vx:rnd(-16,10), vy:rnd(18,46),
      life:1, maxLife:rnd(2.4,4.4),
      color:Math.random()<0.6?"rgba(255,255,255,0.85)":"rgba(200,235,255,0.7)",
      size:rnd(1,3), type:"square", gravity:6
    });
  } else {
    // spore motes drifting through the canopy light
    if(Math.random()<0.25) particles.push({
      x:rnd(0,W), y:rnd(40,H-120),
      vx:rnd(-12,12), vy:-rnd(4,16),
      life:1, maxLife:rnd(1.6,3.2),
      color:Math.random()<0.5?"rgba(110,231,183,0.55)":"rgba(52,211,153,0.4)",
      size:rnd(1,3), type:"circle", gravity:-3
    });
  }
}

// ─── PARALLAX BG ─────────────────────────────────────────────
// Stars
const stars=[];
for(let i=0;i<80;i++) stars.push({x:rnd(0,1200),y:rnd(0,200),r:rnd(.5,2),twinkle:rnd(0,Math.PI*2)});

// ─── DRAW HELPERS ────────────────────────────────────────────
function glow(color, blur){
  ctx.shadowColor = color; ctx.shadowBlur = blur;
}
function noGlow(){ ctx.shadowBlur=0; }

// ─── DRAW BACKGROUND ─────────────────────────────────────────
function drawBG(){
  if(themeOf().bg){ drawBiomeBG(); return; }
  // deep cave gradient
  const bg = ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,"#0a0618");
  bg.addColorStop(0.45,"#12083a");
  bg.addColorStop(1,"#1a0808");
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);

  // far: stars
  for(const s of stars){
    const sx = ((s.x - camX*0.04)%W+W)%W;
    const a = 0.4+0.4*Math.sin(t*1.5+s.twinkle);
    ctx.globalAlpha=a; ctx.fillStyle="#b8d4ff";
    ctx.beginPath(); ctx.arc(sx,s.y,s.r,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;

  // parallax: distant dark volcano silhouette (layer 1 — very far) with crater glow
  const vx = ((-camX*0.08+600)%W+W)%W - 200;
  // crater light: a strong upward-rising beam + radial bloom, drawn BEHIND the silhouette
  const craterX=vx+130, craterY=180;
  const flick=0.75+0.25*Math.sin(t*3);
  const beamG=ctx.createLinearGradient(craterX,craterY-120,craterX,craterY+10);
  beamG.addColorStop(0,"rgba(255,120,0,0)");
  beamG.addColorStop(1,`rgba(255,90,0,${0.35*flick})`);
  ctx.fillStyle=beamG;
  ctx.beginPath();
  ctx.moveTo(craterX-46,craterY+6);
  ctx.lineTo(craterX-10,craterY-120);
  ctx.lineTo(craterX+10,craterY-120);
  ctx.lineTo(craterX+46,craterY+6);
  ctx.closePath(); ctx.fill();
  const bloomG=ctx.createRadialGradient(craterX,craterY,2,craterX,craterY,50);
  bloomG.addColorStop(0,`rgba(255,180,60,${0.9*flick})`);
  bloomG.addColorStop(0.4,`rgba(255,90,0,${0.5*flick})`);
  bloomG.addColorStop(1,"rgba(255,60,0,0)");
  ctx.fillStyle=bloomG;
  ctx.beginPath(); ctx.arc(craterX,craterY,50,0,Math.PI*2); ctx.fill();

  // volcano cone silhouette — drawn on top of the glow so the crater notch
  // shows light, and kept translucent so the whole backdrop stays airy
  ctx.globalAlpha=0.35;
  ctx.fillStyle="#150822";
  ctx.beginPath();
  ctx.moveTo(vx,H); ctx.lineTo(vx+80,250); ctx.lineTo(vx+120,190);
  ctx.lineTo(vx+130,204); ctx.lineTo(vx+140,190);
  ctx.lineTo(vx+180,250); ctx.lineTo(vx+260,H); ctx.closePath(); ctx.fill();
  ctx.globalAlpha=1;
  // bright molten crater core
  glow("#ff4400",18);
  ctx.fillStyle=`rgba(255,140,40,${0.85*flick})`;
  ctx.beginPath(); ctx.arc(craterX,craterY+2,7,0,Math.PI*2); ctx.fill();
  noGlow();

  // the volcano gently smokes — faint gray plumes drifting up from the crater
  if(Math.random()<0.12) spawnParticles(
    craterX+rnd(-6,6), craterY-6, 1,
    ["rgba(90,80,100,0.4)","rgba(70,65,85,0.35)"],
    {minSpd:6,maxSpd:16,upBias:26,minLife:1.5,maxLife:3,type:"circle",gravity:-6,minSz:4,maxSz:9}
  );

  // parallax: mountain silhouettes (layer 2), softened so they sit well back
  ctx.globalAlpha=0.35;
  const mx = ((-camX*0.14)%W+W)%W;
  ctx.fillStyle="#150a28";
  for(let i=-1;i<3;i++){
    const bx=mx+i*420;
    ctx.beginPath();
    ctx.moveTo(bx,H); ctx.lineTo(bx+60,310); ctx.lineTo(bx+110,260);
    ctx.lineTo(bx+160,330); ctx.lineTo(bx+260,H); ctx.closePath(); ctx.fill();
  }
  ctx.globalAlpha=1;

  // (the near-foreground obsidian outcrop layer that used to scroll at 0.92x
  // is gone. Scrolling almost in step with the platforms, it read as a dark
  // column hanging underneath every floating ledge rather than as background
  // depth — the ledges float in clean air now.)

  // cave ceiling rock edge
  ctx.fillStyle="#0d0820";
  ctx.beginPath();
  ctx.moveTo(0,0);
  const cPoints=[0,55,100,40,180,65,260,38,340,72,420,35,500,58,580,42,660,68,740,30,820,60,900,45];
  for(let i=0;i<cPoints.length;i+=2) ctx.lineTo(cPoints[i],cPoints[i+1]);
  ctx.lineTo(W,0); ctx.closePath(); ctx.fill();
}

// ─── FOREST BIOME ART ─────────────────────────────────────────
// forest_bg.png is a portrait corridor, so it is scaled to the canvas height
// and mirror-tiled sideways — the corridor is roughly symmetric, so flipped
// copies meet without a seam. It scrolls slower than the level for parallax.
// (the backdrop and the platform sheet are pulled from the shared sprite
// registry now, so a new biome is a THEMES entry rather than two more
// globals and another draw function)

// forest_ground.png is ONE mossy block, not a tileable strip. Three bands of
// it are used: the grass tufts that poke ABOVE the walk line, the body, and
// the vines that hang below into open air. Row 426 is where the art becomes
// a solid slab, and that row is drawn exactly at p.y — the same line the
// collision resolver stands the player on.

// Every block-sheet biome names its own bands in THEMES[x].cap. The rule is
// the same one ground.png follows: the row where the art first goes solid is
// blitted exactly at p.y, the collision line. Decoration rises above it and
// whatever hangs off the sheet hangs below a floating ledge.
const FG_X=150, FG_W=540;        // the block's clean middle, no ragged edges
const FG_TUFT_Y=348, FG_TOP=426; // tufts above the surface line / the surface
const FG_BODY_END=1065, FG_VINE_Y=1074, FG_VINE_END=1170;

// Bands are scaled independently: horizontally by a fixed tile width,
// vertically by the platform. Moss is noise and takes non-uniform scaling
// without complaint, which is what lets one block art serve every ledge.
function drawForestCap(px,worldX,y,w,capH,isFloat,bodyBottom){
  const c=capSpec();
  if(!c) return false;
  const a=artFor(c.art);
  if(!a||!a.loaded) return false;
  const img=a.img;
  const TW=c.tile, tuftH=c.tuftPx, hangH=c.hangPx;
  ctx.save();
  ctx.beginPath(); ctx.rect(px,y-tuftH,w,(bodyBottom-y)+hangH+tuftH); ctx.clip();
  const i0=Math.floor(worldX/TW), i1=Math.ceil((worldX+w)/TW);
  for(let i=i0;i<i1;i++){
    const tx=px+(i*TW-worldX);
    ctx.save();
    if(i%2!==0){ ctx.translate(tx+TW,0); ctx.scale(-1,1); }
    else ctx.translate(tx,0);
    // the decorative fringe, rising above the walk line
    ctx.drawImage(img,c.x,c.tuftY,c.w,c.top-c.tuftY, 0,y-tuftH,TW,tuftH);
    // the solid body
    ctx.drawImage(img,c.x,c.top,c.w,c.bodyEnd-c.top, 0,y,TW,bodyBottom-y);
    // whatever hangs off it, only where there is open air below
    if(isFloat){
      ctx.drawImage(img,c.x,c.hangY,c.w,c.hangEnd-c.hangY, 0,bodyBottom,TW,hangH);
    }
    ctx.restore();
  }
  ctx.restore();
  return true;
}

// ─── GROUND SURFACE TILE (ground.png) ─────────────────────────
// The walking surface of every solid platform, and of the cave floor, is one
// horizontal strip of ground.png mirror-tiled along the top.
//
// The source band starts at row 424 of the 1024px sheet, which is the first
// row where the art becomes fully opaque — so the strip has a clean,
// continuous top edge rather than the sheet's ragged spires. That edge is
// drawn at exactly p.y, which is the same y the collision resolver stands
// the player on, so the dino's feet land on the texture instead of hovering
// a few pixels above it.
//
// (The old left-edge lava_wall.png seam and the two procedural "lava falls"
// that used to hang off the walls are gone — they read as flat orange bars
// pasted over the scene. lava_wall.png and lava_ceiling.png are no longer
// loaded by this build at all; index.html still uses lava_wall.png.)
const groundSprite=new Image();
let groundLoaded=false;
groundSprite.onload=()=>{ groundLoaded=true; };
groundSprite.src=assetURL("ground.png");
const GROUND_SRC_Y=424, GROUND_SRC_W=1024, GROUND_SRC_H=100;

// px is the SCREEN x of the platform's left edge, worldX the same edge in
// world space. The tile phase is anchored to WORLD space so the texture stays
// nailed to the rock instead of swimming as the camera scrolls.
function drawGroundCap(px,worldX,y,w,capH){
  const tileW=GROUND_SRC_W*(capH/GROUND_SRC_H);
  ctx.save();
  ctx.beginPath(); ctx.rect(px,y,w,capH); ctx.clip();
  // every other tile is mirrored: two flipped copies share an identical edge,
  // so the strip repeats with no visible seam even though the source art is
  // not tileable
  const i0=Math.floor(worldX/tileW), i1=Math.ceil((worldX+w)/tileW);
  for(let i=i0;i<i1;i++){
    const tx=px+(i*tileW-worldX);
    if(i%2===0){
      ctx.drawImage(groundSprite,0,GROUND_SRC_Y,GROUND_SRC_W,GROUND_SRC_H,tx,y,tileW,capH);
    } else {
      ctx.save();
      ctx.translate(tx+tileW,y); ctx.scale(-1,1);
      ctx.drawImage(groundSprite,0,GROUND_SRC_Y,GROUND_SRC_W,GROUND_SRC_H,0,0,tileW,capH);
      ctx.restore();
    }
  }
  ctx.restore();
}

// ─── DRAW STALACTITES ────────────────────────────────────────
// Plain dark rock spikes along the very top edge (y 0..~25), drawn with paths
// rather than art. No lava, no glow — the ceiling stays simple and dark.
const HUD_CLEAR_X = W-286;   // nothing decorative is drawn right of this, so
                             // the neon CHAIN/SCORE panel sits on clean sky
function drawStalactites(){
  if(isForest()) return;   // no cave ceiling out under the canopy
  for(const s of stalactites){
    const sx = s.x - camX*0.96;
    if(sx<-40||sx>W+40) continue;
    if(sx>HUD_CLEAR_X) continue;   // keep the HUD panel's backdrop clear
    ctx.fillStyle=s.shade;
    ctx.beginPath();
    ctx.moveTo(sx-s.w/2,0);
    ctx.lineTo(sx+s.w/2,0);
    ctx.lineTo(sx,s.len);
    ctx.closePath();
    ctx.fill();
  }
}

// ─── DRAW PLATFORMS ──────────────────────────────────────────
function drawPlatforms(){
  for(const p of platforms){
    if(p.lavaPit) continue;
    let px = p.x - camX;
    if(px+p.w<0||px>W) continue;
    if(p.gone) continue;              // dropped away, nothing to draw
    if(p.crumble && p.crumbleT!==undefined){
      // the tell: it rattles harder the closer it is to letting go
      const urg=1-clamp(p.crumbleT/CRUMBLE_DELAY,0,1);
      px+=Math.sin(t*(28+urg*40))*(1+urg*2.5);
    }

    if(p.goal){
      const gx=px+p.w/2, gateW=100, gateH=140, gy=p.y;

      // The exit ledge is just a ledge: same dark body and same ground.png
      // surface as every other platform. It used to be a flat grey slab with
      // a lighter grey cap, which showed through the transparent rift sprite
      // as a panel sitting behind it.
      const capH=clamp(p.h*0.55,22,44);
      const gb=ctx.createLinearGradient(0,p.y,0,p.y+p.h);
      gb.addColorStop(0,"#241f2c");
      gb.addColorStop(0.45,"#16121c");
      gb.addColorStop(1,"#080609");
      ctx.fillStyle=gb; ctx.fillRect(px,p.y,p.w,p.h);
      if(groundLoaded) drawGroundCap(px,p.x,p.y,p.w,capH);

      // The procedural obsidian arch is a STAND-IN, not scenery: it marks the
      // exit while the gate is still sealed, and it covers for portal.png if
      // that sprite never loads. Once the real rift is on screen it must not
      // be drawn at all — portal.png has transparent gaps, so the arch showed
      // through the swirl as a door silhouette behind it.
      const showArch = !(gateOpen && portalArtNow());
      if(showArch){
        const portalColor= gateOpen ? "#00ff88" : "#442244";
        glow(portalColor, gateOpen?26:8);
        ctx.fillStyle="#2a2030";
        ctx.beginPath();
        ctx.moveTo(gx-gateW/2,gy); ctx.lineTo(gx-gateW/2,gy-gateH+30);
        ctx.quadraticCurveTo(gx-gateW/2,gy-gateH,gx,gy-gateH);
        ctx.quadraticCurveTo(gx+gateW/2,gy-gateH,gx+gateW/2,gy-gateH+30);
        ctx.lineTo(gx+gateW/2,gy);
        ctx.closePath(); ctx.fill();
        // inner portal glow (bright open / dim closed)
        ctx.fillStyle= gateOpen ? "rgba(0,255,150,0.55)" : "rgba(60,20,60,0.5)";
        ctx.beginPath();
        ctx.moveTo(gx-gateW/2+14,gy-6); ctx.lineTo(gx-gateW/2+14,gy-gateH+38);
        ctx.quadraticCurveTo(gx-gateW/2+14,gy-gateH+14,gx,gy-gateH+14);
        ctx.quadraticCurveTo(gx+gateW/2-14,gy-gateH+14,gx+gateW/2-14,gy-gateH+38);
        ctx.lineTo(gx+gateW/2-14,gy-6);
        ctx.closePath(); ctx.fill();
        noGlow();

        // obsidian shards flanking the arch — the capsule's outer shell
        ctx.fillStyle="#17131d";
        for(let s=-1;s<=1;s+=2){
          ctx.beginPath();
          ctx.moveTo(gx+s*(gateW/2+2),gy);
          ctx.lineTo(gx+s*(gateW/2+16),gy-44);
          ctx.lineTo(gx+s*(gateW/2-2),gy-96);
          ctx.closePath(); ctx.fill();
        }

        if(gateOpen){
          // rune rings, so the fallback still reads as an open rift
          const rcx=gx, rcy=gy-gateH*0.55;
          ctx.save();
          ctx.translate(rcx,rcy); ctx.rotate(t*0.6);
          glow("#00ffaa",14);
          ctx.strokeStyle="rgba(130,255,205,0.75)"; ctx.lineWidth=2;
          ctx.beginPath(); ctx.arc(0,0,30,0,Math.PI*1.5); ctx.stroke();
          ctx.beginPath(); ctx.arc(0,0,20,Math.PI*0.4,Math.PI*1.9); ctx.stroke();
          ctx.fillStyle="#aaffdd";
          for(let r=0;r<6;r++){
            const a=r/6*Math.PI*2;
            ctx.fillRect(Math.cos(a)*36-2,Math.sin(a)*36-2,4,4);
          }
          noGlow();
          ctx.restore();
        }
      }

      // the rift itself. (Its inward energy motes are spawned by update(),
      // which is why there is no mote emitter left in this draw pass.)
      drawEvacPortal(gx,gy);

      // sign board + live rescue tally, readable from across the stage.
      // The labels sit above whichever of the two is taller.
      const signY=(gateOpen&&portalArtNow())?gy-PORTAL_H-30:gy-gateH-8;
      ctx.textAlign="center";
      ctx.font="bold 10px 'Courier New',monospace";
      ctx.fillStyle="#ffdd66";
      ctx.fillText("YAVRU "+rescuedThisLevel+"/"+LEVELS[levelIndex].cages.length,gx,signY-16);
      ctx.font="bold 11px 'Courier New',monospace";
      ctx.fillStyle=gateOpen?"#8effc9":"#aa88bb";
      ctx.fillText(gateOpen?"TAHLİYE PORTALI":"MÜHÜRLÜ — ALFA'YI YOK ET",gx,signY);
      if(!gateOpen){
        // only ever shown over the arch, which is always up while sealed
        ctx.fillStyle="#aa88bb"; ctx.font="10px 'Courier New',monospace";
        ctx.fillText("SEALED",gx,gy-gateH/2);
      }
      ctx.textAlign="left";
    } else if(p.curtain){
      // a hanging curtain of thorned vines — a wall until it is burned
      const burn=p.burnT===undefined?1:clamp(p.burnT,0,1);
      ctx.save();
      ctx.globalAlpha=0.35+0.65*burn;
      for(let i=0;i<5;i++){
        const vx2=px+4+i*((p.w-8)/4);
        ctx.strokeStyle=i%2?"#2f6b3d":"#3f8a4c";
        ctx.lineWidth=5;
        ctx.beginPath();
        ctx.moveTo(vx2,p.y);
        for(let yy=0;yy<=p.h;yy+=14){
          ctx.lineTo(vx2+Math.sin(t*1.4+yy*0.05+i)*3,p.y+yy);
        }
        ctx.stroke();
      }
      ctx.fillStyle="#4ade80";
      for(let i=0;i<6;i++){
        const ly=p.y+((i*p.h/6)+((t*10)%(p.h/6)));
        ctx.beginPath(); ctx.ellipse(px+p.w/2+Math.sin(t+i)*6,ly,6,3,0.6,0,Math.PI*2); ctx.fill();
      }
      if(burn<1){
        // embers creeping up it while it burns
        glow("#ffaa22",14);
        ctx.strokeStyle="#ffaa22"; ctx.lineWidth=3;
        ctx.beginPath();
        ctx.moveTo(px,p.y+p.h*burn); ctx.lineTo(px+p.w,p.y+p.h*burn);
        ctx.stroke();
        noGlow();
      }
      ctx.restore();
    } else {
      // obsidian rock platform: a dark body with the ground.png surface laid
      // along its top. Identical treatment for the cave floor and the
      // floating ledges, so everything the player can stand on looks the same.
      const isFloat = p.y < GROUND_Y;
      const capH = clamp(p.h*0.55,22,44);
      const g=ctx.createLinearGradient(0,p.y,0,p.y+p.h);
      if(isIce()){
        g.addColorStop(0, isFloat?"#2b5f86":"#1e4a6b");
        g.addColorStop(0.45,"#123045");
        g.addColorStop(1, "#071825");
      } else if(isForest()){
        g.addColorStop(0, isFloat?"#1e3a2a":"#16301f");
        g.addColorStop(0.45,"#0f2318");
        g.addColorStop(1, "#06120c");
      } else {
        g.addColorStop(0, isFloat?"#241f2c":"#1c1822");
        g.addColorStop(0.45,isFloat?"#16121c":"#110e16");
        g.addColorStop(1, "#080609");
      }
      ctx.fillStyle=g;
      ctx.fillRect(px,p.y,p.w,p.h);

      // a biome with its own block sheet paints from that; the volcano keeps
      // the mirror-tiled ground.png strip
      const capped = capSpec() &&
        drawForestCap(px,p.x,p.y,p.w,capH,isFloat,isFloat?p.y+capH:p.y+p.h);
      if(capped){
        /* painted from the biome sheet */
      } else if(groundLoaded){
        // the texture's own top edge IS the collision line at p.y
        drawGroundCap(px,p.x,p.y,p.w,capH);
      } else {
        // fallback until (or unless) ground.png arrives — the original
        // procedural rim, so a platform is never an unmarked slab
        if(!p._edge || p._edgeW!==p.w){
          p._edgeW=p.w;
          p._edge=[];
          for(let ex=0; ex<=p.w; ex+=6) p._edge.push(rnd(0,4));
        }
        ctx.fillStyle= isFloat?"#4a4452":"#352f3c";
        ctx.beginPath();
        ctx.moveTo(px,p.y);
        for(let k=0;k<p._edge.length;k++) ctx.lineTo(px+k*6, p.y-p._edge[k]);
        ctx.lineTo(px+p.w,p.y);
        ctx.closePath(); ctx.fill();
      }
    }
  }
}

// ─── CHECKPOINT BEACON ───────────────────────────────────────
// A pylon standing on the ground line at the stage's checkpoint: dim and
// grey before it is passed, a lit neon column afterwards.
function drawCheckpoint(){
  if(!isFinite(checkpointX)) return;
  const cx=checkpointX-camX;
  if(cx<-60||cx>W+60) return;
  const baseY=GROUND_Y;
  const lit=checkpointUsed;
  const col=lit?"#7dffcf":"#4a4452";
  // post
  ctx.fillStyle="#1a1620";
  ctx.fillRect(cx-4,baseY-64,8,64);
  ctx.fillStyle=col;
  ctx.fillRect(cx-3,baseY-62,6,60);
  // lamp
  glow(col,lit?18:6);
  ctx.fillStyle=lit?"#aaffdd":"#5a5462";
  ctx.beginPath(); ctx.arc(cx,baseY-70,7,0,Math.PI*2); ctx.fill();
  noGlow();
  if(lit){
    // a soft column of light and a slow rising mote or two
    ctx.save();
    ctx.globalCompositeOperation="lighter";
    const lg=ctx.createLinearGradient(0,baseY-150,0,baseY);
    lg.addColorStop(0,"rgba(125,255,207,0)");
    lg.addColorStop(1,`rgba(125,255,207,${0.16+0.05*Math.sin(t*3)})`);
    ctx.fillStyle=lg;
    ctx.fillRect(cx-16,baseY-150,32,150);
    ctx.restore();
    if(Math.random()<0.25) particles.push({
      x:cx+rnd(-10,10), y:baseY-rnd(0,20),
      vx:rnd(-8,8), vy:-rnd(20,55),
      life:1, maxLife:rnd(0.6,1.2),
      color:"#7dffcf", size:rnd(1,3), type:"square", gravity:0
    });
  }
  ctx.textAlign="center";
  ctx.font="bold 9px 'Courier New',monospace";
  ctx.fillStyle=lit?"#7dffcf":"#6a6478";
  ctx.fillText(lit?"KAYDEDİLDİ":"KONTROL",cx,baseY-82);
  ctx.textAlign="left";
}

// ─── DRAW THE EVACUATION PORTAL ──────────────────────────────
// Takes SCREEN coordinates (gx = platform centre - camX, gy = platform top);
// the caller has already converted, so no camX in here.
// Resolves which rift art this biome uses: its own sheet if it names one and
// that sheet has arrived, otherwise the default vortex. Returns null when
// nothing has loaded, and the procedural arch keeps the screen honest.
function portalArtNow(){
  const TH=themeOf();
  if(TH.portalArt){
    const a=artFor(TH.portalArt);
    if(a&&a.loaded){
      const bb=a.bbox||{x:0,y:0,w:a.img.naturalWidth,h:a.img.naturalHeight};
      return {img:a.img, bb, spin:!!TH.portalSpin, theme:TH};
    }
    return null;   // a biome that names its own art does NOT fall back to the
                   // volcano vortex — a stone gate and a free vortex are not
                   // interchangeable, so show the arch until the sheet lands
  }
  if(!portalLoaded) return null;
  return {img:portalSprite, bb:portalBBox, spin:true, theme:TH};
}
function drawEvacPortal(gx,gy){
  if(!gateOpen||portalReveal<=0) return;
  const art=portalArtNow();
  if(!art) return;
  const rev=clamp(portalReveal,0,1);
  const bb=art.bb;
  const bloom=art.theme.portalBloom||["130,225,255","95,60,225"];
  // slow pulse on top of the materialise scale — the rift breathes
  const pulse=1+0.05*Math.sin(t*2.2);
  const h=PORTAL_H*pulse*(0.25+0.75*rev);
  const w=bb.w*(h/bb.h);
  const cy=gy+6-PORTAL_H/2;

  ctx.save();
  ctx.translate(gx,cy);
  // a free-floating vortex spins; a built gate stands still and only breathes
  if(art.spin) ctx.rotate(t*0.5);

  // additive neon bloom behind the rift
  ctx.save();
  ctx.globalCompositeOperation="lighter";
  const bg=ctx.createRadialGradient(0,0,h*0.10,0,0,h*0.80);
  bg.addColorStop(0,`rgba(${bloom[0]},${0.42*rev})`);
  bg.addColorStop(0.45,`rgba(${bloom[1]},${0.22*rev})`);
  bg.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle=bg;
  ctx.beginPath(); ctx.arc(0,0,h*0.80,0,Math.PI*2); ctx.fill();
  // a blown-up ghost of the sprite so the bloom carries the rift's shape
  ctx.globalAlpha=0.30*rev;
  ctx.drawImage(art.img,bb.x,bb.y,bb.w,bb.h,-w*0.62,-h*0.62,w*1.24,h*1.24);
  ctx.restore();

  // the rift proper
  ctx.globalAlpha=rev;
  ctx.drawImage(art.img,bb.x,bb.y,bb.w,bb.h,-w/2,-h/2,w,h);
  ctx.restore();
}

// ─── DRAW LAVA ───────────────────────────────────────────────
function drawLava(){
  // strong upward-cast light bathing the walls/ceiling above the lava floor —
  // additive blending so it actually brightens the rock behind it (bloom)
  // rather than just laying flat translucent orange over it
  const TH=themeOf();
  ctx.globalCompositeOperation="lighter";
  ctx.shadowColor=TH.glow; ctx.shadowBlur=20;
  const upG=ctx.createLinearGradient(0,LAVA_Y-140,0,LAVA_Y);
  upG.addColorStop(0,`rgba(${TH.haze},0)`);
  upG.addColorStop(1,`rgba(${TH.haze},${0.22+0.06*Math.sin(t*2)})`);
  ctx.fillStyle=upG;
  ctx.fillRect(0,LAVA_Y-140,W,140);
  ctx.shadowBlur=0;
  ctx.globalCompositeOperation="source-over";

  // lava floor fill
  const lavaGrad = ctx.createLinearGradient(0,LAVA_Y,0,H);
  lavaGrad.addColorStop(0,TH.liquid[0]);
  lavaGrad.addColorStop(0.3,TH.liquid[1]);
  lavaGrad.addColorStop(1,TH.liquid[2]);
  ctx.fillStyle=lavaGrad;
  ctx.fillRect(0,LAVA_Y,W,H-LAVA_Y);

  // animated lava surface ripple
  glow(TH.glow,20);
  ctx.strokeStyle=TH.surface; ctx.lineWidth=2;
  ctx.beginPath();
  for(let i=0;i<=W;i+=12){
    const worldX = (camX+i)/20;
    const h2 = 5*Math.sin(t*2+worldX)+3*Math.sin(t*3.1+worldX*1.7);
    i===0 ? ctx.moveTo(i,LAVA_Y+h2) : ctx.lineTo(i,LAVA_Y+h2);
  }
  ctx.stroke(); noGlow();

  // rising ember/spark particles continuously drifting up off the whole lava
  // surface — denser during fever for extra atmosphere
  // volcano throws embers up; the swamp burps bubbles
  if(Math.random()<(feverMode?0.9:0.6)) spawnParticles(
    rnd(0,W), LAVA_Y+rnd(-2,4), 1, TH.spark,
    {minSpd:8,maxSpd:30,upBias:isForest()?40:70,minLife:0.6,maxLife:1.6,
     type:"circle",gravity:isForest()?-10:20,minSz:1,maxSz:isForest()?4:3}
  );

  // Lava pits (the gaps between platforms). The gap now simply shows the
  // molten floor dropping away below it, with a soft radial heat bloom
  // rising out of it. The old version stamped a translucent orange rectangle
  // from GROUND_Y-30 down — a hard-edged box floating ABOVE the walk line,
  // which read as a UI panel sitting on the level rather than as a hazard.
  for(const lp of lavaPits){
    const lpx = lp.x - camX;
    if(lpx+lp.w<0||lpx>W) continue;
    ctx.save();
    // molten fill falling away into the gap
    const pg=ctx.createLinearGradient(0,GROUND_Y,0,H);
    pg.addColorStop(0,TH.liquid[0]);
    pg.addColorStop(0.35,TH.liquid[1]);
    pg.addColorStop(1,TH.liquid[2]);
    ctx.fillStyle=pg;
    ctx.fillRect(lpx,GROUND_Y+2,lp.w,H-GROUND_Y);
    // rippling surface right at the lip, same wave maths as the main floor
    glow(TH.glow,14);
    ctx.strokeStyle=TH.surface; ctx.lineWidth=2;
    ctx.beginPath();
    for(let i=0;i<=lp.w;i+=8){
      const wx=(lp.x+i)/18;
      const hh=3*Math.sin(t*2.4+wx)+2*Math.sin(t*3.3+wx*1.6);
      i===0 ? ctx.moveTo(lpx+i,GROUND_Y+5+hh) : ctx.lineTo(lpx+i,GROUND_Y+5+hh);
    }
    ctx.stroke(); noGlow();
    if(TH.pitSpikes){
      // a cryo pit is not a pool you fall into, it is a mouth
      ctx.fillStyle="#cfeeff";
      for(let sx=lpx+8;sx<lpx+lp.w-4;sx+=17){
        ctx.beginPath();
        ctx.moveTo(sx-6,GROUND_Y+8); ctx.lineTo(sx+6,GROUND_Y+8);
        ctx.lineTo(sx,GROUND_Y-16-8*Math.abs(Math.sin(sx*0.7)));
        ctx.closePath(); ctx.fill();
      }
      ctx.fillStyle="rgba(120,200,240,0.55)";
      for(let sx=lpx+14;sx<lpx+lp.w-4;sx+=23){
        ctx.beginPath();
        ctx.moveTo(sx-5,H); ctx.lineTo(sx+5,H); ctx.lineTo(sx,GROUND_Y+26);
        ctx.closePath(); ctx.fill();
      }
    }
    // heat bloom — radial, so it fades out in every direction and the pit
    // never picks up a straight edge of its own
    ctx.globalCompositeOperation="lighter";
    const cxp=lpx+lp.w/2, r=lp.w*0.95;
    const haze=ctx.createRadialGradient(cxp,GROUND_Y+6,4,cxp,GROUND_Y+6,r);
    haze.addColorStop(0,`rgba(${TH.haze},${0.30+0.06*Math.sin(t*2)})`);
    haze.addColorStop(0.5,`rgba(${TH.haze},0.10)`);
    haze.addColorStop(1,`rgba(${TH.haze},0)`);
    ctx.fillStyle=haze;
    ctx.fillRect(cxp-r,GROUND_Y+6-r,r*2,r*2);
    ctx.restore();
    // sparks lifting out of the gap
    // acid bubbles rise and hang; embers spit and fall
    if(Math.random()<0.3) spawnParticles(
      lpx+rnd(0,lp.w), GROUND_Y+2, 1, TH.spark,
      {minSpd:20,maxSpd:isForest()?50:80,upBias:isForest()?40:60,
       minLife:0.2,maxLife:isForest()?1.0:0.6,
       type:isForest()?"circle":"square",gravity:isForest()?-25:-50,
       minSz:1,maxSz:isForest()?4:3}
    );
  }
  // (the two procedural "lava falls" that used to hang at world x=0 and
  // x=1100 are gone: both were plain fillRect bars pinned to fixed world
  // coordinates, so they floated in mid-air with nothing behind them.)
}

// ─── DRAW CRYSTALS ───────────────────────────────────────────
function drawCrystals(){
  const colors=[["#a050ff","#d4aaff"],["#4488ff","#aaccff"],["#44ffaa","#aaffdd"]];
  crystals.forEach((cr,i)=>{
    const cx=cr.x-camX, cy=cr.y;
    const c=colors[i%colors.length];
    glow(c[0],16);
    ctx.fillStyle=c[0];
    ctx.beginPath();
    ctx.moveTo(cx,cy-28);ctx.lineTo(cx+10,cy);ctx.lineTo(cx+7,cy+16);
    ctx.lineTo(cx-7,cy+16);ctx.lineTo(cx-10,cy);ctx.closePath();ctx.fill();
    ctx.fillStyle=c[1];
    ctx.beginPath();
    ctx.moveTo(cx,cy-28);ctx.lineTo(cx+4,cy-10);ctx.lineTo(cx-4,cy-10);ctx.closePath();ctx.fill();
    noGlow();
  });
}

// ─── DRAW COINS ──────────────────────────────────────────────
function drawCoins(){
  for(const coin of coins){
    if(coin.collected) continue;
    const cx=coin.x-camX, cy=coin.popping?coin.y:coin.y+Math.sin(coin.bob)*4;
    if(coin.popping) ctx.globalAlpha=Math.max(0,1-coin.popT/0.35);
    glow("#ffdd00",14);
    // outer ring
    ctx.strokeStyle="#ffaa00"; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(cx,cy,coin.r,0,Math.PI*2); ctx.stroke();
    // inner fill
    ctx.fillStyle="#ffdd00";
    ctx.beginPath(); ctx.arc(cx,cy,coin.r-2,0,Math.PI*2); ctx.fill();
    // shine
    ctx.fillStyle="rgba(255,255,200,0.7)";
    ctx.beginPath(); ctx.arc(cx-3,cy-3,3,0,Math.PI*2); ctx.fill();
    noGlow();
    ctx.globalAlpha=1;
  }
}

// shared: one full-bright white/yellow flash frame before a kill actually resolves
function drawDeathFlash(w,h){
  ctx.shadowColor="#fff9c4"; ctx.shadowBlur=16;
  ctx.fillStyle="#fffde7";
  ctx.fillRect(-w/2,-h/2,w,h);
}

// ─── DRAW FLYING ENEMY (enemy1.png, 56×38) ────────────────────
function drawFrozenShell(e){
  const cx=e.x+e.w/2-camX, cy=e.y+e.h/2;
  const fade=clamp(e.frozen/1.2,0,1);     // flickers as it is about to thaw
  if(fade<1 && Math.sin(t*22)<-0.2) return;
  ctx.save();
  ctx.globalCompositeOperation="lighter";
  ctx.globalAlpha=0.42;
  ctx.fillStyle="#7dd3fc";
  ctx.fillRect(cx-e.w/2-3,cy-e.h/2-3,e.w+6,e.h+6);
  ctx.restore();
  glow("#bae6fd",10);
  ctx.strokeStyle="rgba(223,246,255,0.95)"; ctx.lineWidth=2;
  ctx.strokeRect(cx-e.w/2-3,cy-e.h/2-3,e.w+6,e.h+6);
  // a couple of fracture lines so it reads as ice rather than a tint
  ctx.beginPath();
  ctx.moveTo(cx-e.w/2,cy-e.h/4); ctx.lineTo(cx,cy+e.h/6); ctx.lineTo(cx+e.w/3,cy-e.h/3);
  ctx.stroke();
  noGlow();
}
function drawPtero(e){
  if(e.frozen>0){ drawFrozenShell(e); }
  if(e.species){
    // the dragonfly: registry art, mirrored to its heading, with a green
    // shimmer under it so it reads against the dark canopy
    const cx=e.x+e.w/2-camX, cy=e.y+e.h/2;
    if(e.hitFlash>0) ctx.globalAlpha=0.55+0.45*Math.sin(e.hitFlash*30);
    glow("#34d399",10);
    const ok=drawSpeciesArt(e.species,cx,cy,e.w,e.h,Math.sign(e.vx)||1);
    noGlow();
    ctx.globalAlpha=1;
    if(ok) return;
    // fallback silhouette until (or unless) the sheet arrives
    ctx.fillStyle="#34d399";
    ctx.fillRect(cx-e.w/2,cy-e.h/2,e.w,e.h);
    return;
  }
  const ex=e.x-camX, ey=e.y;
  ctx.save(); ctx.translate(ex,ey); ctx.scale(e.vx<0?1:-1,1);

  if(e.dying){
    drawDeathFlash(e.w,e.h);
    ctx.restore();
    return;
  }

  if(e.hitFlash>0){
    ctx.globalAlpha=0.5+0.5*Math.sin(e.hitFlash*30);
  }

  // wing-flap squish: no new art needed — just squash/stretch the sprite's
  // vertical scale in a fast sine cycle so it reads as flapping wings
  const flapSquish=1+0.3*Math.sin(Date.now()/80+e.id);
  ctx.save();
  ctx.scale(1,flapSquish);
  if(enemy1Loaded){
    ctx.drawImage(enemy1Sprite,-e.w/2,-e.h/2,e.w,e.h);
  } else {
    ctx.fillStyle="#ff0000";
    ctx.fillRect(-e.w/2,-e.h/2,e.w,e.h);
  }
  ctx.restore();

  // pulsing neon eye glow overlaid near the sprite's face (front-facing side)
  const eyePulse=0.5+0.5*Math.sin(e.glowPhase*3);
  ctx.shadowColor="#eab308"; ctx.shadowBlur=6+8*eyePulse;
  ctx.fillStyle=`rgba(253,224,71,${0.55+0.45*eyePulse})`;
  ctx.beginPath(); ctx.arc(e.w*0.22,-e.h*0.12,2.5,0,Math.PI*2); ctx.fill();
  noGlow();

  // HP bar
  if(e.hp < e.maxHp){
    const hbW=e.w*0.7;
    ctx.fillStyle="rgba(0,0,0,0.6)"; ctx.fillRect(-hbW/2,-e.h/2-14,hbW,6);
    ctx.fillStyle="#ff3322"; ctx.fillRect(-hbW/2,-e.h/2-14,(e.hp/e.maxHp)*hbW,6);
  }

  ctx.restore();
}

// ─── DRAW GROUND ENEMY (enemyground.png, 40×40) ───────────────
function drawGroundEnemy(e){
  if(e.frozen>0){ drawFrozenShell(e); }
  if(e.species){
    const cx=e.x+e.w/2-camX, cy=e.y+e.h/2;
    if(e.hitFlash>0) ctx.globalAlpha=0.55+0.45*Math.sin(e.hitFlash*30);
    glow(e.shield?(isIce()?"#7dd3fc":"#10b981"):"#a855f7",e.shield?12:10);
    const ok=drawSpeciesArt(e.species,cx,cy,e.w,e.h,e.faceDir||1);

      // visible rather than something the player has to infer from damage
      const blocking=laser&&player.facing!==(Math.sign(e.vx)||e.faceDir||1);
      ctx.save();
      ctx.globalCompositeOperation="lighter";
      ctx.globalAlpha=(blocking?0.5:0.22)+0.18*Math.sin(t*(blocking?18:4));
      ctx.fillStyle=isIce()?"#7dd3fc":"#10b981";
      ctx.fillRect(cx-e.w/2,cy-e.h/2,e.w,e.h*0.45);
      ctx.restore();
    }
    if(ok) return;
    ctx.fillStyle=e.shield?"#10b981":"#a855f7";
    ctx.fillRect(cx-e.w/2,cy-e.h/2,e.w,e.h);

  }
  const ex=e.x-camX+e.w/2, ey=e.y+e.h/2;

  if(e.dying){
    drawDeathFlash(e.w,e.h);

  }

  }

    const hbW=e.w*0.8;
    ctx.fillStyle="rgba(0,0,0,0.6)"; ctx.fillRect(-hbW/2,-e.h/2-12,hbW,5);
    ctx.fillStyle="#ff3322"; ctx.fillRect(-hbW/2,-e.h/2-12,(e.hp/e.maxHp)*hbW,5);
  }

  ctx.restore();
}

// ─── SPRITE AUTO-CROP ──────────────────────────────────────────
// PNG art from generators often ships with a lot of transparent margin (and
// sometimes a baked-in ground shadow/smoke puff) around the actual character.
// Scaling the WHOLE image — margin included — into a fixed on-screen box
// shrinks the visible art inside that box and throws off exactly where the
// feet land, which reads as the sprite "floating" instead of standing on the
// scene. Computing the tight opaque bounding box once (on load) and using it
// as the drawImage SOURCE rect fixes that without touching the PNG file.
function computeSpriteBBox(img, excludeGroundSmoke){
  const oc=document.createElement("canvas");
  oc.width=img.naturalWidth; oc.height=img.naturalHeight;
  const octx=oc.getContext("2d");
  octx.drawImage(img,0,0);
  let data;
  try{ data=octx.getImageData(0,0,oc.width,oc.height).data; }
  catch(e){ return {x:0,y:0,w:img.naturalWidth,h:img.naturalHeight}; } // e.g. file:// canvas taint
  let minX=oc.width,minY=oc.height,maxX=0,maxY=0,found=false;
  for(let y=0;y<oc.height;y++){
    for(let x=0;x<oc.width;x++){
      const i=(y*oc.width+x)*4;
      const a=data[i+3];
      if(a<24) continue;
      if(excludeGroundSmoke){
        const r=data[i],g=data[i+1],b=data[i+2];
        // the baked-in dust/smoke puff is near-white and low-contrast — treat
        // it as background so it doesn't drag the bounding box (and the feet
        // anchor point) downward
        if(r>222&&g>218&&b>206&&Math.abs(r-g)<14&&Math.abs(g-b)<22) continue;
      }
      found=true;
      if(x<minX)minX=x; if(x>maxX)maxX=x;
      if(y<minY)minY=y; if(y>maxY)maxY=y;
    }
  }
  if(!found) return {x:0,y:0,w:img.naturalWidth,h:img.naturalHeight};
  return {x:minX,y:minY,w:maxX-minX+1,h:maxY-minY+1};
}

// ─── PLAYER SPRITE ───────────────────────────────────────────
const playerSprite = new Image();
let playerSpriteLoaded = false;
let playerSpriteBBox = null;
playerSprite.onload = () => {
  playerSpriteBBox = computeSpriteBBox(playerSprite, true);
  playerSpriteLoaded = true;
};
playerSprite.src = assetURL("bagodino.png");

// ─── PLAYER SPRITE METRICS ───────────────────────────────────
// Single source of truth for how large the dino is actually drawn and where
// the jetpack nozzle sits on it, so rendering and thrust-particle spawning
// can never drift apart. Everything here derives from the sprite's DRAWN rect
// (which is bigger than the physics hitbox and anchored at the feet), not
// from PLAYER_W/PLAYER_H — anchoring the flame to the hitbox instead put it
// out of the dino's hip rather than out of the backpack nozzles.
const SPRITE_SCALE = 1.6;     // drawn height ÷ hitbox height
const JET_NOZZLE_FX = 0.25;   // nozzle X as a fraction of sprite width, measured from its BACK edge
const JET_NOZZLE_FY = 0.60;   // nozzle Y as a fraction of sprite height, measured from its TOP
function playerSpriteMetrics(){
  const dh=PLAYER_H*SPRITE_SCALE;
  const bb=playerSpriteBBox;
  const dw=bb ? bb.w*(dh/bb.h) : PLAYER_W*SPRITE_SCALE;
  const centerX=player.x+PLAYER_W/2;  // world space
  const feetY=player.y+PLAYER_H;      // world space
  return {
    dw, dh, centerX, feetY,
    // mirrors correctly with facing: the nozzle always stays on the back
    nozzleX: centerX+player.facing*dw*(JET_NOZZLE_FX-0.5),
    nozzleY: feetY-dh*(1-JET_NOZZLE_FY)
  };
}

// ─── DRAW PLAYER (sprite-based) ───────────────────────────────
function drawPlayer(){
  const p=player;
  const px=p.x+PLAYER_W/2-camX, py=p.y+PLAYER_H;
  const facing=p.facing;
  const cxWorld=p.x+PLAYER_W/2;

  // contact shadow: find the nearest solid platform top directly beneath the
  // dino and pin a soft dark ellipse to it, so the sprite reads as standing
  // ON the scene instead of floating pasted over it
  let groundY=null;
  for(const pf of platforms){
    if(pf.lavaPit) continue;
    if(cxWorld>=pf.x && cxWorld<=pf.x+pf.w && pf.y>=p.y+PLAYER_H-2){
      if(groundY===null||pf.y<groundY) groundY=pf.y;
    }
  }
  if(groundY!==null){
    const distToGround=groundY-(p.y+PLAYER_H);
    // a proper dark, semi-transparent contact shadow (rgba(0,0,0,0.4) at its
    // strongest, right underfoot) that pins the dino to the platform surface
    const shadowAlpha=clamp(0.4-distToGround*0.003,0.08,0.4);
    const shadowScale=clamp(1-distToGround*0.003,0.35,1);
    ctx.fillStyle=`rgba(0,0,0,${shadowAlpha})`;
    ctx.beginPath();
    ctx.ellipse(px,groundY+3,PLAYER_W*0.44*shadowScale,8*shadowScale,0,0,Math.PI*2);
    ctx.fill();
  }

  // is the dino currently over a lava pit? (used for the belly light-up below)
  let overLava=false;
  for(const lp of lavaPits){
    if(cxWorld>=lp.x-10 && cxWorld<=lp.x+lp.w+10){ overLava=true; break; }
  }

  ctx.save();
  ctx.translate(px,py);
  ctx.scale(facing,1);

  if(p.invuln>0 && Math.floor(p.invuln*12)%2===0){ ctx.globalAlpha=0.4; }

  let headTopY;
  if(playerSpriteLoaded){
    // draw from the tight, smoke-excluded bounding box (see computeSpriteBBox)
    // so the dino's actual feet — not empty margin or the baked-in dust puff —
    // land exactly on the ground/shadow anchor point below
    const bb=playerSpriteBBox;
    const m=playerSpriteMetrics();
    const dh=m.dh, dw=m.dw;
    ctx.drawImage(playerSprite,bb.x,bb.y,bb.w,bb.h,-dw/2,-dh,dw,dh);
    headTopY=-dh;
  } else {
    ctx.fillStyle="#ff0000";
    ctx.fillRect(-PLAYER_W/2,-PLAYER_H,PLAYER_W,PLAYER_H);
    headTopY=-PLAYER_H;
  }

  // ambient lava glow: a faint constant warm undertint on the lower half from
  // the cave's general lava-lit atmosphere, boosted into a stronger spotlight
  // when actually hovering over an open lava pit
  ctx.globalCompositeOperation="lighter";
  const ambientG=ctx.createRadialGradient(0,-PLAYER_H*0.1,2,0,-PLAYER_H*0.1,PLAYER_W*0.9);
  ambientG.addColorStop(0,`rgba(255,110,20,${overLava?0.5:0.16})`);
  ambientG.addColorStop(1,"rgba(255,80,0,0)");
  ctx.fillStyle=ambientG;
  ctx.beginPath(); ctx.ellipse(0,-PLAYER_H*0.1,PLAYER_W*(overLava?1.1:0.9),PLAYER_H*0.4,0,0,Math.PI*2); ctx.fill();
  ctx.globalCompositeOperation="source-over";

  // jetpack back-light glow, sat on the backpack tanks themselves. Inside this
  // transform local -x is always "behind" the dino (the sprite draws mirrored),
  // and sizing off the drawn sprite keeps it on the art at any scale.
  const met=playerSpriteMetrics();
  const backGlowAlpha=p.jetpack?0.9:0.3;
  ctx.shadowColor="#00e5ff"; ctx.shadowBlur=15;
  ctx.fillStyle=`rgba(0,229,255,${backGlowAlpha})`;
  ctx.beginPath(); ctx.arc(met.dw*(0.32-0.5),-met.dh*0.67,4,0,Math.PI*2); ctx.fill();
  ctx.shadowBlur=0;

  // small jetpack fuel bar hovering just above the dino's head
  ctx.globalAlpha=1;
  const fbW=34, fbH=5, fbY=headTopY-12;
  ctx.fillStyle="rgba(0,0,0,0.55)";
  ctx.fillRect(-fbW/2,fbY,fbW,fbH);
  const fuelColor=player.jetFuel>0.3?"#44aaff":"#ff4422";
  ctx.shadowColor=fuelColor; ctx.shadowBlur=6;
  ctx.fillStyle=fuelColor;
  ctx.fillRect(-fbW/2,fbY,fbW*player.jetFuel,fbH);
  ctx.shadowBlur=0;

  // active power-up aura — a rotating neon ring tinted by whichever power is
  // active, fading out smoothly as its timer runs down
  if(p.activePower){
    const ap=p.activePower;
    const fade=clamp(ap.timer/1.0,0,1); // last second fades the glow out instead of a hard cutoff
    ctx.save();
    ctx.globalCompositeOperation="lighter";
    ctx.rotate(t*(ap.kind==="shield"?3:1.5));
    ctx.shadowColor=ap.color; ctx.shadowBlur=16*fade;
    ctx.strokeStyle=ap.color; ctx.globalAlpha=0.7*fade; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(0,-PLAYER_H*0.55,PLAYER_W*0.85,0,Math.PI*1.5); ctx.stroke();
    ctx.globalAlpha=1;
    ctx.restore();
    ctx.shadowBlur=0;
  }

  ctx.restore();
}

// ─── BEAM SPRITES ─────────────────────────────────────────────
// beam.png and beam_hyper.png both point RIGHT and are vertically centred on
// their bright core. These fractions are the measured height of that bright
// core within the full frame — sizing the art by them makes the drawn core
// line up with the hitscan `thickness` instead of being eyeballed. Both are
// drawn with 'lighter', which is also what makes beam_hyper.png's opaque
// black background disappear (adding zero) and leaves only the energy.
const beamSprite=new Image(); let beamLoaded=false;
beamSprite.onload=()=>{ beamLoaded=true; };
beamSprite.src=assetURL("beam.png");
const beamHyperSprite=new Image(); let beamHyperLoaded=false;
beamHyperSprite.onload=()=>{ beamHyperLoaded=true; };
beamHyperSprite.src=assetURL("beam_hyper.png");
const BEAM_CORE_FRAC=0.130, BEAM_HYPER_CORE_FRAC=0.250;

// ─── DRAW CONTINUOUS PLASMA LASER ─────────────────────────────
// Draws one pass of drawLaser per ray. Swapping laser.mouthY around the
// existing single-ray renderer keeps that renderer untouched — it is a
// hundred lines of carefully tuned bloom and sprite fitting.
function drawLaserAll(){
  if(!laser) return;
  const ys=laser.ys||[laser.mouthY];
  const saved=laser.mouthY;
  for(const ry of ys){ laser.mouthY=ry; drawLaser(); }
  laser.mouthY=saved;
}
function drawLaser(){
  if(!laser) return;
  const mx=laser.mouthX-camX;
  const tipX=mx+laser.dir*laser.len;
  const y=laser.mouthY;
  const half=laser.thickness/2;
  const x0=Math.min(mx,tipX), x1=Math.max(mx,tipX);

  // fever mode and the HYPER BEAM pickup both swap in the thick lightning
  // sprite (laser.fever is set from feverMode || hyperActive), and the
  // hitscan thickness they carry is likewise doubled
  const hyper=!!laser.fever;
  const sprite=hyper?beamHyperSprite:beamSprite;
  const spriteReady=hyper?beamHyperLoaded:beamLoaded;

  // additive blending gives the beam a real bloom where it overlaps sparks,
  // embers and itself, instead of just a flat translucent bar
  ctx.save();
  ctx.globalCompositeOperation="lighter";

  // ── the code-drawn core beam ALWAYS draws ──
  // beam.png is shaped like an impact flare — thin and very faint at its tail,
  // bright only at the head — so stretched across a long shot its first half
  // essentially vanishes. Drawing a solid molten core underneath guarantees a
  // readable beam whether or not the PNG has loaded (or is even present).
  ctx.lineCap="round";
  const coreW=laser.thickness*1.75;   // 8px hitscan -> 14px core, doubled in fever/hyper

  // wide outer glow
  ctx.strokeStyle=hyper?"rgba(255,60,140,0.30)":"rgba(255,120,0,0.30)";
  ctx.lineWidth=coreW*2.6;
  ctx.beginPath(); ctx.moveTo(mx,y); ctx.lineTo(tipX,y); ctx.stroke();

  // molten core
  ctx.shadowColor=hyper?"#ff2266":"#ff6600"; ctx.shadowBlur=18;
  ctx.strokeStyle=hyper?"#ff4488":"#ffaa00";
  ctx.lineWidth=coreW;
  ctx.beginPath(); ctx.moveTo(mx,y); ctx.lineTo(tipX,y); ctx.stroke();

  // white-hot centre line
  ctx.shadowColor="#ffffff"; ctx.shadowBlur=10;
  ctx.strokeStyle="rgba(255,250,220,0.95)";
  ctx.lineWidth=Math.max(2,coreW*0.34);
  ctx.beginPath(); ctx.moveTo(mx,y); ctx.lineTo(tipX,y); ctx.stroke();
  noGlow();

  // ── the sprite, blended on top of that core when it's available ──
  if(spriteReady){
    // draw height comes from the measured bright-core fraction, so the art's
    // core lines up with the hitscan thickness and the rest reads as flare
    const drawH=laser.thickness/(hyper?BEAM_HYPER_CORE_FRAC:BEAM_CORE_FRAC);
    ctx.save();
    ctx.translate(mx,y);
    if(laser.dir<0) ctx.scale(-1,1);  // art points right; mirror when firing left
    ctx.drawImage(sprite,0,-drawH/2,Math.max(1,laser.len),drawH);
    ctx.restore();
  }
  ctx.restore();

  // impact sparks + forking yellow lightning where it strikes an enemy
  if(laser.hitEnemy){
    ctx.strokeStyle="rgba(255,238,80,0.9)"; ctx.lineWidth=laser.fever?3:2;
    ctx.beginPath();
    ctx.moveTo(tipX,y);
    ctx.lineTo(tipX+laser.dir*14,y+rnd(-11,11));
    ctx.lineTo(tipX+laser.dir*26,y+rnd(-15,15));
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(tipX,y);
    ctx.lineTo(tipX+laser.dir*10,y+rnd(-16,16));
    ctx.stroke();
    glow("#ffee44",14);
    ctx.fillStyle="#fffde7";
    ctx.beginPath(); ctx.arc(tipX,y,4,0,Math.PI*2); ctx.fill();
    noGlow();
  }
}

// ─── DRAW ENEMY DROPS (piñata gems + coins) ───────────────────
function drawDrops(){
  for(const d of drops){
    const dx=d.x-camX, dy=d.y;
    if(d.kind==="bosscoin"){
      // the Alpha's bounty — a fat spinning coin worth 4x a normal one. The
      // horizontal squash is a fake 3D spin, so it reads even in a big pile.
      const spin=Math.abs(Math.cos(d.rot+t*4));
      glow("#ffcc00",20);
      ctx.fillStyle="#ffcc00";
      ctx.beginPath(); ctx.ellipse(dx,dy,4+10*spin,14,0,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle="#ff9900"; ctx.lineWidth=2;
      ctx.beginPath(); ctx.ellipse(dx,dy,4+10*spin,14,0,0,Math.PI*2); ctx.stroke();
      if(spin>0.45){
        ctx.fillStyle="#fff3a0";
        ctx.font="bold 13px 'Courier New',monospace";
        ctx.textAlign="center"; ctx.fillText("★",dx,dy+5); ctx.textAlign="left";
      }
    } else if(d.kind==="coin"){
      glow("#ffdd00",14);
      ctx.fillStyle="#ffdd00";
      ctx.beginPath(); ctx.arc(dx,dy,9,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle="#ffaa00"; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(dx,dy,9,0,Math.PI*2); ctx.stroke();
      ctx.fillStyle="rgba(255,255,220,0.7)";
      ctx.beginPath(); ctx.arc(dx-2,dy-2,2.5,0,Math.PI*2); ctx.fill();
    } else if(d.kind==="fuel"){
      glow("#44aaff",14);
      ctx.fillStyle="#2a3060"; ctx.fillRect(dx-5,dy-8,10,16);
      ctx.fillStyle="#44aaff"; ctx.fillRect(dx-5,dy-8,10,5);
      ctx.fillStyle="rgba(200,240,255,0.8)"; ctx.fillRect(dx-2,dy-1,4,6);
    } else {
      const cols=dropColors(d.kind);
      glow(cols[0],12);
      ctx.save();
      ctx.translate(dx,dy);
      ctx.rotate(d.rot+t*1.5);
      ctx.fillStyle=cols[0];
      ctx.fillRect(-6,-6,12,12);
      ctx.fillStyle=cols[1];
      ctx.fillRect(-3,-3,6,6);
      ctx.restore();
    }
    noGlow();
  }
}

// ─── DRAW POWER-UP BOXES ───────────────────────────────────────
function drawPowerUpBoxes(){
  for(const box of powerUpBoxes){
    if(!box.alive) continue;
    const bx=box.x-camX, by=box.y+Math.sin(t*1.6+box.bob)*6;
    glow("#ffdd44",18+6*Math.sin(t*4+box.bob));
    // golden crystal/egg shell
    const g=ctx.createLinearGradient(bx,by-14,bx,by+14);
    g.addColorStop(0,"#fff3b0"); g.addColorStop(0.5,"#ffcc33"); g.addColorStop(1,"#cc8800");
    ctx.fillStyle=g;
    ctx.beginPath();
    ctx.moveTo(bx,by-14);
    ctx.quadraticCurveTo(bx+12,by-6,bx+10,by+8);
    ctx.quadraticCurveTo(bx+6,by+16,bx,by+16);
    ctx.quadraticCurveTo(bx-6,by+16,bx-10,by+8);
    ctx.quadraticCurveTo(bx-12,by-6,bx,by-14);
    ctx.closePath(); ctx.fill();
    // inner facets
    ctx.strokeStyle="rgba(255,255,255,0.5)"; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(bx,by-14); ctx.lineTo(bx,by+16); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(bx-8,by); ctx.lineTo(bx+8,by); ctx.stroke();
    noGlow();
  }
}

// ─── DRAW WEAPON PICKUPS (Sulfur Essence / Magma Crystal) ──────
function drawWeaponPickups(){
  for(const wp of weaponPickups){
    if(!wp.alive) continue;
    const wx=wp.x-camX, wy=wp.y+Math.sin(t*1.6+wp.bob)*6;
    const w=WEAPONS[wp.kind]||WEAPONS.spread;
    const pulse=0.6+0.4*Math.sin(t*4+wp.bob);
    // the capsule spins, the letter does not — you have to be able to read it
    glow(w.color,14+8*pulse);
    ctx.save();
    ctx.translate(wx,wy);
    ctx.rotate(t*1.2+wp.bob);
    ctx.fillStyle="rgba(8,6,14,0.85)";
    ctx.fillRect(-13,-13,26,26);
    ctx.strokeStyle=w.color; ctx.lineWidth=2;
    ctx.strokeRect(-13,-13,26,26);
    ctx.restore();
    ctx.font="bold 17px 'Courier New',monospace";
    ctx.fillStyle=w.color;
    ctx.textAlign="center";
    ctx.fillText(w.letter,wx,wy+6);
    ctx.textAlign="left";
    noGlow();
  }
}

// ─── DRAW PLAYER LAVA BOMBS ─────────────────────────────────────
function drawPlayerBombs(){
  for(const b of playerBombs){
    const bx=b.x-camX;
    glow("#ff5500",16);
    ctx.fillStyle="#ff6600";
    ctx.beginPath(); ctx.arc(bx,b.y,8,0,Math.PI*2); ctx.fill();
    ctx.fillStyle="#ffdd44";

// ─── DRAW CAPTIVE CAGES ─────────────────────────────────────────
function drawCages(){
  for(const cage of cages){
    if(!cage.alive) continue;
    const cx=cage.x-camX, cy=cage.y;
    // dark cell behind the captive so it reads as being inside something
    ctx.fillStyle="rgba(8,4,14,0.55)";
    ctx.fillRect(cx-15,cy-21,30,42);
    // the captive, looking out toward the player. A frozen one is drawn as
    // its ice block — that sheet IS the cage.
    if(cage.species==="frozen"){
      if(!drawSpeciesArt("frozen",cx,cy,44,44,player.x>cage.x?1:-1)){
        ctx.fillStyle="#9fd8f5"; ctx.fillRect(cx-18,cy-20,36,40);
      }
      const melt=1-clamp(cage.hp,0,1);
      if(melt>0.02){
        glow("#bae6fd",10);
        ctx.strokeStyle=`rgba(255,220,150,${0.3+0.6*melt})`; ctx.lineWidth=2;
        ctx.strokeRect(cx-20-melt*3,cy-22-melt*3,40+melt*6,44+melt*6);
        noGlow();
      }
      continue;
    }
    drawBaby(cx,cy+2,34,player.x>cage.x?1:-1,cage.species);
    // cage bars, drawn OVER the captive
    ctx.strokeStyle="#8a8a95"; ctx.lineWidth=3;
    for(let i=-12;i<=12;i+=8){
      ctx.beginPath(); ctx.moveTo(cx+i,cy-20); ctx.lineTo(cx+i,cy+20); ctx.stroke();
    }
    ctx.beginPath(); ctx.moveTo(cx-14,cy-20); ctx.lineTo(cx+14,cy-20); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx-14,cy+20); ctx.lineTo(cx+14,cy+20); ctx.stroke();
    // a hint that it needs to be shot, not walked into
    if(Math.sin(t*3)>0.3){
      ctx.fillStyle="rgba(255,255,255,0.7)"; ctx.font="9px 'Courier New',monospace";
      ctx.textAlign="center"; ctx.fillText("SHOOT ME",cx,cy-26); ctx.textAlign="left";
    }
  }
}

// ─── DRAW BABY DINOS (freed from cages, scampering off) ────────
function drawBabyDinos(){
  for(const bd of babyDinos){
    const bx=bd.x-camX;
    const bob=Math.abs(Math.sin(t*12))*4;   // a little scampering hop
    ctx.globalAlpha=clamp(bd.life,0,1);     // fades as it escapes off-screen
    drawBaby(bx,bd.y-bob,34,bd.vx>=0?1:-1);
    ctx.globalAlpha=1;
  }
}

// ─── DRAW MAGMA BURSTS (dynamic lava hazard) ───────────────────
function drawMagmaBursts(){
  const TH=themeOf();
  for(const m of magmaBursts){
    const mx=m.x-camX, my=m.y;

    ctx.fillStyle=TH.liquid[0];
    ctx.beginPath(); ctx.arc(mx,my,6,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=TH.surface;
    ctx.beginPath(); ctx.arc(mx-1,my-1,2.5,0,Math.PI*2); ctx.fill();

}

// ─── STOMP SHOCKWAVES (the walker's signature) ───────────────
// A wave that runs along the ground line. It only hits a grounded player,
// so jumping over one is the answer — the walker punishes standing still,
// which is exactly the opposite of what the flyers punish.
function updateShockwaves(dt){
  for(let i=shockwaves.length-1;i>=0;i--){
    const sw=shockwaves[i];
    sw.x+=sw.dir*420*dt;
    sw.life+=dt;
    if(sw.life>3.2||sw.x<camX-120||sw.x>camX+W+120){ shockwaves.splice(i,1); continue; }
    if(player.invuln<=0 && player.onGround &&
       Math.abs((player.x+PLAYER_W/2)-sw.x)<26 &&
       Math.abs((player.y+PLAYER_H)-GROUND_Y)<50){
      takeDamage("enemy");
    }
    if(Math.random()<dt*30) spawnParticles(sw.x-camX,GROUND_Y-6,1,
      ["#ff8800","#ffcc44","#ffffff"],
      {minSpd:30,maxSpd:110,upBias:80,minLife:0.2,maxLife:0.5,type:"square",gravity:200,minSz:2,maxSz:5});
  }
}
function drawShockwaves(){
  for(const sw of shockwaves){
    const sx=sw.x-camX;
    if(sx<-40||sx>W+40) continue;
    const hgt=26+6*Math.sin(t*20+sw.life*8);
    ctx.save();
    ctx.globalCompositeOperation="lighter";
    glow("#ff6600",16);
    const g=ctx.createLinearGradient(0,GROUND_Y-hgt,0,GROUND_Y);
    g.addColorStop(0,"rgba(255,180,60,0)");
    g.addColorStop(1,"rgba(255,120,20,0.9)");
    ctx.fillStyle=g;
    ctx.beginPath();
    ctx.moveTo(sx-16,GROUND_Y);
    ctx.lineTo(sx,GROUND_Y-hgt);
    ctx.lineTo(sx+16,GROUND_Y);
    ctx.closePath(); ctx.fill();
    noGlow();
    ctx.restore();
  }
}

// ─── DRAW BOSS LAVA BALLS ───────────────────────────────────────
function drawLavaBalls(){
  for(const lb of lavaBalls){
    const lx=lb.x-camX, ly=lb.y;
    if(lb.acid){
      // spore ball / acid drip / chill round — themed ammunition
      const p=0.5+0.5*Math.sin(t*12);
      if(lb.chill){
        glow("#7dd3fc",16+6*p);
        ctx.fillStyle="#7dd3fc";
        ctx.beginPath(); ctx.arc(lx,ly,8,0,Math.PI*2); ctx.fill();
        ctx.fillStyle="#f0fbff";
        ctx.beginPath(); ctx.arc(lx-2,ly-2,3,0,Math.PI*2); ctx.fill();
        // a frost trail behind it
        if(Math.random()<0.5) spawnParticles(lx,ly,1,["#dff6ff","#7dd3fc"],
          {minSpd:5,maxSpd:20,minLife:0.2,maxLife:0.5,type:"square",gravity:10,minSz:1,maxSz:3});
        noGlow();
        continue;
      }
      glow("#10b981",14+6*p);
      ctx.fillStyle="#10b981";
      ctx.beginPath(); ctx.ellipse(lx,ly,8,9+2*p,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle="#a7f3d0";
      ctx.beginPath(); ctx.arc(lx-2,ly-3,3,0,Math.PI*2); ctx.fill();
      noGlow();
      if(Math.random()<0.3) spawnParticles(lx,ly+6,1,["#34d399","#a7f3d0"],
        {minSpd:5,maxSpd:25,minLife:0.15,maxLife:0.4,type:"circle",gravity:60,minSz:1,maxSz:2});
      continue;
    }
    if(lb.parry){
      // Cuphead's rule: if it is pink, you can hit it. A parryable shot
      // pulses magenta and wears a ring so it never reads as ordinary fire.
      const p=0.5+0.5*Math.sin(t*16);
      glow("#ff2fb0",18+10*p);
      ctx.fillStyle="#ff2fb0";
      ctx.beginPath(); ctx.arc(lx,ly,10,0,Math.PI*2); ctx.fill();
      ctx.fillStyle="#ffd6f2";
      ctx.beginPath(); ctx.arc(lx-2,ly-2,4,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle=`rgba(255,120,220,${0.5+0.5*p})`; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(lx,ly,14+3*p,0,Math.PI*2); ctx.stroke();
      noGlow();
      continue;
    }
    glow("#ff4400",16);
    ctx.fillStyle="#ff5500";
    ctx.beginPath(); ctx.arc(lx,ly,10,0,Math.PI*2); ctx.fill();
    ctx.fillStyle="#ffcc44";
    ctx.beginPath(); ctx.arc(lx-2,ly-2,4,0,Math.PI*2); ctx.fill();
    noGlow();
  }
}

// ─── DRAW BOSS FLAME BURSTS (attack 2 — vertical column) ───────
function drawBossFlameBursts(){
  for(const fb of bossFlameBursts){
    const fx=fb.x-camX;
    if(fb.life<=0.4){
      // telegraph: a thin pulsing warning line before the column ignites
      const warn=0.4+0.4*Math.sin(t*20);
      ctx.strokeStyle=`rgba(${themeOf().haze},${warn})`; ctx.lineWidth=3;
      ctx.beginPath(); ctx.moveTo(fx,fb.y); ctx.lineTo(fx,LAVA_Y); ctx.stroke();
    } else {
      ctx.save();
      ctx.globalCompositeOperation="lighter";
      const TH=themeOf();
      glow(TH.glow,22);
      const g=ctx.createLinearGradient(fx-14,0,fx+14,0);
      g.addColorStop(0,`rgba(${TH.haze},0)`);
      g.addColorStop(0.5,`rgba(${TH.haze},0.85)`);
      g.addColorStop(1,`rgba(${TH.haze},0)`);
      ctx.fillStyle=g;
      ctx.fillRect(fx-14,fb.y,28,LAVA_Y-fb.y);
      noGlow();
      ctx.restore();
    }
  }
}

// ─── BOSS SPRITE (enemyboss.png) ────────────────────────────────
const bossSprite=new Image();
let bossSpriteLoaded=false;
bossSprite.onload=()=>{ bossSpriteLoaded=true; };
bossSprite.src=assetURL("enemyboss.png");

// ─── DRAW BOSS ───────────────────────────────────────────────
// The general sprite registry: bosses, forest fauna, anything that names its
// own art. Sprites load lazily, are trimmed by computeSpriteBBox on arrival,
// and every caller has a fallback — a missing file costs a silhouette, not a
// crash.
//
// SPECIES holds which way each sheet was drawn, because they disagree: the
// dragonfly and the spitter face left, the crawler and the trike face right.
// Everything mirrors off that rather than off a guess.
const SPECIES={
  forest_flyer:   {art:"forest_flyer.png",   faces:-1, w:66, h:40},
  forest_crawler: {art:"forest_crawler.png", faces: 1, w:58, h:44},
  forest_plant:   {art:"forest_plant.png",   faces:-1, w:50, h:54},
  trike:          {art:"baby_trike.png",     faces: 1},
  ice_flyer:      {art:"ice_flyer.png",      faces:-1, w:62, h:42},
  ice_crusher:    {art:"ice_crusher.png",    faces:-1, w:66, h:52},
  frozen:         {art:"baby_frozen.png",    faces:-1},
};
// Draws a registry sprite fitted into w*h, mirrored to face a direction.
// one place to read a species' toughness from
const ENEMY_HP={forest_crawler:4, forest_plant:3, forest_flyer:2,
                ice_crusher:4, ice_flyer:2};
function drawSpeciesArt(species,cx,cy,w,h,dir){
  const sp=SPECIES[species]; if(!sp) return false;
  const a=artFor(sp.art);
  if(!a||!a.loaded) return false;
  const bb=a.bbox||{x:0,y:0,w:a.img.naturalWidth,h:a.img.naturalHeight};
  const scale=Math.min(w/bb.w,h/bb.h);
  const dw=bb.w*scale, dh=bb.h*scale;
  ctx.save();
  ctx.translate(cx,cy);
  if(dir*sp.faces<0) ctx.scale(-1,1);
  ctx.drawImage(a.img,bb.x,bb.y,bb.w,bb.h,-dw/2,-dh/2,dw,dh);
  ctx.restore();
  return true;
}
const SPRITE_ART={};
function artFor(srcName){
  if(!srcName) return null;
  let e=SPRITE_ART[srcName];
  if(!e){
    e=SPRITE_ART[srcName]={img:new Image(), loaded:false, bbox:null};
    e.img.onload=()=>{ e.bbox=computeSpriteBBox(e.img,false); e.loaded=true; };
    e.img.src=assetURL(srcName);
  }
  return e;
}

function drawBoss(){
  if(!boss||boss.dead) return;
  const bx=boss.x-camX, by=boss.y;
  ctx.save(); ctx.translate(bx,by);

  if(boss.dying){
    drawDeathFlash(boss.w,boss.h);
    ctx.restore();
    return;
  }

  if(boss.hitFlash>0){
    ctx.globalAlpha=0.5+0.5*Math.sin(boss.hitFlash*30);
  }

  const art=artFor(boss.art);
  if(art&&art.loaded){
    // fit the trimmed art into the hitbox without stretching it, and mirror
    // it when the player is behind — the source sheets all face left
    const bb=art.bbox||{x:0,y:0,w:art.img.naturalWidth,h:art.img.naturalHeight};
    const scale=Math.min(boss.w/bb.w,boss.h/bb.h);
    const dw=bb.w*scale, dh=bb.h*scale;
    const faceRight=(player.x+PLAYER_W/2)>boss.x;
    ctx.save();
    if(faceRight) ctx.scale(-1,1);
    ctx.drawImage(art.img,bb.x,bb.y,bb.w,bb.h,-dw/2,-dh/2,dw,dh);
    ctx.restore();
    if(boss.phase>=2){
      // an enraged wash over the art, additive so it glows rather than muddies
      ctx.save();
      ctx.globalCompositeOperation="lighter";
      ctx.globalAlpha=0.22+0.12*Math.sin(t*9);
      ctx.fillStyle=boss.kind==="titan"?"#7dd3fc":"#ff2244";
      ctx.fillRect(-boss.w/2,-boss.h/2,boss.w,boss.h);
      ctx.restore();
    }
  } else {
    ctx.fillStyle="#ff0000";
    ctx.fillRect(-boss.w/2,-boss.h/2,boss.w,boss.h);
  }
  // the freeze breath, drawn in the boss's own local space
  if(boss.breathState&&boss.breathState!=="none"){
    const dir=boss.breathDir||-1;
    const bx=dir*boss.w*0.45, by=-boss.h*0.18;
    const reach=BOSS_BREATH_REACH;
    ctx.save();
    // the sweep is a rotation about the muzzle, so the wedge below is still
    // authored flat along dir and never had to learn about the arc
    ctx.translate(bx,by);
    ctx.rotate(dir*(boss.breathAngle||0));
    ctx.translate(-bx,-by);
    if(boss.breathState==="wind"){
      const warn=0.4+0.4*Math.sin(t*26);
      ctx.strokeStyle=`rgba(190,230,255,${warn})`; ctx.lineWidth=3;
      ctx.beginPath(); ctx.moveTo(bx,by); ctx.lineTo(bx+dir*reach,by); ctx.stroke();
    } else {
      ctx.globalCompositeOperation="lighter";
      glow("#7dd3fc",22);
      const g=ctx.createLinearGradient(bx,0,bx+dir*reach,0);
      g.addColorStop(0,"rgba(223,246,255,0.95)");
      g.addColorStop(0.6,"rgba(125,211,252,0.55)");
      g.addColorStop(1,"rgba(125,211,252,0)");
      ctx.fillStyle=g;
      const hgt=30+6*Math.sin(t*22);
      ctx.beginPath();
      ctx.moveTo(bx,by-10); ctx.lineTo(bx+dir*reach,by-hgt);
      ctx.lineTo(bx+dir*reach,by+hgt); ctx.lineTo(bx,by+10);
      ctx.closePath(); ctx.fill();
      noGlow();
    }
    ctx.restore();
  }

  // a telegraph flash right before a diving swoop
  if(boss.diveState==="telegraph"){
    ctx.save();
    ctx.globalCompositeOperation="lighter";
    ctx.globalAlpha=0.3+0.3*Math.sin(t*26);
    ctx.fillStyle="#ffee66";
    ctx.fillRect(-boss.w/2,-boss.h/2,boss.w,boss.h);
    ctx.restore();
  }
  ctx.globalAlpha=1;

  // boss HP bar (8 segments)
  const hbW=boss.w*0.9, hbY=-boss.h/2-20;
  ctx.fillStyle="rgba(0,0,0,0.6)"; ctx.fillRect(-hbW/2,hbY,hbW,10);
  const segW=hbW/boss.maxHp;
  for(let i=0;i<boss.maxHp;i++){
    ctx.fillStyle= i<boss.hp ? "#ff3322" : "rgba(255,255,255,0.15)";
    ctx.fillRect(-hbW/2+i*segW+1,hbY+1,segW-2,8);
  }
  ctx.fillStyle=boss.phase>=2?"#ff6677":"#fff";
  ctx.font="10px 'Courier New',monospace"; ctx.textAlign="center";
  ctx.fillText(boss.name+(boss.phase>=2?"  ⚠ FAZ 2":""),0,hbY-6);
  ctx.textAlign="left";

  ctx.restore();
}

// ─── DRAW HUD ────────────────────────────────────────────────
function drawHUD(){
  // hearts (top-left)
  for(let i=0;i<player.maxHp;i++){
    ctx.font="22px serif";
    ctx.fillText(i<player.hp?"❤️":"🖤",14+i*28,30);
  }

  // remaining credits, sitting just right of the hearts
  {
    const hx=14+player.maxHp*28+6;
    ctx.font="bold 12px 'Courier New',monospace";
    ctx.fillStyle=continuesLeft>0?"#8effc9":"#ff5577";
    ctx.fillText("CR",hx,26);
    for(let i=0;i<MAX_CONTINUES;i++){
      const on=i<continuesLeft;
      ctx.fillStyle=on?"#8effc9":"rgba(140,160,170,0.30)";
      if(on){ glow("#8effc9",6); }
      ctx.beginPath();
      ctx.arc(hx+26+i*13,22,4.5,0,Math.PI*2);
      ctx.fill();
      noGlow();
    }
  }

  // chain/fever box (top-right) — neon purple/pink framed panel
  const pad=12;
  const bw=260,bh=feverMode?144:120,bx=W-bw-8,by=8;
  ctx.fillStyle="rgba(12,0,24,0.84)";
  ctx.fillRect(bx,by,bw,bh);
  // neon purple → pink border, pulsing brighter during fever
  const borderG=ctx.createLinearGradient(bx,by,bx+bw,by);
  borderG.addColorStop(0,"#a21caf"); borderG.addColorStop(0.5,"#e879f9");
  borderG.addColorStop(1,"#ff2fb0");
  ctx.shadowColor="#e879f9"; ctx.shadowBlur=feverMode?16:8;
  ctx.strokeStyle=borderG; ctx.lineWidth=3;
  ctx.strokeRect(bx,by,bw,bh);
  noGlow();

  // line baselines, all measured down from box top with consistent padding
  let lineY=by+pad+14; // first line baseline

  // CHAIN
  ctx.textAlign="left";
  glow(feverMode?"#ff44aa":"#ffaa00",feverMode?14:6);
  const chainFontPx=feverMode?18:16;
  ctx.font=`bold ${chainFontPx}px 'Courier New',monospace`;
  ctx.fillStyle=feverMode?"#ff88cc":"#ffdd44";

  const chainTxt=`CHAIN: ${chain}X`;
  // rainbow each character if fever
  if(feverMode){
    const feverColors=["#ff2266","#ff8800","#ffee00","#00ff88","#44aaff","#aa44ff"];
    let cx2=bx+pad;
    for(let i=0;i<chainTxt.length;i++){
      ctx.fillStyle=feverColors[i%feverColors.length];
      ctx.fillText(chainTxt[i],cx2,lineY);
      cx2+=chainFontPx*0.62;
    }
  } else {
    ctx.fillText(chainTxt,bx+pad,lineY);
  }
  lineY+=chainFontPx+6;

  // FEVER MODE ACTIVE line — pulses hard in neon pink/purple/yellow
  if(feverMode){
    ctx.font="bold 12px 'Courier New',monospace";
    const pulse=0.6+0.4*Math.sin(t*14);
    const fc=["#ff2fb0","#e879f9","#ffee00","#ff2fb0","#e879f9"];
    const ft="FEVER MODE ACTIVE!";
    ctx.shadowBlur=6+10*pulse;
    let fx2=bx+pad;
    for(let i=0;i<ft.length;i++){
      ctx.shadowColor=fc[i%fc.length];
      ctx.fillStyle=fc[i%fc.length];
      ctx.fillText(ft[i],fx2,lineY); fx2+=9.8;
    }
    noGlow();
    lineY+=18;
  }

  noGlow();
  ctx.font="bold 15px 'Courier New',monospace";
  ctx.fillStyle="#ffffff";
  ctx.fillText(`SCORE: ${score.toLocaleString()}`,bx+pad,lineY);
  lineY+=18;
  ctx.font="bold 12px 'Courier New',monospace";
  ctx.fillStyle="#ffdd44";
  ctx.fillText(`HI-SCORE: ${Math.max(hiScore,score).toLocaleString()}`,bx+pad,lineY);
  lineY+=18;
  ctx.font="bold 11px 'Courier New',monospace";
  ctx.fillStyle="#aaaacc";
  {
    const si=stageInWorld();
    ctx.fillText(`STAGE ${si.pos+1}/${si.count} — ${LEVELS[levelIndex].name}`,bx+pad,lineY);
  }
  lineY+=16;
  ctx.font="bold 11px 'Courier New',monospace";
  // red-flashes while a hatchling is loose — that is a countdown, not a stat
  const loose=scaredBabies.length>0;
  ctx.fillStyle = loose ? (Math.sin(t*12)>0?"#ff3355":"#ffaabb")
        : (rescuedThisLevel>=LEVELS[levelIndex].cages.length?"#8effc9":"#ffcc66");
  const esc=followers.length;
  ctx.fillText(`RESCUE: ${rescuedThisLevel}/${LEVELS[levelIndex].cages.length}`+
               (esc?`  ESCORT x${esc}`:"")+(loose?"  !":""),bx+pad,lineY);

  // combo timer bar under score box
  if(chain>0){
    const barW=(chainTimer/CHAIN_WINDOW)*bw;
    ctx.fillStyle="rgba(255,100,0,0.3)"; ctx.fillRect(bx,by+bh,bw,4);
    ctx.fillStyle=feverMode?"#ff44aa":"#ff8800";
    glow(feverMode?"#ff44aa":"#ff8800",8);
    ctx.fillRect(bx,by+bh,barW,4);
    noGlow();
  }

  ctx.textAlign="left";

  drawPowerUpUI();
  drawWeaponUI();
  if(player.chilled>0){
    const fw=140,fx=W/2-fw/2,fy=player.activePower?88:46;
    ctx.fillStyle="rgba(8,20,34,0.8)"; ctx.fillRect(fx,fy,fw,20);
    ctx.strokeStyle="#7dd3fc"; ctx.lineWidth=2; ctx.strokeRect(fx,fy,fw,20);
    ctx.fillStyle="#bae6fd";

// ─── FEVER SCREEN FLASH ──────────────────────────────────────
function drawFeverOverlay(){
  if(feverFlash>0){
    ctx.fillStyle=`rgba(255,40,120,${feverFlash*0.35})`;
    ctx.fillRect(0,0,W,H);
    feverFlash=Math.max(0,feverFlash-0.04);
  }
  if(feverMode){
    // pulsing edge vignette
    const v=0.06+0.04*Math.sin(t*8);
    const vg=ctx.createRadialGradient(W/2,H/2,H*0.3,W/2,H/2,H*0.8);
    vg.addColorStop(0,"rgba(0,0,0,0)");
    vg.addColorStop(1,`rgba(180,0,100,${v})`);
    ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);

    // neon pulse hugging the screen edges — cycles pink/purple/cyan and
    // throbs in thickness, the classic arcade "fever" screen-border effect
    const pulse=0.5+0.5*Math.sin(t*9);
    const hue=(t*120)%360;
    const edgeColor=`hsl(${hue},100%,60%)`;
    ctx.save();
    ctx.globalCompositeOperation="lighter";
    ctx.shadowColor=edgeColor; ctx.shadowBlur=24+16*pulse;
    ctx.strokeStyle=edgeColor;
    ctx.lineWidth=6+6*pulse;
    ctx.strokeRect(ctx.lineWidth/2,ctx.lineWidth/2,W-ctx.lineWidth,H-ctx.lineWidth);
    ctx.restore();
  }
}

// ─── BOSS NAME CARD + RAGE BANNER ────────────────────────────
// Sunset Riders announced its bosses by name. So does this one: the card
// slides in from the left as the boss descends, holds, then slides out.
function drawBossCard(){
  if(bossCardTimer<=0||!boss) return;
  const total=2.6;
  const el=total-bossCardTimer;
  // 0.35s in, 0.35s out, hold between
  let slide=1;
  if(el<0.35) slide=el/0.35;
  else if(bossCardTimer<0.35) slide=bossCardTimer/0.35;
  const ease=slide*slide*(3-2*slide);       // smoothstep
  const cardW=430, cardH=74;
  const cx=lerp(-cardW-20,W/2-cardW/2,ease);
  const cy=H*0.62;

  ctx.save();
  ctx.globalAlpha=ease;
  ctx.fillStyle="rgba(8,2,12,0.92)";
  ctx.fillRect(cx,cy,cardW,cardH);
  ctx.shadowColor="#ff2244"; ctx.shadowBlur=18;
  ctx.strokeStyle="#ff3344"; ctx.lineWidth=2;
  ctx.strokeRect(cx,cy,cardW,cardH);
  noGlow();
  // a red spine down the left edge
  ctx.fillStyle="#ff2244";
  ctx.fillRect(cx,cy,6,cardH);

  ctx.textAlign="left";
  glow("#ff3344",12);
  ctx.font="bold 26px 'Courier New',monospace";
  ctx.fillStyle="#ff5566";
  ctx.fillText(boss.name,cx+20,cy+34);
  noGlow();
  if(boss.title){
    ctx.font="bold 12px 'Courier New',monospace";
    ctx.fillStyle="#ffaabb";
    ctx.fillText(boss.title,cx+20,cy+56);
  }
  ctx.restore();
  ctx.textAlign="left";
}
function drawBossRage(){

// ─── SCREEN SHAKE ────────────────────────────────────────────
let shakeX=0,shakeY=0;
function applyShake(dt){
  if(bossShakeTimer>0){
    // sustained, gentler shake for the boss-death moment, independent of the
    // normal fast-decaying hit shake
    bossShakeTimer=Math.max(0,bossShakeTimer-dt);
    shakeX=rnd(-4,4); shakeY=rnd(-4,4);
    return;
  }
  if(screenShake>0){
    shakeX=rnd(-screenShake,screenShake);
    shakeY=rnd(-screenShake,screenShake);
    screenShake=Math.max(0,screenShake-1.5);
  } else { shakeX=0;shakeY=0; }
}

// ─── END-OF-STAGE MISSION DEBRIEF ────────────────────────────
// The screen blacks out and the card types itself in on a retro terminal,
// one line at a time with a blinking block cursor. Shown for every stage;
// the final stage hands over to drawWin() once it is dismissed.
//
// Timing lives entirely in reportTimer, so the card is a pure function of
// elapsed time — no per-line state to reset or desync. The running cursor
// clock is published as reportTypeEnd so update() knows how long to keep
// clacking the typewriter.
const REPORT_CPS=40;          // characters per second
const REPORT_LINE_GAP=0.3;    // beat between lines
function drawMissionReport(){
  const total=LEVELS[levelIndex].cages.length;
  const isFinal=levelIndex>=LEVELS.length-1;
  const fade=clamp(reportTimer/0.7,0,1);
  ctx.fillStyle="rgba(0,0,0,"+(0.55+0.43*fade)+")";
  ctx.fillRect(0,0,W,H);
  ctx.textAlign="center";

  const bw=600,bh=300,bx=W/2-bw/2,by=H/2-bh/2;
  ctx.globalAlpha=fade;
  ctx.fillStyle="rgba(4,8,12,0.92)"; ctx.fillRect(bx,by,bw,bh);
  ctx.shadowColor="#00ff88"; ctx.shadowBlur=18;
  ctx.strokeStyle="#00ff88"; ctx.lineWidth=2; ctx.strokeRect(bx,by,bw,bh);
  noGlow();
  ctx.globalAlpha=1;

  // ── typewriter: each line starts where the one above it finished ──
  let cursorAt=0.55;   // when the next line begins typing
  function typeLine(text,y,font,color,glowPx){
    const dur=Math.max(0.01,text.length/REPORT_CPS);
    const started=reportTimer>=cursorAt;
    const prog=clamp((reportTimer-cursorAt)/dur,0,1);
    const startedAt=cursorAt;
    cursorAt+=dur+REPORT_LINE_GAP;
    if(!started) return false;
    const shown=text.slice(0,Math.ceil(text.length*prog));
    ctx.font=font;
    if(glowPx) glow(color,glowPx);
    ctx.fillStyle=color;
    // a block cursor rides the end of the line while it is still printing
    const typing=prog<1;
    const blink=typing||(reportTimer-startedAt-dur)<0.5;
    ctx.fillText(shown+((typing||blink)&&Math.sin(t*9)>0?"_":""),W/2,y);
    if(glowPx) noGlow();
    return prog>=1;
  }

  typeLine("GÖREV: BAŞARILI",by+58,"bold 34px 'Courier New',monospace","#00ff88",16);

  const tallyDone=typeLine("KURTARILAN YAVRULAR: ["+rescuedThisLevel+"/"+total+"]",
                           by+100,"bold 20px 'Courier New',monospace","#ffdd44",0);
  // one drawn hatchling per slot, revealed once its line has finished printing
  if(tallyDone){
    const slotW=46, startX=W/2-((total-1)*slotW)/2;
    for(let i2=0;i2<total;i2++){
      const sx=startX+i2*slotW;
      if(i2<rescuedThisLevel){
        glow("#ffcc55",10);
        drawBaby(sx,by+136+Math.sin(t*4+i2)*3,32,1,
                 (LEVELS[levelIndex].cages[i2]||{}).species);
        noGlow();
      } else {
        // an empty slot reads as a captive still behind bars
        ctx.strokeStyle="rgba(140,120,150,0.55)"; ctx.lineWidth=2;
        ctx.strokeRect(sx-12,by+122,24,30);
        ctx.beginPath(); ctx.moveTo(sx,by+122); ctx.lineTo(sx,by+152); ctx.stroke();
      }
    }
  }

  typeLine(LEVELS[levelIndex].escapeLine||"VOLKAN ÇEKİRDEĞİNDEN KAÇILDI",
           by+182,"bold 17px 'Courier New',monospace","#ff9955",10);
  typeLine("TOPLAM SKOR: "+score.toLocaleString(),
           by+212,"bold 16px 'Courier New',monospace","#ffffff",0);
  typeLine("KOMBO BONUSU: +"+lastComboBonus.toLocaleString()+
           "  (EN İYİ ZİNCİR: x"+bestChainThisLevel+")"+
           (parriesThisLevel?"  PARRY x"+parriesThisLevel:""),
           by+234,"bold 14px 'Courier New',monospace","#ff88cc",0);
  typeLine("KURTARMA BONUSU: +"+lastRescueBonus.toLocaleString()+
           (rescuedThisLevel>=total?"  ★ TAM KURTARMA ★":""),
           by+256,"bold 14px 'Courier New',monospace",
           rescuedThisLevel>=total?"#8effc9":"#ffcc66",0);

  if(isFinal){
    typeLine("SON BÖLÜM TAMAMLANDI",by+286,"bold 18px 'Courier New',monospace","#e879f9",10);
  } else {
    typeLine("SIRADAKİ: BÖLÜM "+(levelIndex+2)+" — "+LEVELS[levelIndex+1].name,
             by+286,"bold 18px 'Courier New',monospace","#e879f9",10);
  }

  // the grade sits in the panel's top-right corner, outside the typed lines,
  // so adding or rewording a line never has to move it
  if(reportTimer>0.5){
    const gx2=bx+bw-62, gy2=by+52;
    const gp=0.6+0.4*Math.sin(t*7);
    glow(GRADE_COLOR[lastGrade]||"#ffffff",14+10*gp);
    ctx.font="bold 58px 'Courier New',monospace";
    ctx.fillStyle=GRADE_COLOR[lastGrade]||"#ffffff";
    ctx.fillText(lastGrade||"-",gx2,gy2);
    noGlow();
    ctx.font="bold 10px 'Courier New',monospace";
    ctx.fillStyle="#aaaacc";
    ctx.fillText("DERECE  "+lastGradeScore,gx2,gy2+16);
    const best=bestGrades[levelIndex];
    if(best){
      ctx.fillStyle=lastGradeIsBest?"#ffee44":"#8899aa";
      ctx.fillText(lastGradeIsBest?"★ YENİ REKOR":"EN İYİ: "+best,gx2,gy2+30);
    }
  }

  // publish the finish time so update() can stop the typewriter clacks
  reportTypeEnd=cursorAt;

  // prompt — only once the panel will actually accept the key
  if(reportTimer>REPORT_MIN && Math.sin(t*6)>-0.3){
    ctx.font="bold 13px 'Courier New',monospace";
    ctx.fillStyle="#88ccaa";
    ctx.fillText("DEVAM ETMEK İÇİN  [ENTER]",W/2,by+bh+28);
  }
  ctx.textAlign="left";
}

// ─── MISSION SELECT (the world map) ──────────────────────────
// A 16-bit briefing screen: four nodes on a route, a CLEARED stamp on the
// ones behind you, padlocks on the ones ahead. Lock state lives in
// localStorage, so a refresh does not undo an evening's progress.
function drawWorldMap(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#05030f"); g.addColorStop(0.55,"#0b0722"); g.addColorStop(1,"#12061a");
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // the same starfield as the cave, drifting on its own
  for(const s of stars){
    const sx=((s.x+t*4)%W+W)%W;
    ctx.globalAlpha=0.25+0.35*Math.sin(t*1.5+s.twinkle);
    ctx.fillStyle="#b8d4ff";
    ctx.beginPath(); ctx.arc(sx,s.y*0.9+30,s.r,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;

  // header
  ctx.textAlign="center";
  const pulse=0.6+0.4*Math.sin(t*4);
  glow("#e879f9",14+8*pulse);
  ctx.font="bold 34px 'Courier New',monospace";
  ctx.fillStyle="#e879f9";
  ctx.fillText("MISSION SELECT",W/2,58);
  noGlow();
  ctx.font="bold 11px 'Courier New',monospace";
  ctx.fillStyle="#8899bb";
  ctx.fillText("NEON DINO-AGE  //  RESCUE PROTOCOL",W/2,78);

  const px2=i=>WORLDS[i].mx*W, py2=i=>WORLDS[i].my*H;

  // the route between nodes, dashed and animated
  ctx.save();
  ctx.setLineDash&&ctx.setLineDash([7,9]);
  ctx.lineDashOffset=-t*18;
  for(let i=0;i<WORLDS.length-1;i++){
    const open=worldState(i).cleared;
    ctx.strokeStyle=open?"rgba(142,255,201,0.75)":"rgba(120,130,170,0.30)";
    ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(px2(i),py2(i)); ctx.lineTo(px2(i+1),py2(i+1)); ctx.stroke();
  }
  ctx.restore();
  ctx.setLineDash&&ctx.setLineDash([]);

  // the nodes
  for(let i=0;i<WORLDS.length;i++){
    const w=WORLDS[i], st=worldState(i);
    const x=px2(i), y=py2(i);
    const sel=i===mapSel;
    const col=st.playable?w.color:"#5a6076";

    if(sel&&mapStampTimer<=0){
      glow(w.color,18+10*pulse);
      ctx.strokeStyle=w.color; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(x,y,34+3*pulse,0,Math.PI*2); ctx.stroke();
      noGlow();
    }
    // the node disc
    glow(col,st.playable?16:4);
    ctx.fillStyle="rgba(6,4,14,0.9)";
    ctx.beginPath(); ctx.arc(x,y,24,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle=col; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(x,y,24,0,Math.PI*2); ctx.stroke();
    noGlow();
    ctx.fillStyle=col;
    ctx.beginPath(); ctx.arc(x,y,11,0,Math.PI*2); ctx.fill();

    if(!st.unlocked||!w.levels.length){
      // padlock: shackle + body, drawn small so it reads at a glance
      ctx.strokeStyle="#cbd5e1"; ctx.lineWidth=2.5;
      ctx.beginPath(); ctx.arc(x,y-4,6,Math.PI,0); ctx.stroke();
      ctx.fillStyle="#cbd5e1";
      ctx.fillRect(x-8,y-3,16,12);
    }

    ctx.textAlign="center";
    ctx.font="bold 13px 'Courier New',monospace";
    ctx.fillStyle=st.playable?"#ffffff":"#8a90a6";
    ctx.fillText(w.name,x,y+46);
    ctx.font="bold 10px 'Courier New',monospace";
    ctx.fillStyle=st.playable?col:"#6a7188";
    ctx.fillText(w.sub,x,y+60);
    if(!w.levels.length){
      ctx.fillStyle="#6a7188";
      ctx.fillText("YAKINDA",x,y+74);
    }

    // CLEARED stamp — slams down on arrival, then just sits there
    if(st.cleared){
      let sc=1, rot=-0.22;
      if(mapStampTimer>0&&mapStampWorld===i){
        const el=2.4-mapStampTimer;
        sc = el<0.25 ? lerp(3.2,1,el/0.25) : 1;
        if(el<0.35) rot=-0.22+Math.sin(el*60)*0.05;
      }
      ctx.save();
      ctx.translate(x,y-4); ctx.rotate(rot); ctx.scale(sc,sc);
      ctx.globalAlpha=0.92;
      glow("#ff2244",12);
      ctx.strokeStyle="#ff2a45"; ctx.lineWidth=3;
      ctx.strokeRect(-52,-15,104,30);
      ctx.font="bold 18px 'Courier New',monospace";
      ctx.fillStyle="#ff3a53";
      ctx.fillText("CLEARED",0,7);
      noGlow();
      ctx.restore();
      ctx.globalAlpha=1;
    }
  }

  // briefing panel for the highlighted node
  const w=WORLDS[mapSel], st=worldState(mapSel);
  const bw=520,bh=62,bx=W/2-bw/2,by=H-84;
  ctx.fillStyle="rgba(4,4,12,0.88)"; ctx.fillRect(bx,by,bw,bh);
  ctx.strokeStyle=st.playable?w.color:"#5a6076"; ctx.lineWidth=2;
  ctx.strokeRect(bx,by,bw,bh);
  ctx.textAlign="left";
  ctx.font="bold 15px 'Courier New',monospace";
  ctx.fillStyle=st.playable?w.color:"#8a90a6";
  ctx.fillText(w.name,bx+14,by+22);
  ctx.font="bold 11px 'Courier New',monospace";
  ctx.fillStyle="#aab4cc";
  ctx.fillText(w.levels.length?(w.levels.length+" BÖLÜM"):"HENÜZ AÇILMADI",bx+14,by+40);
  const best=w.levels.map(l=>bestGrades[l]).filter(Boolean);
  if(best.length){
    ctx.fillStyle="#ffdd66";
    ctx.fillText("EN İYİ NOT: "+best.join(" "),bx+14,by+55);
  }
  ctx.textAlign="right";
  ctx.font="bold 11px 'Courier New',monospace";
  ctx.fillStyle="#88ccaa";
  if(mapStampTimer<=0&&Math.sin(t*6)>-0.4){
    ctx.fillText(st.playable?"[ENTER] GÖREVE BAŞLA":"KİLİTLİ",bx+bw-14,by+22);
  }
  ctx.fillStyle="#7788aa";
  ctx.fillText("◀ ▶  HEDEF SEÇ",bx+bw-14,by+42);
  ctx.textAlign="left";

  ctx.textAlign="center";
